'use strict';const CASES=[{"id":1,"dimension":"Account","title":"Revenue flow","member":"Revenue","property":"timeBalance","correct":"Flow","wrong":"Balance","problem":"Monthly revenue must aggregate across time.","inputs":[100,120,140],"formula":"sum","explanation":"Quarterly revenue is the sum of monthly revenue."},{"id":2,"dimension":"Account","title":"Inventory closing","member":"Closing_Inventory","property":"timeBalance","correct":"Balance","wrong":"Flow","problem":"Closing stock should not be summed across periods.","inputs":[120,140,160],"formula":"last","explanation":"Quarter-end stock equals March closing inventory."},{"id":3,"dimension":"Account","title":"Average headcount","member":"Average_Headcount","property":"timeBalance","correct":"Average","wrong":"Flow","problem":"Average headcount is a period-average measure.","inputs":[100,110,120],"formula":"avg","explanation":"Average of the three monthly headcounts."},{"id":4,"dimension":"Entity","title":"Entity parent rollup","member":"India_Total","property":"aggregation","correct":"+","wrong":"~","problem":"Sum Pune and Bhopal business units.","inputs":[50,70,0],"formula":"sum","explanation":"A consolidated parent aggregates included children."},{"id":5,"dimension":"Entity","title":"Entity exclusion","member":"Elimination_Unit","property":"aggregation","correct":"~","wrong":"+","problem":"Exclude a designated noncontributing member from this illustrative parent rollup.","inputs":[40,30,0],"formula":"zero","explanation":"The exclusion operator contributes zero to the parent."},{"id":6,"dimension":"Entity","title":"Reporting currency conversion","member":"India_Operations","property":"currency","correct":"INR","wrong":"USD","problem":"Translate INR source balances into USD using a supplied illustrative rate.","inputs":[8300,83,0],"formula":"fx","explanation":"INR amount divided by INR per USD rate."},{"id":7,"dimension":"Scenario","title":"Forecast horizon","member":"Forecast","property":"startPeriod","correct":"Jan","wrong":"Apr","problem":"Forecast months are bounded by the configured start period.","inputs":[12,4,0],"formula":"horizon","explanation":"January through April is four periods, inclusive."},{"id":8,"dimension":"Scenario","title":"Actualization cutoff","member":"Forecast","property":"actualThrough","correct":"Mar","wrong":"Jan","problem":"Blend three actual months with remaining forecast months.","inputs":[100,120,130],"formula":"sum","explanation":"This simplified exercise sums selected actual-month values."},{"id":9,"dimension":"Scenario","title":"Budget uplift","member":"Budget","property":"scenarioDriver","correct":"10%","wrong":"0%","problem":"Apply a budget scenario uplift to the baseline.","inputs":[1000,10,0],"formula":"uplift","explanation":"Baseline multiplied by one plus uplift percentage."},{"id":10,"dimension":"Version","title":"Working revision","member":"Working","property":"status","correct":"Working","wrong":"Final","problem":"Working plan incorporates a requested adjustment.","inputs":[1000,150,0],"formula":"add","explanation":"Working amount plus proposed revision."},{"id":11,"dimension":"Version","title":"Target allocation","member":"Target","property":"versionType","correct":"Target","wrong":"Bottom Up","problem":"Allocate target across units by a given weight.","inputs":[2000,35,0],"formula":"percent","explanation":"Target times the allocation weight."},{"id":12,"dimension":"Version","title":"Bottom-up collection","member":"Working","property":"versionType","correct":"Bottom Up","wrong":"Target","problem":"Collect submitted departmental budgets.","inputs":[450,550,0],"formula":"sum","explanation":"Bottom-up plan aggregates submitted budgets."},{"id":13,"dimension":"Period","title":"Quarter rollup","member":"Q1","property":"aggregation","correct":"+","wrong":"~","problem":"Aggregate three monthly flows into Q1.","inputs":[80,90,100],"formula":"sum","explanation":"Quarterly flow equals monthly sum."},{"id":14,"dimension":"Period","title":"Closing balance","member":"Mar","property":"periodRole","correct":"Closing","wrong":"Flow","problem":"Select closing balance for the period.","inputs":[40,45,50],"formula":"last","explanation":"Closing balance uses the final month."},{"id":15,"dimension":"Period","title":"Monthly average","member":"Q1","property":"periodRole","correct":"Average","wrong":"Flow","problem":"Calculate a period-average operating KPI.","inputs":[95,105,115],"formula":"avg","explanation":"Arithmetic mean for the illustrative KPI."},{"id":16,"dimension":"Year","title":"Annual forecast","member":"FY26","property":"yearStatus","correct":"Open","wrong":"Closed","problem":"Aggregate four quarterly revenue values.","inputs":[100,110,120,130],"formula":"sum4","explanation":"Four quarters total annual revenue."},{"id":17,"dimension":"Year","title":"Year-over-year growth","member":"FY27","property":"yearStatus","correct":"Planning","wrong":"Closed","problem":"Calculate growth between prior and current year.","inputs":[1200,1380,0],"formula":"growth","explanation":"Current less prior, divided by prior."},{"id":18,"dimension":"Year","title":"Rolling year extension","member":"FY28","property":"yearStatus","correct":"Planning","wrong":"Closed","problem":"Project next-year revenue with an annual growth assumption.","inputs":[1500,8,0],"formula":"uplift","explanation":"Current year multiplied by one plus growth."},{"id":19,"dimension":"Product","title":"Product family rollup","member":"EV_Family","property":"aggregation","correct":"+","wrong":"~","problem":"Roll up two electric vehicle models.","inputs":[240,360,0],"formula":"sum","explanation":"Product parent adds its base-level models."},{"id":20,"dimension":"Product","title":"Shared product reporting","member":"EV_Model_Shared","property":"storage","correct":"Shared","wrong":"Store","problem":"Display the same base model in an alternate reporting hierarchy without counting it twice.","inputs":[250,250,0],"formula":"first","explanation":"The alternate display is not added a second time."},{"id":21,"dimension":"Product","title":"Attribute-based EV mix","member":"EV_Products","property":"attribute","correct":"EV","wrong":"ICE","problem":"Calculate the EV proportion of product sales.","inputs":[420,700,0],"formula":"ratio","explanation":"EV units divided by total units."},{"id":22,"dimension":"Channel","title":"Omnichannel sales","member":"All_Channels","property":"aggregation","correct":"+","wrong":"~","problem":"Aggregate store and online sales.","inputs":[500,300,0],"formula":"sum","explanation":"Channel parent combines its base children."},{"id":23,"dimension":"Channel","title":"Online share","member":"Online","property":"attribute","correct":"Digital","wrong":"Physical","problem":"Calculate online share of total sales.","inputs":[300,800,0],"formula":"ratio","explanation":"Online sales divided by all-channel sales."},{"id":24,"dimension":"Channel","title":"Alternate hierarchy","member":"Online_Shared","property":"storage","correct":"Shared","wrong":"Store","problem":"Show Online under a second reporting view without duplicate contribution.","inputs":[300,300,0],"formula":"first","explanation":"A shared reporting reference must not be double counted."},{"id":25,"dimension":"Cost Center","title":"Department rollup","member":"Manufacturing","property":"aggregation","correct":"+","wrong":"~","problem":"Aggregate production and quality assurance costs.","inputs":[620,180,0],"formula":"sum","explanation":"Manufacturing parent sums the two departments."},{"id":26,"dimension":"Cost Center","title":"Cost allocation","member":"IT_Shared","property":"allocation","correct":"35%","wrong":"0%","problem":"Allocate IT shared-service cost to production.","inputs":[400,35,0],"formula":"percent","explanation":"Cost pool times assigned allocation percentage."},{"id":27,"dimension":"Cost Center","title":"Overhead recovery","member":"Factory","property":"driver","correct":"Machine Hours","wrong":"Headcount","problem":"Apply overhead rate to machine hours.","inputs":[900,12,0],"formula":"multiply","explanation":"Machine hours times cost per hour."},{"id":28,"dimension":"Customer","title":"Customer group rollup","member":"All_Customers","property":"aggregation","correct":"+","wrong":"~","problem":"Aggregate fleet and retail customer demand.","inputs":[340,460,0],"formula":"sum","explanation":"Customer hierarchy adds distinct base customers."},{"id":29,"dimension":"Customer","title":"Dealer discount","member":"Dealer_Group","property":"discount","correct":"5%","wrong":"0%","problem":"Apply the dealer discount to gross revenue.","inputs":[800,5,0],"formula":"discount","explanation":"Gross revenue multiplied by one minus discount percentage."},{"id":30,"dimension":"Customer","title":"Fleet concentration","member":"Fleet","property":"attribute","correct":"Fleet","wrong":"Retail","problem":"Measure fleet demand as a share of total demand.","inputs":[340,800,0],"formula":"ratio","explanation":"Fleet volume divided by total volume."}];const DIMS=[...new Set(CASES.map(c=>c.dimension))];const NAV=[['lab','◈','Dimension Labs'],['editor','▤','Member Editor'],['hierarchy','♧','Hierarchy'],['impact','▥','Impact Matrix'],['financial','▣','Financial Impact'],['practice','☑','Guided Practice'],['assessment','?','Assessment'],['qa','⚙','Deployment & QA']];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});const base=()=>({screen:'lab',dimension:'Account',caseId:1,edits:{},values:{},attempts:{},answers:{},evidence:[]});let state=base();try{const x=JSON.parse(localStorage.getItem('bisp_planning_fast'));if(x&&typeof x==='object')state={...state,...x}}catch(e){};const save=()=>{try{localStorage.setItem('bisp_planning_fast',JSON.stringify(state))}catch(e){}};const selected=()=>CASES.find(c=>c.id===state.caseId)||CASES[0];const prop=c=>state.edits[c.id]??c.correct;const values=c=>state.values[c.id]??c.inputs;const field=(name,val)=>`<div class="field"><label>${esc(name)}</label>${val}</div>`;
function calc(c,v){if(v.some(n=>!Number.isFinite(n)))throw Error('All inputs must be finite numbers');let [a,b,d]=v;switch(c.formula){case 'sum':return a+b+d;case 'sum4':return a+b+d+(v[3]||0);case 'last':return d;case 'avg':return (a+b+d)/3;case 'zero':return 0;case 'fx':if(b===0)throw Error('Exchange rate cannot be zero');return a/b;case 'horizon':return b;case 'uplift':return a*(1+b/100);case 'add':return a+b;case 'percent':return a*b/100;case 'first':return a;case 'ratio':if(b===0)throw Error('Denominator cannot be zero');return a/b*100;case 'multiply':return a*b;case 'discount':return a*(1-b/100);case 'growth':if(a===0)throw Error('Prior-year value cannot be zero');return (b-a)/a*100;default:throw Error('Unsupported formula')}}
function result(c,v){let n=calc(c,v);if(c.id===2&&prop(c)==='Flow')return v.reduce((a,b)=>a+b,0);if(c.id===1&&prop(c)==='Balance')return v[2];if(c.id===3&&prop(c)==='Flow')return v.reduce((a,b)=>a+b,0);return n}
function warnings(){return CASES.filter(c=>prop(c)!==c.correct).map(c=>({id:c.id,message:`${c.dimension} / ${c.member}: ${c.property} is ${prop(c)}; expected ${c.correct} in this exercise`}))}
function nav(screen){state.screen=screen;save();render()}function pick(id){state.caseId=id;state.dimension=selected().dimension;state.screen='lab';save();render()}function dim(d){state.dimension=d;state.caseId=CASES.find(c=>c.dimension===d).id;save();render()}
function choices(c){return `<select id="property"><option value="${esc(c.correct)}" ${prop(c)===c.correct?'selected':''}>${esc(c.correct)}</option><option value="${esc(c.wrong)}" ${prop(c)===c.wrong?'selected':''}>${esc(c.wrong)}</option></select>`}
function caseButtons(cs){return `<div class="cases">${cs.map(c=>`<button data-case="${c.id}" class="${selected().id===c.id?'active':''}"><b>${esc(c.title)}</b><span>${esc(c.member)} · ${esc(c.property)}</span></button>`).join('')}</div>`}
function lab(){let c=selected(),v=values(c);return `<div class="tabs">${DIMS.map(d=>`<button data-dim="${esc(d)}" class="${d===state.dimension?'active':''}">${esc(d)}</button>`).join('')}</div><div class="card" style="margin-bottom:12px">${caseButtons(CASES.filter(x=>x.dimension===state.dimension))}</div><div class="grid"><section class="card"><h2>${esc(c.title)}</h2><p>${esc(c.problem)}</p>${field('Member',`<input readonly value="${esc(c.member)}">`)}${field('Property · '+c.property,choices(c))}<h3>Numerical assumptions</h3>${v.map((n,i)=>field(['Input A','Input B','Input C'][i]||'Input '+(i+1),`<input type="number" step="any" id="num${i}" value="${esc(n)}">`)).join('')}<div class="actions"><button class="btn" id="execute">Execute simulation</button><button class="btn alt" id="check">Validate property</button><button class="btn alt" id="resetCase">Reset case</button></div><div id="feedback" aria-live="polite"></div></section><section class="card"><h2>Calculated outcome</h2><div class="stat">Current result<strong id="currentResult">${fmt(result(c,v))}</strong></div><p class="muted small">${esc(c.explanation)}</p><h3>Calculation trace</h3><pre class="trace" id="trace">${esc(`${c.formula}(${v.join(', ')}) = ${fmt(result(c,v))}
Property: ${c.property} = ${prop(c)}`)}</pre><h3>Business / architect checkpoint</h3><p>${esc(c.problem)} Select the recommended setting <b>${esc(c.correct)}</b>, run the calculation, and verify the result. Some cases are illustrative business calculations rather than native Planning metadata operations.</p><button class="btn" id="record">Record UAT evidence</button></section></div>`}
function editor(){return `<div class="grid"><section class="card"><h2>Editable member-property catalog</h2><p class="muted small">Edits are shared with Dimension Labs and validation. This is a curated training dataset, not a complete Oracle property schema.</p><div class="scroll"><table><tr><th>Member</th><th>Property</th><th>Current setting</th></tr>${CASES.map(c=>`<tr><td><button class="btn alt" data-case="${c.id}">${esc(c.member)}</button><div class="small muted">${esc(c.dimension)}</div></td><td>${esc(c.property)}</td><td><select data-edit="${c.id}"><option ${prop(c)===c.correct?'selected':''}>${esc(c.correct)}</option><option ${prop(c)===c.wrong?'selected':''}>${esc(c.wrong)}</option></select></td></tr>`).join('')}</table></div></section><section class="card"><h2>Metadata validation</h2><div class="stat">Case configuration warnings<strong id="warningCount">${warnings().length}</strong></div><div id="warnings">${warnings().map(w=>`<p class="notice">${esc(w.message)}</p>`).join('')||'<p class="notice ok">All 30 exercise property choices match their scenario requirements.</p>'}</div><button class="btn alt" id="restoreAll">Restore all recommended properties</button></section></div>`}
function hierarchy(){return `<div class="grid"><section class="card"><h2>Hierarchy & alternate reporting</h2><p>Study parent aggregation and shared-member double-counting through the relevant member cases.</p>${caseButtons(CASES.filter(c=>['Entity','Product','Channel','Cost Center','Customer'].includes(c.dimension)&&['aggregation','storage'].includes(c.property)))}</section><section class="card"><h2>Hierarchy interpretation</h2><p><b>Store</b> stores calculated data; <b>Dynamic Calc</b> calculates on retrieval; shared members provide alternate reporting references under supported hierarchy configurations.</p><p class="notice">This module teaches rollup outcomes. It does not create a live Essbase outline or validate every BSO/ASO storage restriction.</p></section></div>`}
function impact(){let c=CASES[1],v=values(c);return `<div class="grid"><section class="card"><h2>Inventory Time Balance</h2><p>Monthly closing inventory: ${v.map(fmt).join(' / ')} lakh</p><table><tr><th>Property</th><th>Quarter value</th></tr><tr><td>Balance (closing)</td><td>${fmt(v[2])}</td></tr><tr><td>Flow (sum)</td><td>${fmt(v.reduce((a,b)=>a+b,0))}</td></tr><tr><td><b>Overstatement</b></td><td><b>${fmt(v[0]+v[1])}</b></td></tr></table><button class="btn" data-case="2">Edit Inventory_Closing</button></section><section class="card"><h2>Architect interpretation</h2><p>Closing inventory is a stock, not a flow. Summing month-end balances typically overstates quarterly inventory. Account Time Balance controls the intended period aggregation; Skip settings and missing values require additional checks in real applications.</p></section></div>`}
function financial(){let r=result(CASES[0],values(CASES[0])),inv=result(CASES[1],values(CASES[1])),cogs=r*.6,gp=r-cogs,ar=r*.15,cash=500+gp-(inv-120)-ar;return `<div class="grid"><section class="card"><h2>Illustrative financial bridge · ₹ lakh</h2><table>${[['Revenue',r],['COGS (60%)',cogs],['Gross profit',gp],['Closing inventory',inv],['Receivables (15%)',ar],['Opening cash',500],['Closing cash proxy',cash]].map(x=>`<tr><td>${x[0]}</td><td>${fmt(x[1])}</td></tr>`).join('')}</table></section><section class="card"><h2>Accounting assumptions</h2><p>Revenue and inventory use the current Account Lab configuration. This simplified cash bridge excludes financing, tax, payables, capital expenditure and fixed assets; it is <b>not</b> a complete balanced three-statement model.</p><div class="notice ${warnings().some(w=>w.id===1||w.id===2)?'':'ok'}">${warnings().some(w=>w.id===1||w.id===2)?'Account metadata requires review.':'Relevant Account settings match exercise assumptions.'}</div><button class="btn" data-case="1">Inspect revenue</button> <button class="btn alt" data-case="2">Inspect inventory</button></section></div>`}
function practice(){let done=Object.keys(state.attempts).length;return `<div class="card"><h2>Guided practice · 30 distinct scenarios</h2><div class="bar"><div style="width:${done/30*100}%"></div></div><p>${done}/30 UAT checkpoints recorded</p>${caseButtons(CASES)}</div>`}
function assessment(){let score=CASES.filter(c=>state.answers[c.id]===c.correct).length;return `<div class="card"><h2>Member-property assessment</h2><div class="stat">Correct answers<strong id="score">${score}/30</strong></div>${CASES.map(c=>`<div class="field"><label>${c.id}. ${esc(c.dimension)} / ${esc(c.member)}: recommended ${esc(c.property)}?</label><select data-answer="${c.id}"><option value="">Choose</option><option ${state.answers[c.id]===c.correct?'selected':''}>${esc(c.correct)}</option><option ${state.answers[c.id]===c.wrong?'selected':''}>${esc(c.wrong)}</option></select></div>`).join('')}</div>`}
function qa(){let w=warnings(),done=Object.keys(state.attempts).length;return `<div class="grid"><section class="card"><h2>Simulated deployment gate</h2><div class="stat">Metadata warnings<strong>${w.length}</strong></div><div class="stat" style="margin-top:8px">UAT completed<strong>${done}/30</strong></div><div class="actions"><button class="btn" id="gate">Run release check</button><button class="btn alt" id="exportQA">Export JSON evidence</button></div><div id="gateMessage"></div><p class="small muted">No real Oracle server deployment or metadata refresh is performed.</p></section><section class="card"><h2>Evidence history</h2><div class="scroll">${state.evidence.slice(-20).reverse().map(e=>`<p class="notice ${e.pass?'ok':''}">${esc(e.title)} · ${e.pass?'PASS':'REVIEW'} · ${fmt(e.output)}</p>`).join('')||'<p class="muted">No recorded runs yet.</p>'}</div></section></div>`}
function render(){const s=state.screen;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===s));$('heading').textContent=NAV.find(x=>x[0]===s)?.[2]||'Dimension Labs';$('progress').textContent=`${Object.keys(state.attempts).length}/30 UAT`;const views={lab,editor,hierarchy,impact,financial,practice,assessment,qa};$('app').innerHTML=(views[s]||lab)();bind()}
function updateProperty(id,val){state.edits[id]=val;save();if(state.screen==='lab'){const c=selected();if(c.id===id){$('trace').textContent=`${c.formula}(${values(c).join(', ')}) = ${fmt(result(c,values(c)))}
Property: ${c.property} = ${prop(c)}`;$('currentResult').textContent=fmt(result(c,values(c)))}}else render()}
function readInputs(){const c=selected();const raw=c.inputs.map((_,i)=>$('num'+i).value);if(raw.some(s=>s.trim()===''))throw Error('All numeric fields are required');const v=raw.map(Number);result(c,v);return v}
function bind(){document.querySelectorAll('[data-dim]').forEach(b=>b.onclick=()=>dim(b.dataset.dim));document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>pick(Number(b.dataset.case)));document.querySelectorAll('[data-edit]').forEach(s=>s.onchange=()=>updateProperty(Number(s.dataset.edit),s.value));document.querySelectorAll('[data-answer]').forEach(s=>s.onchange=()=>{state.answers[s.dataset.answer]=s.value;save();$('score').textContent=CASES.filter(c=>state.answers[c.id]===c.correct).length+'/30'});if($('property'))$('property').onchange=e=>updateProperty(selected().id,e.target.value);if($('execute'))$('execute').onclick=()=>{try{const c=selected(),v=readInputs(),n=result(c,v);state.values[c.id]=v;save();$('currentResult').textContent=fmt(n);$('trace').textContent=`${c.formula}(${v.join(', ')}) = ${fmt(n)}
${c.property} = ${prop(c)}`;$('feedback').className='notice ok';$('feedback').textContent='Simulation completed.'}catch(e){$('feedback').className='notice bad';$('feedback').textContent=e.message}};if($('check'))$('check').onclick=()=>{let c=selected(),ok=prop(c)===c.correct;$('feedback').className='notice '+(ok?'ok':'bad');$('feedback').textContent=ok?'PASS: Recommended property selected.':`REVIEW: Expected ${c.correct} for this scenario.`};if($('resetCase'))$('resetCase').onclick=()=>{delete state.edits[selected().id];delete state.values[selected().id];save();render()};if($('record'))$('record').onclick=()=>{try{let c=selected(),v=readInputs(),n=result(c,v),pass=prop(c)===c.correct;state.values[c.id]=v;state.attempts[c.id]=true;state.evidence.push({at:new Date().toISOString(),id:c.id,title:c.title,inputs:v,property:prop(c),output:n,pass});save();$('feedback').className='notice '+(pass?'ok':'bad');$('feedback').textContent=pass?'UAT evidence recorded: PASS':'Evidence recorded: property requires review';$('progress').textContent=Object.keys(state.attempts).length+'/30 UAT'}catch(e){$('feedback').className='notice bad';$('feedback').textContent=e.message}};if($('restoreAll'))$('restoreAll').onclick=()=>{state.edits={};save();render()};if($('gate'))$('gate').onclick=()=>{let ok=warnings().length===0&&Object.keys(state.attempts).length===30;$('gateMessage').className='notice '+(ok?'ok':'bad');$('gateMessage').textContent=ok?'PASS: all configured scenarios and UAT checkpoints completed.':'BLOCKED: fix metadata warnings and complete all 30 UAT checkpoints.'};if($('exportQA'))$('exportQA').onclick=exportEvidence}
function exportEvidence(){const data={title:'BISP Oracle Planning Member Properties Lab',disclaimer:'Training simulation only',exportedAt:new Date().toISOString(),metadata:state.edits,inputs:state.values,answers:state.answers,attempts:state.attempts,evidence:state.evidence,warnings:warnings()};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='BISP_Planning_UAT_Evidence.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('rail').innerHTML=NAV.map(([id,icon,name])=>`<button data-nav="${id}" title="${name}" aria-label="${name}">${icon}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));$('export').onclick=exportEvidence;render();if(new URLSearchParams(location.search).has('selftest')){let errors=[];for(const c of CASES){try{if(!Number.isFinite(calc(c,c.inputs)))errors.push('calc '+c.id)}catch(e){errors.push('calc '+c.id+' '+e.message)}}for(const [id] of NAV){try{state.screen=id;render();if(!$('app').children.length)errors.push('render '+id)}catch(e){errors.push('render '+id+' '+e.message)}}document.body.dataset.selftest=errors.length?'FAIL':'PASS';document.body.dataset.errors=errors.join('; ');state.screen='lab';render()}
</script></body></html>
