<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISP Trainings | Worklist &amp; Task Management Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2A43;
  --navy-light:#173A5C;
  --blue:#2E6DA4;
  --blue-light:#4C8FC7;
  --orange:#E8792D;
  --orange-dark:#C8601C;
  --green:#2F9E44;
  --green-bg:#E7F6EB;
  --red:#E03131;
  --red-bg:#FDECEC;
  --amber:#B8710A;
  --amber-bg:#FFF3DC;
  --purple:#6741D9;
  --purple-bg:#F0EBFD;
  --slate-bg:#EEF2F6;
  --card:#FFFFFF;
  --border:#DAE1E9;
  --text:#182634;
  --text-muted:#5B6B7C;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,42,67,.06), 0 4px 14px rgba(15,42,67,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--slate-bg);
  color:var(--text);
  min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
#app{min-height:100vh;display:flex;flex-direction:column;}

/* ============ LOGIN ============ */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(76,143,199,.25), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(232,121,45,.18), transparent 40%),
    linear-gradient(160deg,var(--navy) 0%,var(--navy-light) 55%,#0B2138 100%);
  padding:24px;
}
.login-card{
  width:100%;max-width:440px;background:var(--card);border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;
}
.login-brand{padding:28px 32px 20px;text-align:center;border-bottom:1px solid var(--border);}
.login-brand img{height:42px;object-fit:contain;}
.login-brand .tagline{margin-top:10px;font-size:12.5px;color:var(--text-muted);letter-spacing:.02em;}
.login-body{padding:28px 32px 32px;}
.login-title{font-size:19px;font-weight:800;color:var(--navy);margin:0 0 2px;letter-spacing:-.01em;}
.login-sub{font-size:12.5px;color:var(--text-muted);margin:0 0 22px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.field-label{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:6px;display:block;}
.text-input{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;margin-bottom:18px;background:#FBFCFD;transition:border-color .15s;
}
.text-input:focus{outline:none;border-color:var(--blue);background:#fff;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px;}
.role-btn{
  padding:12px 10px;border:1.5px solid var(--border);border-radius:8px;background:#FBFCFD;
  font-size:13px;font-weight:600;color:var(--text);text-align:left;transition:all .15s;
  display:flex;align-items:center;gap:8px;
}
.role-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;}
.role-btn:hover{border-color:var(--blue-light);}
.role-btn.selected{border-color:var(--blue);background:var(--blue);color:#fff;}
.role-btn.selected .dot{background:#fff;}
.btn-primary{
  width:100%;padding:13px;border:none;border-radius:8px;background:var(--orange);color:#fff;
  font-size:14.5px;font-weight:700;letter-spacing:.02em;transition:background .15s;
}
.btn-primary:hover{background:var(--orange-dark);}
.btn-primary:disabled{background:#C7CFD8;cursor:not-allowed;}
.login-foot{padding:16px 32px;background:var(--slate-bg);text-align:center;font-size:11.5px;color:var(--text-muted);}
.login-foot b{color:var(--navy);}

/* ============ SHELL / HEADER ============ */
.topbar{
  background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;height:60px;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.15);position:sticky;top:0;z-index:50;
}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar-logo{background:#fff;border-radius:6px;padding:4px 8px;display:flex;align-items:center;}
.topbar-logo img{height:22px;display:block;}
.topbar-title{font-size:14px;font-weight:700;letter-spacing:.01em;}
.topbar-title span{display:block;font-size:10px;font-weight:500;color:#A9C2DA;letter-spacing:.06em;text-transform:uppercase;}
.topbar-nav{display:flex;gap:2px;}
.nav-btn{
  background:transparent;border:none;color:#C3D3E2;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;
  transition:all .15s;
}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-btn.active{background:var(--orange);color:#fff;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:20px;font-size:12.5px;}
.user-chip .av{width:22px;height:22px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.logout-btn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;}
.logout-btn:hover{background:rgba(255,255,255,.1);}

.main-content{flex:1;padding:22px 26px 60px;max-width:1360px;margin:0 auto;width:100%;}
.page-eyebrow{font-size:11.5px;font-weight:700;color:var(--orange-dark);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.page-title{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 4px;letter-spacing:-.01em;}
.page-desc{font-size:13.5px;color:var(--text-muted);margin:0 0 20px;max-width:760px;line-height:1.5;}
.illustrative-tag{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--amber);
  background:var(--amber-bg);padding:3px 9px;border-radius:20px;letter-spacing:.03em;text-transform:uppercase;
}

/* footer */
.app-footer{background:var(--navy);color:#9FB4C8;text-align:center;padding:16px;font-size:11.5px;margin-top:auto;}
.app-footer b{color:#fff;}

/* ============ KPI CARDS ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:24px;}
.kpi-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left;
  border-left:4px solid var(--blue);
}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,42,67,.14);}
.kpi-card.active{outline:2px solid var(--orange);outline-offset:-1px;}
.kpi-card .num{font-size:22px;font-weight:800;color:var(--navy);line-height:1;}
.kpi-card .lbl{font-size:11.5px;color:var(--text-muted);margin-top:6px;font-weight:600;}
.kpi-card.c-red{border-left-color:var(--red);}
.kpi-card.c-amber{border-left-color:var(--amber);}
.kpi-card.c-green{border-left-color:var(--green);}
.kpi-card.c-purple{border-left-color:var(--purple);}
.kpi-card.c-orange{border-left-color:var(--orange);}

/* section card */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.panel-title{font-size:15px;font-weight:700;color:var(--navy);margin:0;}

/* ============ FILTERS ============ */
.filter-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.filter-chip{
  padding:7px 13px;border:1.5px solid var(--border);border-radius:20px;background:#FBFCFD;font-size:12.5px;
  font-weight:600;color:var(--text);transition:all .15s;
}
.filter-chip:hover{border-color:var(--blue-light);}
.filter-chip.selected{background:var(--blue);border-color:var(--blue);color:#fff;}
.filter-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.btn-sm{padding:8px 14px;border-radius:7px;font-size:12.5px;font-weight:700;border:1.5px solid var(--border);background:#fff;color:var(--text);}
.btn-sm:hover{border-color:var(--blue-light);}
.btn-sm.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-sm.primary:hover{background:#265d8f;}
.btn-sm.warn{background:var(--red);border-color:var(--red);color:#fff;}
.btn-sm.ghost{background:transparent;}

/* search */
.search-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:220px;position:relative;}
.search-box input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;}
.search-box:before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;}

/* ============ TABLE ============ */
.table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
table.worklist{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1180px;}
table.worklist thead th{
  background:var(--slate-bg);color:var(--navy);text-align:left;padding:10px 10px;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;
}
table.worklist thead th:hover{color:var(--orange-dark);}
table.worklist tbody td{padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text);}
table.worklist tbody tr:hover{background:#F7FAFD;}
table.worklist tbody tr.overdue-row{background:#FFF9F5;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.01em;}
.badge-prep{background:#E4ECF5;color:var(--blue);}
.badge-review{background:var(--purple-bg);color:var(--purple);}
.badge-approval{background:var(--amber-bg);color:var(--amber);}
.badge-completed{background:var(--green-bg);color:var(--green);}
.badge-rejected{background:var(--red-bg);color:var(--red);}
.badge-reopened{background:#FDE8F0;color:#C2255C;}
.risk-high{color:var(--red);font-weight:700;}
.risk-medium{color:var(--amber);font-weight:700;}
.risk-low{color:var(--green);font-weight:700;}
.diff-nonzero{color:var(--red);font-weight:700;}
.link-btn{background:none;border:none;color:var(--blue);font-weight:700;font-size:12.5px;padding:0;}
.link-btn:hover{text-decoration:underline;}
.unclaimed-tag{color:var(--text-muted);font-style:italic;font-size:11.5px;}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--text-muted);}
.pager .pbtns{display:flex;gap:6px;}
.pager button{padding:5px 10px;border:1px solid var(--border);background:#fff;border-radius:6px;font-size:12px;}
.pager button:disabled{opacity:.4;cursor:not-allowed;}

/* ============ TASK DETAIL ============ */
.detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr;}}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;}
.kv{padding:8px 0;border-bottom:1px dashed var(--border);}
.kv .k{font-size:10.5px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.kv .v{font-size:13.5px;font-weight:600;color:var(--text);}
.action-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.action-btn{
  padding:9px 15px;border-radius:8px;font-size:12.5px;font-weight:700;border:1.5px solid var(--border);background:#fff;
  display:flex;align-items:center;gap:6px;transition:all .15s;
}
.action-btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08);}
.action-btn.claim{background:var(--blue);color:#fff;border-color:var(--blue);}
.action-btn.release{background:#fff;color:var(--text);}
.action-btn.submit{background:var(--navy);color:#fff;border-color:var(--navy);}
.action-btn.approve{background:var(--green);color:#fff;border-color:var(--green);}
.action-btn.reject{background:var(--red);color:#fff;border-color:var(--red);}
.action-btn.reassign{background:var(--orange);color:#fff;border-color:var(--orange);}
.action-btn.comment{background:#fff;color:var(--text);}
.action-btn.export{background:var(--purple);color:#fff;border-color:var(--purple);}
.action-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* timeline */
.timeline{position:relative;padding-left:22px;}
.timeline:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item:before{content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 2px var(--blue);}
.tl-item.rejected:before{background:var(--red);box-shadow:0 0 0 2px var(--red);}
.tl-item.approved:before{background:var(--green);box-shadow:0 0 0 2px var(--green);}
.tl-time{font-size:10.5px;color:var(--text-muted);font-weight:600;}
.tl-text{font-size:12.5px;color:var(--text);margin-top:1px;}
.comment-box{background:var(--slate-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.comment-box .who{font-size:11.5px;font-weight:700;color:var(--navy);}
.comment-box .when{font-size:10px;color:var(--text-muted);}
.comment-box .txt{font-size:12.5px;margin-top:3px;}

/* smartart lifecycle mini in detail */
.lifecycle-strip{display:flex;align-items:center;gap:0;overflow-x:auto;padding:6px 0 10px;}
.lc-node{
  flex-shrink:0;padding:8px 12px;border-radius:8px;font-size:11px;font-weight:700;text-align:center;min-width:96px;
  background:var(--slate-bg);color:var(--text-muted);border:1.5px solid var(--border);
}
.lc-node.current{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:0 3px 10px rgba(232,121,45,.35);}
.lc-node.done{background:var(--green-bg);color:var(--green);border-color:var(--green);}
.lc-arrow{flex-shrink:0;width:22px;text-align:center;color:var(--text-muted);font-weight:700;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,32,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:#fff;border-radius:12px;max-width:440px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.4);overflow:hidden;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:800;color:var(--navy);font-size:15px;}
.modal-body{padding:18px 20px;}
.modal-body label{font-size:12px;font-weight:700;color:var(--text);display:block;margin-bottom:5px;margin-top:12px;}
.modal-body label:first-child{margin-top:0;}
.modal-body textarea,.modal-body select,.modal-body input[type=text]{
  width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;
}
.modal-body textarea{resize:vertical;min-height:70px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;
  border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:300;
  display:flex;align-items:center;gap:8px;max-width:90vw;
}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}
.toast .icon{font-weight:800;}

/* ============ CHARTS ============ */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.chart-card h4{margin:0 0 3px;font-size:13.5px;color:var(--navy);font-weight:700;}
.chart-card .sub{font-size:10.5px;color:var(--text-muted);margin-bottom:10px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;cursor:pointer;}
.bar-row:hover .bar-lbl{color:var(--orange-dark);}
.bar-lbl{width:110px;flex-shrink:0;font-size:11.5px;font-weight:600;color:var(--text);transition:color .1s;}
.bar-track{flex:1;background:var(--slate-bg);border-radius:5px;height:16px;position:relative;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;transition:width .3s;}
.bar-val{width:26px;text-align:right;font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0;}

/* ============ SMARTART / FLOWCHARTS ============ */
.flow-row{display:flex;flex-direction:column;align-items:center;gap:0;}
.flow-box{
  background:var(--card);border:2px solid var(--blue);color:var(--navy);font-weight:700;font-size:12.5px;
  padding:10px 18px;border-radius:8px;text-align:center;min-width:180px;box-shadow:var(--shadow);
}
.flow-box.hilite{border-color:var(--orange);background:#FFF6EF;}
.flow-box.danger{border-color:var(--red);background:var(--red-bg);color:var(--red);}
.flow-down{color:var(--text-muted);font-size:16px;line-height:1;padding:2px 0;}
.flow-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;margin-top:6px;}

/* ============ ROLE INFO ============ */
.role-banner{
  display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--navy),var(--blue));
  color:#fff;border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;
}
.role-banner .rtag{background:var(--orange);padding:4px 11px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.03em;}
.role-banner .rtxt{font-size:12.5px;color:#DCE8F2;}

/* ============ TRAINING / PRACTICE / EXAM ============ */
.progress-bar-wrap{background:var(--slate-bg);border-radius:20px;height:8px;overflow:hidden;margin:12px 0 18px;}
.progress-bar-fill{height:100%;background:var(--orange);border-radius:20px;transition:width .3s;}
.step-card{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);
}
.step-card.done{border-color:var(--green);background:var(--green-bg);}
.step-num{
  display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:var(--navy);color:#fff;font-size:12px;font-weight:800;margin-right:8px;
}
.step-card.done .step-num{background:var(--green);}
.scenario-box{background:#FFF6EF;border:1.5px solid #F3D6BB;border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.55;}
.scenario-box b{color:var(--orange-dark);}
.checklist-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.checklist-item .cbox{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:800;}
.checklist-item.on .cbox{background:var(--green);border-color:var(--green);}
.exam-q{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.exam-q .qtitle{font-weight:700;font-size:13.5px;margin-bottom:12px;color:var(--navy);}
.opt-btn{
  display:block;width:100%;text-align:left;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;
  background:#FBFCFD;font-size:13px;margin-bottom:8px;font-weight:500;transition:all .15s;
}
.opt-btn:hover{border-color:var(--blue-light);}
.opt-btn.correct{background:var(--green-bg);border-color:var(--green);color:#1c6b32;font-weight:700;}
.opt-btn.incorrect{background:var(--red-bg);border-color:var(--red);color:#a11a1a;font-weight:700;}
.opt-btn:disabled{cursor:default;}
.score-hero{
  text-align:center;background:linear-gradient(160deg,var(--navy),var(--blue));color:#fff;border-radius:14px;
  padding:34px 20px;margin-bottom:20px;
}
.score-hero .big{font-size:44px;font-weight:800;}
.score-hero .tag{margin-top:6px;font-size:13px;color:#CFE0EE;}
.pass-pill{display:inline-block;margin-top:12px;padding:6px 18px;border-radius:20px;font-weight:800;font-size:12.5px;letter-spacing:.03em;}
.pass-pill.pass{background:var(--green);}
.pass-pill.retry{background:var(--red);}

/* ============ HELP ============ */

  {key:'dueToday', label:'Due Today', test:t=>sameDay(t.dueDate,new Date())},
  {key:'dueWeek', label:'Due This Week', test:t=>{const d=diffDays(t.dueDate);return d>=0 && d<=7;}},
  {key:'overdue', label:'Overdue', test:t=>diffDays(t.dueDate)<0 && !['Completed'].includes(t.status)},
  {key:'highRisk', label:'High Risk', test:t=>t.risk==='High'},
  {key:'rejected', label:'Rejected', test:t=>t.status==='Rejected'},
  {key:'unclaimed', label:'Unclaimed', test:t=>t.assignee===null},
  {key:'pendPrep', label:'Pending Preparation', test:t=>t.status==='Pending Preparation'},
  {key:'pendReview', label:'Pending Review', test:t=>t.status==='Pending Review'},
  {key:'pendApproval', label:'Pending Approval', test:t=>t.status==='Pending Approval'},
  {key:'completed', label:'Completed', test:t=>t.status==='Completed'},
  {key:'reopened', label:'Reopened', test:t=>t.status==='Reopened'},
  {key:'alerts', label:'Alerts Assigned to Me', test:t=>t.alert && t.assignee==='ME'}
];
function diffDays(d){const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000);}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

const STATUS_BADGE = {
  'Pending Preparation':'badge-prep','Pending Review':'badge-review','Pending Approval':'badge-approval',
  'Completed':'badge-completed','Rejected':'badge-rejected','Reopened':'badge-reopened'
};
const RISK_CLASS = {High:'risk-high',Medium:'risk-medium',Low:'risk-low'};

}

/* ---------------- LIFECYCLE SMARTART ---------------- */
function lifecycleDiagram(currentStatus){
  const stages = ['Pending Preparation','Pending Review','Pending Approval','Completed'];
  const labels = ['Pending Preparation','Submit','Pending Review','Approve','Pending Approval','Approve','Completed'];
  let idx = stages.indexOf(currentStatus);
  return `<div class="lifecycle-strip">
    ${labels.map((l,i)=>{
      const isStage = i%2===0;
      let cls='lc-node';
      if(isStage){
        const stageIdx = i/2;
        if(currentStatus && stageIdx<idx) cls+=' done';
        if(currentStatus && stageIdx===idx) cls+=' current';
      }
      const arrow = i<labels.length-1?'<span class="lc-arrow">→</span>':'';
      return `<div class="${cls}">${esc(l)}</div>${arrow}`;
    }).join('')}
  </div>
  <div style="display:flex;gap:22px;flex-wrap:wrap;margin-top:6px;">
    <div style="font-size:11.5px;color:var(--text-muted);"><b style="color:var(--red)">Exception —</b> Review → Reject → Preparation (return for correction)</div>
    <div style="font-size:11.5px;color:var(--text-muted);"><b style="color:#C2255C">Exception —</b> Completed → Reopened → Processing</div>
  </div>`;
}

/* ---------------- WORKLIST ---------------- */
function matchesFilters(t){
  if(STATE.activeFilters.size===0) return true;
  for(const key of STATE.activeFilters){
    const def = FILTER_DEFS.find(f=>f.key===key);
    if(def && !def.test(t)) return false;
  }
  return true;
}
function matchesSearch(t){
  if(!STATE.search) return true;
  const s = STATE.search.toLowerCase();
  return [t.recon,t.account,t.entity,t.period,t.preparer,t.reviewer,t.status].some(v=>String(v).toLowerCase().includes(s));
}
function getFilteredSorted(){
  let list = TASKS.filter(matchesFilters).filter(matchesSearch);
  const key = STATE.sortKey, dir = STATE.sortDir==='asc'?1:-1;
  list = list.slice().sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(key==='dueDate'){av=a.dueDate.getTime();bv=b.dueDate.getTime();}
    if(key==='daysOverdue'){av=diffDays(a.dueDate)*-1;bv=diffDays(b.dueDate)*-1;}
    if(typeof av==='string') return av.localeCompare(bv)*dir;
    return (av-bv)*dir;
  });
  return list;
}
function toggleFilter(key){
  if(STATE.activeFilters.has(key)) STATE.activeFilters.delete(key);
  else STATE.activeFilters.add(key);
  STATE.activeKpi=null; STATE.page=1; h();
}
function resetFilters(){STATE.activeFilters=new Set(); STATE.activeKpi=null; STATE.page=1; STATE.search=''; h();}
function applyFilterBtn(){STATE.page=1; h(); showToast('Filter applied to worklist.','success');}
function saveView(){showToast('View saved (illustrative — session only).','success');}
function setSort(key){
  if(STATE.sortKey===key) STATE.sortDir = STATE.sortDir==='asc'?'desc':'asc';
  else {STATE.sortKey=key; STATE.sortDir='asc';}
  h();
}
function setSearch(v){STATE.search=v; STATE.page=1;}

function renderWorklist(){
  const all = getFilteredSorted();
  const totalPages = Math.max(1,Math.ceil(all.length/STATE.pageSize));
  if(STATE.page>totalPages) STATE.page=totalPages;
  const start=(STATE.page-1)*STATE.pageSize;
  const pageItems = all.slice(start,start+STATE.pageSize);
  const cols = ['Reconciliation','Account','Entity','Period','Role','Status','Risk','Balance','Difference','Due Date','Days Overdue','Preparer','Reviewer',''];
  const sortMap = {Reconciliation:'recon',Account:'account',Entity:'entity',Period:'period',Role:'role',Status:'status',Risk:'risk',Balance:'balance',Difference:'difference','Due Date':'dueDate','Days Overdue':'daysOverdue',Preparer:'preparer',Reviewer:'reviewer'};

  return renderShell(`
    <div class="page-eyebrow">Worklist &amp; Task Management</div>
    <h1 class="page-title">Worklist</h1>
    <p class="page-desc">Filter, search, sort and act on reconciliation tasks. <span class="illustrative-tag">Illustrative Training Data</span></p>

    <div class="panel">
      <div class="panel-head"><h3 class="panel-title">Worklist Filters</h3></div>
      <div class="filter-grid">
        ${FILTER_DEFS.map(f=>`<button class="filter-chip ${STATE.activeFilters.has(f.key)?'selected':''}" onclick="toggleFilter('${f.key}')">${f.label} <span class="mono" style="opacity:.7">(${TASKS.filter(f.test).length})</span></button>`).join('')}
      </div>
      <div class="filter-actions">
        <button class="btn-sm primary" onclick="applyFilterBtn()">APPLY FILTER</button>
        <button class="btn-sm warn" onclick="resetFilters()">RESET FILTER</button>
        <button class="btn-sm ghost" onclick="saveView()">SAVE VIEW</button>
      </div>
    </div>

    <div class="panel">
      <div class="search-row">
        <div class="search-box"><input type="text" placeholder="Search reconciliation, account, entity, preparer, reviewer, status..." value="${esc(STATE.search)}" oninput="setSearch(this.value); h(); this.focus(); this.setSelectionRange(this.value.length,this.value.length);"></div>
        <button class="btn-sm" onclick="exportListPrompt()">⬇ EXPORT LIST</button>
      </div>
      <div class="table-scroll">
        <table class="worklist">
          <thead><tr>${cols.map(c=>`<th onclick="${sortMap[c]?`setSort('${sortMap[c]}')`:''}">${c}${sortMap[c]&&STATE.sortKey===sortMap[c]?(STATE.sortDir==='asc'?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
          <tbody>
            ${pageItems.length===0?`<tr><td colspan="14" style="text-align:center;padding:26px;color:var(--text-muted);">No tasks match the current filters.</td></tr>`:''}
            ${pageItems.map(t=>{
              const od = diffDays(t.dueDate);
              const overdue = od<0 && t.status!=='Completed';
              return `<tr class="${overdue?'overdue-row':''}">
                <td><b>${t.recon}</b></td>
                <td>${esc(t.account)}</td>
                <td>${esc(t.entity)}</td>
                <td>${esc(t.period)}</td>
                <td>${esc(t.role)}</td>
                <td><span class="badge ${STATUS_BADGE[t.status]}">${t.status}</span></td>
                <td class="${RISK_CLASS[t.risk]}">${t.risk}</td>
                <td>${money(t.balance)}</td>
                <td class="${t.difference?'diff-nonzero':''}">${money(t.difference)}</td>
                <td>${fmtDate(t.dueDate)}</td>
                <td>${overdue?('<span class="risk-high">'+Math.abs(od)+'</span>'):'—'}</td>
                <td>${esc(t.preparer)}</td>
                <td>${esc(t.reviewer)}</td>
                <td>${t.assignee?(t.assignee==='ME'?'<b style="color:var(--blue)">You</b>':esc(t.assignee)):'<span class="unclaimed-tag">Unclaimed</span>'} &nbsp;<button class="link-btn" onclick="openTask('${t.id}')">OPEN →</button></td>
              </tr>`;
            }).join('')}

        </table>
      </div>

        <div>Showing ${pageItems.length?start+1:0}–${start+pageItems.length} of ${all.length} tasks</div>
        <div class="pbtns">
          <button ${STATE.page<=1?'disabled':''} onclick="STATE.page--; h();">‹ Prev</button>
          <button ${STATE.page>=totalPages?'disabled':''} onclick="STATE.page++; h();">Next ›</button>
        </div>
      </div>
    </div>
  `);
}

  h(); renderModal();
}

/* ---------------- TASK ACTIONS ---------------- */
function findTask(id){return TASKS.find(t=>t.id===id);}
function pushHistory(t,event,note){t.history.push({ts:new Date(),event,note});}
function openTask(id){STATE.openTaskId=id; goTo('taskDetail');
  if(STATE.view==='taskDetail' && STATE.__mode==='practice') STATE.practice.openedId=id;
}
function backToWorklist(){goTo('worklist');}

function claimTask(id){
  const t=findTask(id);
  if(!t || t.assignee!==null) return;
  t.assignee='ME';
  pushHistory(t,'Claimed','Task claimed by '+STATE.username+'.');
  STATE.actionsTaken++;
  showToast('Task '+t.recon+' claimed. Ownership updated: Unclaimed → Assigned to '+STATE.username+'.','success');
  if(STATE.__mode==='training') trainingAfterClaim(id);
  if(STATE.__mode==='practice') practiceAfterClaim(id);
  h();
}
function releaseTask(id){
  const t=findTask(id);
  if(!t || t.assignee!=='ME') return;
  t.assignee=null;
  pushHistory(t,'Released','Task released by '+STATE.username+'. (Illustrative Simulator Behavior)');
  STATE.actionsTaken++;
  showToast('Task '+t.recon+' released and is now Unclaimed. (Illustrative Simulator Behavior)','success');
  h();
}
function submitTask(id){
  const t=findTask(id);
  if(!t || t.status!=='Pending Preparation') return;
  t.status='Pending Review';
  pushHistory(t,'Submitted','Preparation submitted for review by '+STATE.username+'.');
  STATE.actionsTaken++;
  showToast('Task '+t.recon+' submitted: Pending Preparation → Pending Review.','success');
  h();
}
function approveTask(id){
  STATE.modal='approve'; STATE.modalTaskId=id; h(); renderModal();
}
function confirmApprove(id){
  const t=findTask(id);
  if(!t) return;
  if(t.status==='Pending Review'){
    t.status='Pending Approval';
    pushHistory(t,'Reviewed & Approved','Reviewed and forwarded for final approval by '+STATE.username+'.');
    showToast('Task '+t.recon+' approved: Pending Review → Pending Approval.','success');
  } else if(t.status==='Pending Approval'){
    t.status='Completed';
    pushHistory(t,'Approved','Final approval granted by '+STATE.username+'. Task Completed.');
    showToast('Task '+t.recon+' approved: Pending Approval → Completed.','success');
  } else if(t.status==='Reopened'){
    t.status='Completed';
    pushHistory(t,'Re-approved','Reopened task re-approved by '+STATE.username+'. Task Completed.');
    showToast('Task '+t.recon+' re-approved and marked Completed.','success');
  }
  STATE.actionsTaken++;
  closeModal(); STATE.modal=null; h();
}
function rejectTaskPrompt(id){STATE.modal='reject'; STATE.modalTaskId=id; h(); renderModal();}
function confirmReject(id){
  const reasonEl = document.getElementById('rejectReason');
  const reason = reasonEl?reasonEl.value.trim():'';
  if(!reason){ showToast('Please enter a rejection reason.','error'); return; }
  const t=findTask(id);
  t.status='Rejected';
  pushHistory(t,'Rejected','Rejected by '+STATE.username+'. Reason: '+reason);
  t.comments.push({who:STATE.username,when:new Date(),text:reason});
  STATE.actionsTaken++;
  closeModal(); STATE.modal=null;
  showToast('Task '+t.recon+' rejected and returned for correction.','success');
  h();
}
function reassignPrompt(id){STATE.modal='reassign'; STATE.modalTaskId=id; h(); renderModal();}
function confirmReassign(id){
  const newA = document.getElementById('reassignNew').value.trim();
  const reason = document.getElementById('reassignReason').value.trim();
  if(!newA){ showToast('Enter a new assignee.','error'); return; }
  const t=findTask(id);
  const old = t.assignee==='ME'?STATE.username:(t.assignee||'Unclaimed');
  t.assignee = newA;
  pushHistory(t,'Reassigned','Reassigned from '+old+' to '+newA+(reason?' — Reason: '+reason:'')+'.');
  STATE.actionsTaken++;
  closeModal(); STATE.modal=null;
  showToast('Task '+t.recon+' reassigned to '+newA+'.','success');
  h();
}
function commentPrompt(id){STATE.modal='comment'; STATE.modalTaskId=id; h(); renderModal();}
function confirmComment(id){
  const txt = document.getElementById('commentText').value.trim();
  if(!txt){ showToast('Enter a comment before adding.','error'); return; }
  const t=findTask(id);
  t.comments.push({who:STATE.username,when:new Date(),text:txt});
  pushHistory(t,'Comment Added',txt);
  STATE.actionsTaken++;
  closeModal(); STATE.modal=null;
  showToast('Comment added to task history.','success');
  h();
}
function confirmExport(){
  const scope = document.querySelector('input[name=exportScope]:checked').value;
  const n = scope==='current'?getFilteredSorted().slice((STATE.page-1)*STATE.pageSize,(STATE.page-1)*STATE.pageSize+STATE.pageSize).length : scope==='filtered'?getFilteredSorted().length : TASKS.length;
  closeModal(); STATE.modal=null;
  showToast(n+' record(s) prepared for export ('+scope+' view). Illustrative Simulator Behavior.','success');
}

/* ---------------- ANALYTICS / GRAPHS ---------------- */
function groupCount(field, fn){
  const counts={};
  TASKS.forEach(t=>{ const k=fn?fn(t):t[field]; counts[k]=(counts[k]||0)+1; });
  return counts;
}
const CHART_COLORS = ['#2E6DA4','#E8792D','#2F9E44','#E03131','#6741D9','#B8710A','#4C8FC7','#C2255C'];
function chartCard(title,type){
  let data, sub='';
  if(type==='status'){ data=groupCount(null,t=>t.status); sub='Distribution of tasks across lifecycle status'; }
  if(type==='risk'){ data=groupCount(null,t=>t.risk); sub='Distribution of tasks by risk rating'; }
  if(type==='role'){ data=groupCount(null,t=>t.role); sub='Distribution of tasks by assigned role'; }
  if(type==='dueCat'){ data=groupCount(null,t=>{const d=diffDays(t.dueDate); if(d<0) return 'Overdue'; if(d===0) return 'Due Today'; if(d<=7) return 'Due This Week'; return 'Later';}); sub='Tasks grouped by due-date category'; }
  if(type==='overdueDays'){ data=groupCount(null,t=>{const d=diffDays(t.dueDate); if(d>=0) return null; const ad=Math.abs(d); if(ad<=3) return '1–3 days'; if(ad<=7) return '4–7 days'; return '8+ days';}); delete data['null']; sub='Overdue tasks bucketed by days overdue'; }
  if(type==='preparer'){ data=groupCount(null,t=>t.preparer); sub='Tasks grouped by preparer'; }
  if(type==='reviewer'){ data=groupCount(null,t=>t.reviewer); sub='Tasks grouped by reviewer'; }
  if(type==='period'){ data=groupCount(null,t=>t.period); sub='Tasks grouped by accounting period'; }
  const entries = Object.entries(data).filter(([k])=>k!=='null' && k!=='undefined');
  const max = Math.max(...entries.map(e=>e[1]),1);
  return `<div class="chart-card">
    <h4>${title}</h4>
    <div class="sub">${sub} <span class="illustrative-tag" style="margin-left:4px;">Illustrative</span></div>
    ${entries.map(([k,v],i)=>`
      <div class="bar-row" onclick="chartFilter('${type}','${esc(k)}')">
        <div class="bar-lbl">${esc(k)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(v/max*100).toFixed(0)}%;background:${CHART_COLORS[i%CHART_COLORS.length]}"></div></div>
        <div class="bar-val">${v}</div>
      </div>`).join('')}
  </div>`;
}
function chartFilter(type,value){
  let key=null;
  if(type==='status'){
    const map={'Pending Preparation':'pendPrep','Pending Review':'pendReview','Pending Approval':'pendApproval','Completed':'completed','Rejected':'rejected','Reopened':'reopened'};
    key=map[value];
  } else if(type==='risk' && value==='High'){ key='highRisk'; }
  if(key){ STATE.activeFilters=new Set([key]); STATE.page=1; goTo('worklist'); }
  else { showToast('Filtered view is available for status and high-risk segments in this simulator.','success'); }
}

  {t:'Unclaimed',what:'Tasks with no assignee.',why:'Surfaces work available to be picked up.',ex:'A preparer filters Unclaimed to find available tasks.',how:"Select the 'Unclaimed' filter.",res:'Only unclaimed tasks are displayed.'},
  {t:'Pending Preparation',what:'Tasks awaiting initial preparation.',why:'Identifies the earliest lifecycle stage.',ex:'A preparer filters this to find their next task.',how:"Select the 'Pending Preparation' filter.",res:'Only tasks in that status are shown.'},
  {t:'Pending Review',what:'Tasks submitted and awaiting reviewer action.',why:'Helps reviewers manage their queue.',ex:'A reviewer filters Pending Review each morning.',how:"Select the 'Pending Review' filter.",res:'Only tasks in that status are shown.'},
  {t:'Pending Approval',what:'Tasks reviewed and awaiting final approval.',why:'Helps approvers manage their queue.',ex:'An approver filters Pending Approval before period close.',how:"Select the 'Pending Approval' filter.",res:'Only tasks in that status are shown.'},
  {t:'Completed',what:'Tasks that have finished the full lifecycle.',why:'Confirms closure for reporting.',ex:'An administrator reviews Completed tasks for the period.',how:"Select the 'Completed' filter.",res:'Only completed tasks are shown.'},
  {t:'Reopened',what:'Completed tasks returned to processing after an issue was found.',why:'Tracks exceptions after close.',ex:'A reviewer reopens a task after finding a discrepancy.',how:"Select the 'Reopened' filter.",res:'Only reopened tasks are shown.'},
  {t:'Alerts Assigned to Me',what:'Tasks with an active alert assigned to you.',why:'Surfaces items needing special attention.',ex:'A reviewer checks alerts before submitting review.',how:"Select the 'Alerts Assigned to Me' filter.",res:'Only alert-flagged tasks assigned to you are shown.'},
  {t:'Claim',what:'Assigns an unclaimed task to yourself.',why:'Establishes ownership before work begins.',ex:'A preparer claims an unclaimed reconciliation.',how:"Open the task and click 'Claim'.",res:'Assignment changes from Unclaimed to you.'},
  {t:'Release',what:'Removes your ownership, returning a task to Unclaimed.',why:'Used when you cannot continue the task.',ex:'A preparer releases a task before going on leave.',how:"Open the task and click 'Release'.",res:'Assignment changes from you to Unclaimed.'},
  {t:'Open',what:'Opens the full Task Detail screen.',why:'Provides all information and actions for a task.',ex:'A user opens a task to review balance and history.',how:"Click 'Open' from the worklist row.",res:'The Task Detail screen is displayed.'},
  {t:'Submit',what:'Moves a prepared task forward for review.',why:'Signals preparation work is complete.',ex:'A preparer submits after completing their reconciliation.',how:"Open the task and click 'Submit'.",res:'Status changes from Pending Preparation to Pending Review.'},
  {t:'Approve',what:'Advances a task through review or final approval.',why:'Confirms the task meets requirements at that stage.',ex:'A reviewer approves a reconciliation to send it to the approver.',how:"Open the task and click 'Approve', then confirm.",res:'Status advances to the next lifecycle stage.'},
  {t:'Reject',what:'Returns a task for correction with a reason.',why:'Ensures issues are documented and fixed.',ex:'A reviewer rejects a task citing missing documentation.',how:"Open the task, click 'Reject', and enter a reason.",res:'Status changes to Rejected and the reason is logged.'},
  {t:'Reassign',what:'Transfers a task to a different user.',why:'Balances workload or covers absences.',ex:'An administrator reassigns a task during a team member\'s leave.',how:"Open the task, click 'Reassign', enter new assignee and reason.",res:'The task assignee updates to the new user.'},
  {t:'Add Comment',what:'Attaches a note to the task activity history.',why:'Documents context for reviewers and auditors.',ex:'A preparer notes supporting documentation was updated.',how:"Open the task, click 'Add Comment', and enter text.",res:'The comment appears in the task\'s comment and history log.'},
  {t:'Export List',what:'Prepares selected worklist records for export.',why:'Supports offline reporting and sharing.',ex:'An administrator exports all overdue tasks for a status meeting.',how:"Click 'Export List' and choose a scope.",res:'The simulator confirms the records prepared for export.'}
];
let helpOpen = new Set();
function toggleHelp(i){ if(helpOpen.has(i)) helpOpen.delete(i); else helpOpen.add(i); h(); }
function renderHelp(){
  return renderShell(`
    <div class="page-eyebrow">Reference</div>
    <h1 class="page-title">Help &amp; Learning Panel</h1>
    <p class="page-desc">What each feature is, why it matters, an example, how to use it, and the expected result.</p>
    <div class="panel">
      ${HELP_TOPICS.map((t,i)=>`
        <div class="help-item">
          <button class="help-q" onclick="toggleHelp(${i})">${esc(t.t)} <span>${helpOpen.has(i)?'−':'+'}</span></button>
          <div class="help-a ${helpOpen.has(i)?'open':''}">
            <div class="row"><b>What is it?</b> ${esc(t.what)}</div>
            <div class="row"><b>Why is it used?</b> ${esc(t.why)}</div>
            <div class="row"><b>Example:</b> ${esc(t.ex)}</div>
            <div class="row"><b>How to use it:</b> ${esc(t.how)}</div>
            <div class="row"><b>Expected result:</b> ${esc(t.res)}</div>
          </div>
        </div>`).join('')}
    </div>
  `);
}

/* ---------------- COMPLETION ---------------- */
function renderCompletion(){
  const mins = STATE.loginTime? Math.max(1,Math.round((Date.now()-STATE.loginTime)/60000)) : 0;
  const correctExam = STATE.exam.answers.filter((a,i)=>EXAM_QUESTIONS[i] && a===EXAM_QUESTIONS[i].a).length;
  return renderShell(`
    <div class="complete-wrap">
      <div class="trophy">🏆</div>
      <h1 class="page-title" style="text-align:center;">CONGRATULATIONS!</h1>
      <p class="page-desc" style="text-align:center;margin:0 auto 6px;">You completed</p>
      <p style="text-align:center;font-weight:800;color:var(--orange-dark);font-size:16px;">WORKLIST AND TASK MANAGEMENT</p>
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${STATE.scenariosCompleted}</div><div class="l">Scenarios Completed</div></div>
        <div class="stat-box"><div class="n">${STATE.actionsTaken}</div><div class="l">Tasks / Actions Processed</div></div>
        <div class="stat-box"><div class="n">${correctExam}</div><div class="l">Correct Exam Actions</div></div>
        <div class="stat-box"><div class="n">${EXAM_QUESTIONS.length?Math.round(correctExam/EXAM_QUESTIONS.length*100):0}%</div><div class="l">Score</div></div>
        <div class="stat-box"><div class="n">${mins}m</div><div class="l">Time Taken</div></div>
        <div class="stat-box"><div class="n">${esc(STATE.role)}</div><div class="l">Role Practiced</div></div>
      </div>
      <div class="login-card" style="margin:20px auto 0;max-width:400px;">
        <div class="login-brand" style="border-bottom:none;">
          <img src="${LOGO_SRC}" alt="BISP logo">
          <div class="tagline"><b>BISP Trainings</b><br>www.bisptrainings.com<br>Call Us: +91 769-409-5404</div>
        </div>
      </div>
      <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;">
        <button class="btn-sm" onclick="goTo('dashboard')">Back to Dashboard</button>
        <button class="btn-sm primary" onclick="goTo('exam')">Retake Exam</button>
      </div>
    </div>
  `);
}

/* ---------------- MASTER RENDER ---------------- */
function buildView(){
  renderModal();
  switch(STATE.view){
    case 'login': return renderLogin();
    case 'dashboard': STATE.__mode=null; return renderDashboard();
    case 'worklist': return renderWorklist();
    case 'taskDetail': return renderTaskDetail();
    case 'analytics': STATE.__mode=null; return renderAnalytics();
    case 'smartart': STATE.__mode=null; return renderSmartArt();
    case 'training': return renderTraining();
    case 'practice': return renderPractice();
    case 'exam': STATE.__mode=null; return renderExam();
    case 'completion': STATE.__mode=null; return renderCompletion();
    case 'help': STATE.__mode=null; return renderHelp();
    default: return renderLogin();
  }
}
h();
</script>
</body>
