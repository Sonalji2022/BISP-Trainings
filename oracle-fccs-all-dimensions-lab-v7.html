(()=>{'use strict';
const baseline={dimension:'Account',storage:'Store',twoPass:'Off',view:'YTD',currency:'INR',year:'FY26',period:'Mar',scenario:'Actual',scope:'Legal hierarchy',method:'Subsidiary',ownership:80,pcon:100,elimination:'On'};
const activities=[
{name:'Storage behavior',desc:'Change how a member stores or retrieves values.',focus:['storage'],task:'Try Store, Dynamic Calc, Never Share, Shared, and Label Only. Separate system behavior from accounting impact.',assign:['A1: Store → Dynamic Calc; predict System only.','A2: Select Label Only; predict NoData.']},
{name:'Calculation order',desc:'Test a ratio-dependent member formula.',focus:['twoPass','dimension','storage'],task:'Turn Two Pass on. Compare a valid Dynamic Calc configuration with an invalid stored member.',assign:['A3: Dynamic Calc + Two Pass On; inspect allocation.','A4: Store + Two Pass On; identify validation risk.']},
{name:'Time & currency',desc:'Change period aggregation and translation.',focus:['view','currency','year','period','scenario'],task:'Build a September YTD USD report, then compare it with September Periodic INR.',assign:['A5: FY26 Sep YTD in USD.','A6: FY27 Feb Periodic Budget in EUR.']},
{name:'Consolidation',desc:'Change PCON, ownership, and elimination.',focus:['method','ownership','pcon','elimination'],task:'Compare a controlled subsidiary, proportional consolidation, and an equity-method result.',assign:['A7: 60% proportional with elimination On.','A8: 80% equity method with elimination Off.']},
{name:'Capstone challenge',desc:'Combine properties and explain the outcome.',focus:Object.keys(baseline),task:'Create a FY27 Forecast, USD, Full Year view with Dynamic Calc and Two Pass. Explain numeric and system impacts.',assign:['A9: Build the stated capstone POV and predict impact.','A10: Explain one numeric and two system impacts.']}
];
const options={dimension:['Account','Reporting','Custom'],storage:['Store','Dynamic Calc','Never Share','Shared','Label Only'],twoPass:['Off','On'],view:['Periodic','QTD','YTD','Full Year'],currency:['INR','USD','EUR'],year:['FY25','FY26','FY27'],period:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],scenario:['Actual','Forecast','Budget'],scope:['Legal hierarchy','Management hierarchy','Combined hierarchies'],method:['Subsidiary','Proportional','Equity'],elimination:['On','Off']};
const labels={dimension:'Dimension Type',storage:'Data Storage',twoPass:'Two Pass Calculation',view:'Reporting View',currency:'Currency',year:'Start Year',period:'End Period',scenario:'Scenario',scope:'Reporting Hierarchy',method:'Consolidation Method',elimination:'Intercompany Elimination'};
const state={activity:0,applied:{...baseline},draft:{...baseline},before:{...baseline},prediction:'',feedback:'',attempts:0,correct:0,statement:'pl',done:{}};const months=options.period,season=[.88,.92,1,1.02,1.05,.98,1.08,1.04,.99,1.12,1.18,1.3];
const fmt=n=>Number(n).toLocaleString('en-IN',{maximumFractionDigits:1,minimumFractionDigits:1});
function span(p){const e=months.indexOf(p.period);if(p.view==='Periodic')return[e,e];if(p.view==='QTD')return[e-e%3,e];if(p.view==='Full Year')return[0,11];return[0,e]}
function validTwoPass(p){return p.twoPass==='Off'||p.storage==='Dynamic Calc'}
function model(p){const no=p.storage==='Label Only',[a,b]=span(p),yf={FY25:.92,FY26:1,FY27:1.08}[p.year],sf={Actual:1,Forecast:1.05,Budget:.97}[p.scenario],scope=p.scope==='Management hierarchy'?1.04:p.scope==='Combined hierarchies'?1.08:1,rateFlow=p.currency==='USD'?.0115:p.currency==='EUR'?.0106:1,rateClose=p.currency==='USD'?.012:p.currency==='EUR'?.011:1,methodFactor=p.method==='Subsidiary'?1:p.method==='Proportional'?p.pcon/100:p.ownership/100;let revenue=0,cogs=0,opex=0,dep=0,interest=0;for(let i=a;i<=b;i++){let x=season[i]*yf*sf*scope;revenue+=1200*x;cogs+=690*x;opex+=250*x;dep+=42*x;interest+=18*x}if(p.method!=='Equity'){revenue*=methodFactor;cogs*=methodFactor;opex*=methodFactor;dep*=methodFactor;interest*=methodFactor}const ic=p.elimination==='On'?revenue*.08:0,external=revenue-ic,two=validTwoPass(p)&&p.twoPass==='On',allocation=(two?external:revenue)*.02,gross=external-cogs,ebit=gross-opex-allocation-dep,tax=Math.max(0,ebit-interest)*.25,fullNet=ebit-interest-tax,net=p.method==='Equity'?fullNet*p.ownership/100:fullNet;
const ytd=season.slice(0,b+1).reduce((x,y)=>x+y,0)*yf*sf*scope*methodFactor,capex=110*ytd,borrow=35*ytd,repay=22*ytd,dividend=14*ytd,dar=45*ytd,dinv=25*ytd,dap=31*ytd,cfo=net+dep-dar-dinv+dap,cfi=-capex,cff=borrow-repay-dividend,change=cfo+cfi+cff,open=2600*yf*scope*methodFactor,cash=open+change,fx=cash*rateClose-open*rateClose-change*rateFlow,ar=1800*yf*scope*methodFactor+dar,inv=1350*yf*scope*methodFactor+dinv,ppe=6200*yf*scope*methodFactor+capex-dep,assets=cash+ar+inv+ppe,ap=1450*yf*scope*methodFactor+dap,debt=2200*yf*scope*methodFactor+borrow-repay,equity=5300*yf*scope*methodFactor+net-dividend,other=assets-ap-debt-equity,z=x=>no?0:x;
return{no,rateFlow,rateClose,pl:[['Revenue',z(revenue*rateFlow)],['Intercompany elimination',z(-ic*rateFlow)],['External revenue',z(external*rateFlow),'sub'],['Cost of sales',z(-cogs*rateFlow)],['Gross profit',z(gross*rateFlow),'sub'],['Operating expenses',z(-opex*rateFlow)],['Management allocation',z(-allocation*rateFlow)],['Depreciation',z(-dep*rateFlow)],['EBIT',z(ebit*rateFlow),'sub'],['Interest',z(-interest*rateFlow)],['Tax',z(-tax*rateFlow)],['Net income',z(net*rateFlow),'total']],bs:[['Cash',z(cash*rateClose)],['Accounts receivable',z(ar*rateClose)],['Inventory',z(inv*rateClose)],['Property, plant & equipment',z(ppe*rateClose)],['Total assets',z(assets*rateClose),'total'],['Accounts payable',z(ap*rateClose)],['Debt',z(debt*rateClose)],['Other liabilities',z(other*rateClose)],['Total liabilities',z((ap+debt+other)*rateClose),'sub'],['Equity',z(equity*rateClose)],['Liabilities & equity',z((ap+debt+other+equity)*rateClose),'total']],cf:[['Net income',z(net*rateFlow)],['Depreciation',z(dep*rateFlow)],['Change in receivables',z(-dar*rateFlow)],['Change in inventory',z(-dinv*rateFlow)],['Change in payables',z(dap*rateFlow)],['Operating cash flow',z(cfo*rateFlow),'sub'],['Capital expenditure',z(cfi*rateFlow)],['Investing cash flow',z(cfi*rateFlow),'sub'],['Borrowings',z(borrow*rateFlow)],['Debt repayment',z(-repay*rateFlow)],['Dividends',z(-dividend*rateFlow)],['Financing cash flow',z(cff*rateFlow),'sub'],['Net cash change',z(change*rateFlow),'total'],['Opening cash',z(open*rateClose)],['FX translation effect',z(fx)],['Closing cash',z(cash*rateClose),'total']]}}
function storageFacts(p){const map={Store:['Yes','Yes','Fast after calculation','Standard'], 'Dynamic Calc':['No','No','Calculated at query','Query cost'], 'Never Share':['Yes','Yes','Stored, unique block','Avoid implied share'],Shared:['Reference','No','Reads base member','Duplicate-risk'], 'Label Only':['No','No','No numeric retrieval','NoData']}[p.storage];return[['Data persisted',map[0]],['Direct input',map[1]],['Retrieval',map[2]],['Primary effect',map[3]],['Two Pass',validTwoPass(p)?(p.twoPass==='On'?'Active':'Off'):'Ignored / invalid']]}
function changed(){return Object.keys(state.draft).filter(k=>state.draft[k]!==state.applied[k])}

{id:'consolidation',name:'Consolidation',q:'At which consolidation stage?',role:'Separates entity input, proportion, elimination and final contribution.',stage:'Consolidate',members:[['FCCS_Entity Input','Input','Store','Translated entity data before consolidation adjustments.'],['FCCS_Entity Total','Adjust','Dynamic Calc','Entity input plus entity-level adjustments.'],['FCCS_Proportion','PCON','Store','Amount after applying the consolidation percentage.'],['FCCS_Elimination','Eliminate','Store','Intercompany elimination impact.'],['FCCS_Contribution','Report','Dynamic Calc','Proportion plus elimination contributed to the parent.']]},
{id:'currency',name:'Currency',q:'In which currency is the value viewed?',role:'Selects entity, parent, reporting or no-currency results.',stage:'Translate',members:[['Entity Currency','Local','Never Share','Local ledger currency input.'],['Parent Currency','Parent','Never Share','Result translated for the immediate parent.'],['USD_Reporting','Reporting','Store','USD reporting currency result.'],['No Currency','Non-currency','Never Share','Percentages and non-monetary metrics.']]},
{id:'datasource',name:'Data Source',q:'Where did the data originate?',role:'Preserves the audit trail between input, managed data, journals and eliminations.',stage:'Source',members:[['FCCS_Data Input','Input','Store','Loaded trial-balance data.'],['FCCS_Managed Data','Integration','Store','Data Management or integration load.'],['FCCS_Journal Input','Journal','Store','Posted consolidation journal.'],['FCCS_Intercompany Eliminations','System','Store','System-generated elimination result.']]},
{id:'entity',name:'Entity',q:'Which legal unit or group?',role:'Defines the ownership hierarchy and where consolidation occurs.',stage:'Own',members:[['FCCS_Total Geography','Group','Never Share','Top consolidation group.'],['North America','Parent','Store','Regional parent entity.'],['US 1 LE 1 BU 1','Subsidiary','Store','Controlled legal entity.'],['US 1 LE 2','Subsidiary','Store','Second consolidation entity.']]},
{id:'fromcurrency',name:'From Currency',q:'Which source currency supplies the rate?',role:'Identifies the currency translated into the selected reporting currency.',stage:'Translate',members:[['From_USD','USD','Store','Source rate from USD.'],['From_EUR','EUR','Store','Source rate from EUR.'],['From_INR','INR','Store','Source rate from INR.'],['From_GBP','GBP','Store','Source rate from GBP.']]},
{id:'intercompany',name:'Intercompany',q:'Who is the counterparty?',role:'Identifies partner balances so matching entries can eliminate.',stage:'Eliminate',members:[['FCCS_No Intercompany','External','Never Share','External or non-intercompany activity.'],['FCCS_Intercompany Entities','Parent','Dynamic Calc','Parent for valid ICP partners.'],['ICP_US1','Partner','Store','Counterparty US legal entity.'],['ICP_UK1','Partner','Store','Counterparty UK legal entity.']]},
{id:'movement',name:'Movement',q:'Why did the balance change?',role:'Rolls opening balances through operating, investing, financing and FX movements.',stage:'Move',members:[['FCCS_OpeningBalance','Opening','Never Share','Prior-period closing balance carried forward.'],['FCCS_Mvmts_Operating','Operating','Dynamic Calc','Operating movement and working capital.'],['FCCS_Mvmts_Investing','Investing','Dynamic Calc','Capital expenditure and disposals.'],['FCCS_Mvmts_Financing','Financing','Dynamic Calc','Debt, equity and dividend movements.'],['FCCS_Mvmts_FX_Total','FX','Dynamic Calc','Translation movement.'],['FCCS_ClosingBalance','Closing','Dynamic Calc','Opening plus all signed movements.']]},
{id:'gaap',name:'Multi-GAAP',q:'Which accounting basis?',role:'Separates local books, conversion adjustments and IFRS reporting.',stage:'Adjust',members:[['FCCS_Local GAAP','Local','Store','Local statutory accounting result.'],['FCCS_Adjustments','Adjustment','Store','IFRS conversion entries.'],['FCCS_IFRS','Reporting','Dynamic Calc','Local GAAP plus adjustments.'],['FCCS_No Multi-GAAP','None','Store','Applications without multiple GAAP reporting.']]},
{id:'period',name:'Period',q:'Which accounting period?',role:'Defines months, quarters and year totals used by reporting views.',stage:'Time',members:[['Jan','Month','Store','First base period.'],['Mar','Month','Store','Third base period.'],['Q1','Quarter','Dynamic Calc','January through March.'],['YearTotal','Year','Dynamic Calc','All base periods.']]},
{id:'scenario',name:'Scenario',q:'Actual, budget or forecast?',role:'Separates reported actuals from planning and comparative data.',stage:'POV',members:[['Actual','Actual','Store','Posted and consolidated actual data.'],['Budget','Plan','Store','Approved budget comparison.'],['Forecast','Forecast','Store','Updated expected result.'],['Actual_Restated','Restatement','Store','Illustrative restated reporting scenario.']]},
{id:'view',name:'View',q:'Periodic or cumulative?',role:'Controls periodic, QTD, HYTD and YTD time aggregation.',stage:'View',members:[['FCCS_Periodic','Periodic','Dynamic Calc','Current-period activity.'],['FCCS_QTD','QTD','Dynamic Calc','Quarter-to-date result.'],['FCCS_HYTD','HYTD','Dynamic Calc','Half-year-to-date result.'],['FCCS_YTD','YTD','Dynamic Calc','Year-to-date result.'],['FCCS_YTD_Input','Input view','Store','Landing member for YTD data input.']]},
{id:'years',name:'Years',q:'Which fiscal year?',role:'Identifies the reporting year and comparative time context.',stage:'Time',members:[['FY25','Historical','Store','Prior-year comparative.'],['FY26','Current','Store','Current reporting year.'],['FY27','Future','Store','Forecast or budget year.'],['FY28','Future','Store','Long-range comparative year.']]},
{id:'metric',name:'HSP_Metric',q:'Which technical metric?',role:'Supports approval, calculation and cell-security reporting.',stage:'Status',members:[['FCCS_Metric_ApprovalStatus','Approval','Never Share','Approval-state metric.'],['FCCS_Metric_CalculationStatus','Calculation','Never Share','OK, Impacted or No Data state.'],['FCCS_Metric_ConsolidatedApprovalStatus','Group approval','Never Share','Consolidated approval readiness.'],['HSP_Cell Level Security Access','Security','Store','Technical access metric.']]},
{id:'status',name:'Status',q:'Is the POV ready?',role:'Reports calculation and approval readiness for the selected intersection.',stage:'Status',members:[['FCCS_Status_CalculationStatus','Calculation','Never Share','Shows OK, Impacted or No Data.'],['FCCS_Status_ApprovalStatus','Approval','Never Share','Entity workflow state.'],['FCCS_Status_ConsolidatedApprovalStatus','Group approval','Never Share','Parent approval state.'],['Status','Root','Never Share','Status dimension root.']]}
];
const defaults={account:'Revenue',consolidation:'FCCS_Contribution',currency:'Parent Currency',datasource:'FCCS_Data Input',entity:'US 1 LE 1 BU 1',fromcurrency:'From_INR',intercompany:'FCCS_No Intercompany',movement:'FCCS_ClosingBalance',gaap:'FCCS_IFRS',period:'Mar',scenario:'Actual',view:'FCCS_YTD',years:'FY26',metric:'FCCS_Metric_CalculationStatus',status:'FCCS_Status_CalculationStatus'};
const missions=[['External revenue POV',{account:'Revenue',intercompany:'FCCS_No Intercompany',consolidation:'FCCS_Contribution'}],['Intercompany elimination',{intercompany:'ICP_US1',consolidation:'FCCS_Elimination',datasource:'FCCS_Intercompany Eliminations'}],['USD parent report',{currency:'Parent Currency',fromcurrency:'From_INR',entity:'US 1 LE 1 BU 1'}],['Q1 periodic analysis',{period:'Q1',view:'FCCS_Periodic',scenario:'Actual'}],['YTD input load',{view:'FCCS_YTD_Input',datasource:'FCCS_Data Input',period:'Mar'}],['IFRS conversion',{gaap:'FCCS_Adjustments',datasource:'FCCS_Journal Input'}],['Cash-flow operating movement',{account:'FCCS_Cash And Cash Equivalents',movement:'FCCS_Mvmts_Operating'}],['Proportional contribution',{consolidation:'FCCS_Proportion',entity:'US 1 LE 2'}],['FY27 forecast',{years:'FY27',scenario:'Forecast',view:'FCCS_YTD'}],['Ready-to-publish status',{metric:'FCCS_Metric_ConsolidatedApprovalStatus',status:'FCCS_Status_ConsolidatedApprovalStatus'}]];
const S={open:false,page:'explore',dim:'account',member:'Revenue',pov:{...defaults},done:{},feedback:{},explain:false};let root;const fmt=n=>Number(n).toLocaleString('en-IN',{maximumFractionDigits:1,minimumFractionDigits:1});
function selected(){return dims.find(d=>d.id===S.dim)}function member(){return selected().members.find(m=>m[0]===S.member)||selected().members[0]}
function tabs(){return '<div class="dim-tabs">'+dims.map((d,i)=>'<button data-dim="'+d.id+'" class="'+(S.dim===d.id?'active':'')+'"><small>'+String(i+1).padStart(2,'0')+'</small><strong>'+d.name+'</strong></button>').join('')+'<button data-dim-page="all" class="all">ALL<br>DIMENSIONS</button></div>'}
function detail(){const d=selected(),m=member();return '<aside class="dim-card detail"><div class="detail-head"><div><p class="dim-k">SELECTED MEMBER</p><h2>'+m[0]+'</h2></div><button class="explain" data-dim-action="explain">Explain</button></div><div class="facts"><div><small>Member type</small><strong>'+m[1]+'</strong></div><div><small>Data storage</small><strong>'+m[2]+'</strong></div><div><small>Stage</small><strong>'+d.stage+'</strong></div><div><small>Data entry</small><strong>'+(['Store','Never Share'].includes(m[2])?'Possible':'Calculated / system')+'</strong></div></div><section><small>ROLE IN CONSOLIDATION</small><p>'+m[3]+'</p></section><section><small>DIMENSION PURPOSE</small><p>'+d.role+'</p></section>'+(S.explain?'<section><small>EXAMPLE</small><p>At the current POV, '+m[0]+' answers “'+d.q+'” and works with the other selected dimensions to calculate the consolidated result.</p></section>':'')+'<button class="use-member" data-dim-action="use">Use this member in POV</button></aside>'}
function model(){let input=1000,source=S.pov.datasource==='FCCS_Journal Input'?80:S.pov.datasource==='FCCS_Managed Data'?950:S.pov.datasource==='FCCS_Intercompany Eliminations'?-100:input,scenario=S.pov.scenario==='Budget'?.97:S.pov.scenario==='Forecast'?1.06:1,year=S.pov.years==='FY25'?.92:S.pov.years==='FY27'?1.08:S.pov.years==='FY28'?1.14:1,time=S.pov.view==='FCCS_Periodic'?.34:S.pov.view==='FCCS_QTD'?.75:S.pov.view==='FCCS_HYTD'?.5:1,gaap=S.pov.gaap==='FCCS_Adjustments'?60:S.pov.gaap==='FCCS_Local GAAP'?0:35,local=(source*scenario*year*time)+gaap,rate=S.pov.currency==='Parent Currency'?.012:S.pov.currency==='USD_Reporting'?.0115:1,translated=local*rate,proportion=S.pov.consolidation==='FCCS_Proportion'?translated*.8:translated,elim=S.pov.intercompany!=='FCCS_No Intercompany'||S.pov.consolidation==='FCCS_Elimination'?-Math.abs(proportion*.1):0,contribution=S.pov.consolidation==='FCCS_Entity Input'?local:S.pov.consolidation==='FCCS_Entity Total'?translated:S.pov.consolidation==='FCCS_Elimination'?elim:proportion+elim;if(['FCCS_Metric_ApprovalStatus','FCCS_Metric_CalculationStatus','FCCS_Metric_ConsolidatedApprovalStatus'].includes(S.pov.metric)&&S.pov.account!=='Revenue'){}return{input:source,local,translated,proportion,elim,contribution}}
function povLab(){const m=model();return '<section class="dim-card pov-builder"><div class="pov-head"><div><p class="dim-k">ALL DIMENSIONS TOGETHER</p><h3>Live consolidation intersection</h3></div><button data-dim-action="reset">Reset POV</button></div><div class="pov-chips">'+dims.map(d=>'<button class="pov-chip" data-dim="'+d.id+'"><small>'+d.name+'</small><strong>'+S.pov[d.id]+'</strong></button>').join('')+'</div><div class="pipeline"><div class="pipe"><small>DATA SOURCE</small><strong>'+S.pov.datasource+'</strong><em>'+fmt(m.input)+'</em></div><div class="pipe"><small>MULTI-GAAP</small><strong>'+S.pov.gaap+'</strong><em>'+fmt(m.local)+'</em></div><div class="pipe"><small>CURRENCY</small><strong>'+S.pov.currency+'</strong><em>'+fmt(m.translated)+'</em></div><div class="pipe"><small>PROPORTION</small><strong>'+S.pov.consolidation+'</strong><em>'+fmt(m.proportion)+'</em></div><div class="pipe"><small>INTERCOMPANY</small><strong>'+S.pov.intercompany+'</strong><em>'+fmt(m.elim)+'</em></div><div class="pipe"><small>CONTRIBUTION</small><strong>Parent result</strong><em>'+fmt(m.contribution)+'</em></div></div><table class="impact-table"><thead><tr><th>Statement</th><th>Account / movement</th><th>POV interpretation</th><th class="num">Consolidated amount</th></tr></thead><tbody><tr><td>P&L</td><td>'+S.pov.account+'</td><td>'+S.pov.scenario+' · '+S.pov.view+'</td><td class="num">'+fmt(m.contribution)+'</td></tr><tr><td>Balance Sheet</td><td>'+S.pov.account+'</td><td>'+S.pov.movement+' · '+S.pov.currency+'</td><td class="num">'+fmt(m.contribution*1.8)+'</td></tr><tr><td>Cash Flow</td><td>'+S.pov.movement+'</td><td>'+S.pov.period+' · '+S.pov.years+'</td><td class="num">'+fmt(m.contribution*.28)+'</td></tr><tr class="total"><td colspan="3">Status: '+S.pov.status+'</td><td class="num">'+(m.contribution?'OK':'No Data')+'</td></tr></tbody></table></section>'}
function explore(){const d=selected();return '<div class="dim-hero"><div><p class="dim-k">DIMENSION '+String(dims.indexOf(d)+1).padStart(2,'0')+' · '+d.stage.toUpperCase()+'</p><h1>'+d.name+' Dimension</h1><p>'+d.role+' Key question: '+d.q+'</p></div><div class="dim-count"><strong>'+d.members.length+'</strong><span>LAB MEMBERS</span></div></div><div class="dim-grid"><section class="dim-card"><p class="dim-k">CHOOSE A MEMBER</p><h3>'+d.name+' hierarchy examples</h3><p>Select a member to inspect its properties, consolidation role and numeric effect.</p><div class="member-list">'+d.members.map(m=>'<button class="member '+(S.member===m[0]?'active':'')+'" data-member="'+m[0]+'"><small>'+m[1]+' · '+m[2]+'</small><strong>'+m[0]+'</strong><span>'+m[3]+'</span></button>').join('')+'</div></section>'+detail()+'</div>'+povLab()}
function all(){return '<div class="dim-hero"><div><p class="dim-k">COMPLETE FCCS MODEL</p><h1>All dimensions at a glance</h1><p>Every data value is stored or calculated at an intersection of these dimensions.</p></div><div class="dim-count"><strong>'+dims.length+'</strong><span>DIMENSIONS</span></div></div><div class="all-grid">'+dims.map((d,i)=>'<button class="all-card" data-dim="'+d.id+'"><small>'+String(i+1).padStart(2,'0')+' · '+d.stage+'</small><strong>'+d.name+'</strong><p>'+d.role+'</p></button>').join('')+'</div>'+povLab()}
function missionPage(){const score=Object.keys(S.done).length;return '<div class="mission-score"><div><p class="dim-k">KNOWLEDGE APPLICATION</p><h1>10 intersection assignments</h1></div><strong>'+score+'/10</strong></div><div class="mission-grid">'+missions.map((x,i)=>{const checked=S.feedback[i],ok=S.done[i];return '<article class="mission '+(checked?(ok?'good':'bad'):'')+'"><header><span>ASSIGNMENT '+String(i+1).padStart(2,'0')+'</span><em>POV BUILDER</em></header><h3>'+x[0]+'</h3><p>Configure: '+Object.entries(x[1]).map(([k,v])=>dims.find(d=>d.id===k).name+' = '+v).join(' · ')+'</p><button data-check-mission="'+i+'">Check current POV</button>'+(checked?'<div class="hint">'+(ok?'Correct. The current dimension intersection satisfies the assignment.':'Not yet. Return to Dimension Explorer and select the listed members.')+'</div>':'')+'</article>'}).join('')+'</div>'}
function render(){ensure();root.innerHTML='<button class="dim-launch" data-dim-action="open"><span>NEW IN V7</span>All Dimensions Lab</button><section class="dim-shell" '+(S.open?'':'hidden')+'><header class="dim-top"><div><h2>BISP FCCS Dimension Lab</h2><p>Members · POV · consolidation · assignments</p></div><nav><button data-dim-page="explore" class="'+(S.page==='explore'?'active':'')+'">Dimension Explorer</button><button data-dim-page="all" class="'+(S.page==='all'?'active':'')+'">All Together</button><button data-dim-page="missions" class="'+(S.page==='missions'?'active':'')+'">10 Assignments</button></nav><button class="dim-close" data-dim-action="close">×</button></header>'+tabs()+'<main class="dim-body">'+(S.page==='explore'?explore():S.page==='all'?all():missionPage())+'<p class="source">Aligned with Oracle FCCS concepts for <a target="_blank" href="https://docs.oracle.com/en/cloud/saas/financial-consolidation-cloud/agfcc/dim_overview.html">dimensions</a>, <a target="_blank" href="https://docs.oracle.com/en/cloud/saas/financial-consolidation-cloud/agfcc/consolidation_logic.html">consolidation logic</a>, and <a target="_blank" href="https://docs.oracle.com/en/cloud/saas/financial-consolidation-cloud/agfcc/intercompany_eliminations.html">intercompany eliminations</a>. Numeric examples are illustrative.</p></main></section>'}
function ensure(){if(!root||!root.isConnected){root=document.createElement('div');root.id='dimRoot';document.body.appendChild(root)}}
document.addEventListener('click',e=>{const act=e.target.closest('[data-dim-action]')?.dataset.dimAction;if(act==='open'){S.open=true;render()}if(act==='close'){S.open=false;render()}if(act==='reset'){S.pov={...defaults};render()}if(act==='explain'){S.explain=!S.explain;render()}if(act==='use'){S.pov[S.dim]=S.member;render()}const db=e.target.closest('[data-dim]');if(db){S.dim=db.dataset.dim;S.member=selected().members[0][0];S.page='explore';S.explain=false;render()}const mb=e.target.closest('[data-member]');if(mb){S.member=mb.dataset.member;S.explain=false;render()}const pg=e.target.closest('[data-dim-page]');if(pg){S.page=pg.dataset.dimPage;render()}const ck=e.target.closest('[data-check-mission]');if(ck){const i=Number(ck.dataset.checkMission),ok=Object.entries(missions[i][1]).every(([k,v])=>S.pov[k]===v);S.feedback[i]=true;if(ok)S.done[i]=true;localStorage.setItem('fccs-v7-missions',JSON.stringify(S.done));render()}});new MutationObserver(()=>{if(!document.getElementById('dimRoot'))render()}).observe(document.documentElement,{childList:true,subtree:true});try{S.done=JSON.parse(localStorage.getItem('fccs-v7-missions')||'{}')}catch{}render();
})();
</script></body></html>
