<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCS Implementation Simulator — Topic 19 | BISP Trainings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1F3C;
  --navy-2:#122c52;
  --blue:#1B5FAE;
  --blue-light:#3D8BD4;
  --orange:#F5821F;
  --orange-2:#FFA94D;
  --bg:#EEF2F7;
  --surface:#FFFFFF;
  --line:#DDE4ED;
  --text:#131B2C;
  --muted:#5C6B82;
  --muted-2:#8894A6;
  --success:#178A4C;
  --success-bg:#E6F5EC;
  --warn:#B36A00;
  --warn-bg:#FFF2DE;
  --danger:#C6323A;
  --danger-bg:#FCE9EA;
  --locked:#AEB8C6;
  --radius:10px;
  --shadow:0 1px 2px rgba(10,31,60,0.06), 0 8px 24px -12px rgba(10,31,60,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Space Grotesk',system-ui,sans-serif; margin:0; letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--orange-2); color:var(--navy);}

/* ---------- SHELL ---------- */
#app{display:flex; min-height:100vh;}

#sidebar{
  width:264px; flex-shrink:0; background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
  color:#DCE6F5; position:sticky; top:0; height:100vh; overflow-y:auto; z-index:40;
}
#sidebar::-webkit-scrollbar{width:6px;}
#sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:4px;}

.brand{padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; gap:10px;}
.brand img{height:34px; background:#fff; padding:5px 8px; border-radius:6px; display:block;}
.brand-name{font-family:'Space Grotesk'; font-weight:700; font-size:14.5px; color:#fff; line-height:1.25;}
.brand-sub{font-size:11px; color:#9FB2CC; letter-spacing:.03em;}

.navgroup{padding:10px 10px 4px;}
.navgroup-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#6E84A8; padding:12px 10px 6px; font-weight:600;}
.navitem{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:8px; cursor:pointer;
  font-size:13.3px; color:#C6D3E8; margin:1px 2px; transition:background .12s, color .12s;
}
.navitem:hover{background:rgba(255,255,255,0.06); color:#fff;}
.navitem.active{background:var(--orange); color:#1a1200; font-weight:600;}
.navitem .dot{width:6px; height:6px; border-radius:50%; background:#4C6488; flex-shrink:0;}
.navitem.active .dot{background:#1a1200;}
.navitem .lockbadge{margin-left:auto; font-size:9.5px; color:#8194B4; border:1px solid #3a4c6e; border-radius:4px; padding:1px 5px;}
.navitem.active .lockbadge{color:#5a3f00; border-color:#c96b00;}

.sidebar-foot{padding:14px 16px 20px; font-size:11px; color:#7C90B2; border-top:1px solid rgba(255,255,255,0.08); margin-top:6px;}
.sidebar-foot b{color:#C6D3E8;}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}

#topbar{
  position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line);
  padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;
}
#topbar .titles h1{font-size:18px;}
#topbar .titles .crumb{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px;}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--text); padding:8px 13px; border-radius:8px;
  font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .12s;
}
.btn:hover{border-color:var(--blue); color:var(--blue); transform:translateY(-1px);}
.btn-primary{background:var(--blue); border-color:var(--blue); color:#fff;}
.btn-primary:hover{background:var(--navy-2); border-color:var(--navy-2); color:#fff;}
.btn-orange{background:var(--orange); border-color:var(--orange); color:#2a1600;}
.btn-orange:hover{background:#d96f0f; border-color:#d96f0f; color:#fff;}
.btn-ghost{background:transparent; border-color:transparent; color:var(--muted);}
.btn-ghost:hover{color:var(--blue); border-color:var(--line);}
.btn-sm{padding:5px 10px; font-size:11.5px; border-radius:6px;}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}

#content{padding:22px 26px 60px; max-width:1280px; width:100%; margin:0 auto;}

/* toast */
#toastwrap{position:fixed; bottom:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--navy); color:#fff; padding:11px 16px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); max-width:340px; display:flex; gap:8px; align-items:flex-start; animation:in .18s ease;}
.toast.ok{background:var(--success);}
.toast.warn{background:var(--warn);}
.toast.err{background:var(--danger);}
@keyframes in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- COMMON WIDGETS ---------- */
.grid{display:grid; gap:14px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr;}}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
.card h3{font-size:14.5px; margin-bottom:2px;}
.card .hint{font-size:12px; color:var(--muted); margin-bottom:10px;}
.section-title{display:flex; align-items:baseline; gap:10px; margin:26px 0 12px;}
.section-title h2{font-size:16px;}
.section-title .n{font-family:'IBM Plex Mono'; font-size:11px; color:var(--orange); font-weight:600;}
.section-title:first-child{margin-top:0;}

.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
.kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600;}
.kpi .value{font-family:'Space Grotesk'; font-size:25px; font-weight:700; margin-top:4px;}
.kpi .sub{font-size:11.5px; color:var(--muted-2); margin-top:3px;}
.kpi .value.small{font-size:19px;}

.badge{display:inline-flex; align-items:center; gap:4px; font-size:10.8px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;}
.b-ok{background:var(--success-bg); color:var(--success);}
.b-warn{background:var(--warn-bg); color:var(--warn);}
.b-bad{background:var(--danger-bg); color:var(--danger);}
.b-locked{background:#EEF1F5; color:var(--locked);}
.b-info{background:#E7EFFB; color:var(--blue);}

.progressbar{height:8px; border-radius:6px; background:#E7ECF3; overflow:hidden;}
.progressbar > div{height:100%; background:linear-gradient(90deg,var(--blue),var(--blue-light)); border-radius:6px; transition:width .4s ease;}
.progressbar.orange > div{background:linear-gradient(90deg,var(--orange),var(--orange-2));}

table{width:100%; border-collapse:collapse; font-size:12.6px;}
th{text-align:left; font-size:10.8px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); background:#F7F9FC;}
td{padding:8px 10px; border-bottom:1px solid #EEF1F6; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tablewrap{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--surface); box-shadow:var(--shadow);}

input[type=text],input[type=number],select,textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:12.8px; font-family:inherit; background:#fff; color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-light); outline-offset:1px; border-color:var(--blue);}
label.f{font-size:11.5px; font-weight:600; color:var(--muted); display:block; margin-bottom:4px;}
.field{margin-bottom:10px;}
.formrow{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

.pillrow{display:flex; flex-wrap:wrap; gap:6px;}
.pill{font-size:11.3px; padding:5px 10px; border-radius:20px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--muted); font-weight:600;}
.pill.on{background:var(--blue); border-color:var(--blue); color:#fff;}
.pill.locked{opacity:.5; cursor:not-allowed;}

.checklist{display:flex; flex-direction:column; gap:2px;}
.checkitem{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid #F1F4F8; font-size:12.8px;}
.checkitem:last-child{border-bottom:none;}
.checkitem .box{width:18px; height:18px; border-radius:5px; border:1.6px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; background:#fff;}
.checkitem .box.done{background:var(--success); border-color:var(--success); color:#fff; font-size:12px;}
.checkitem .txt{flex:1;}
.checkitem .txt .d{font-size:11px; color:var(--muted-2);}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:14px; flex-wrap:wrap;}
.tab{padding:8px 13px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab:hover{color:var(--blue);}
.tab.active{color:var(--blue); border-color:var(--blue);}

.flow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:14px; background:#F7F9FC; border-radius:var(--radius); border:1px dashed var(--line);}
.flow .step{background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 13px; font-size:12px; font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; gap:6px;}
.flow .step.on{border-color:var(--blue); color:var(--blue); background:#EDF3FC;}
.flow .step.done{border-color:var(--success); color:var(--success); background:var(--success-bg);}
.flow .step.blocked{border-color:var(--danger); color:var(--danger); background:var(--danger-bg);}
.flow .arrow{color:var(--muted-2); font-size:14px;}

.chip{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:5px; background:#EEF1F6; color:var(--muted);}

.empty{padding:26px; text-align:center; color:var(--muted); font-size:12.8px; border:1px dashed var(--line); border-radius:var(--radius); background:#F9FAFC;}

.phaseband{display:flex; gap:10px; margin-bottom:6px; overflow-x:auto; padding-bottom:6px;}
.phasecard{
  flex:1; min-width:172px; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:14px 14px 12px;
  cursor:pointer; transition:all .14s; position:relative; box-shadow:var(--shadow);
}
.phasecard:hover{border-color:var(--blue-light); transform:translateY(-2px);}
.phasecard.locked{opacity:.55; cursor:not-allowed;}
.phasecard.locked:hover{transform:none; border-color:var(--line);}
.phasecard.current{border-color:var(--orange); box-shadow:0 0 0 3px rgba(245,130,31,0.13), var(--shadow);}
.phasecard .pnum{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--muted-2); font-weight:600;}
.phasecard h4{font-size:13.5px; margin:4px 0 8px;}
.phasecard .stat{font-size:11px; color:var(--muted);}

.maturity{display:flex; align-items:center; gap:0; margin:4px 0 2px;}
.maturity .seg{flex:1; height:34px; display:flex; align-items:center; justify-content:center; font-size:10.6px; font-weight:700; color:#fff; position:relative;}
.maturity .seg:first-child{border-radius:8px 0 0 8px;}
.maturity .seg:last-child{border-radius:0 8px 8px 0;}
.maturity .seg.off{background:#DDE4ED; color:#8894A6;}
.maturity .marker{position:absolute; top:-9px; width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:9px solid var(--navy); left:50%; transform:translateX(-50%);}

.dep-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:7px; font-size:12.4px; background:#fff;}
.dep-item .arrow{color:var(--orange); font-weight:700;}
.dep-item .status{margin-left:auto;}

.riskmatrix{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; max-width:340px;}
.riskcell{aspect-ratio:1.5; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff;}

.scorewheel{display:flex; align-items:center; gap:16px;}
.barlist{display:flex; flex-direction:column; gap:8px;}
.barlist .row{display:grid; grid-template-columns:110px 1fr 34px; gap:8px; align-items:center; font-size:11.6px;}

.exercisecard{border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; background:#fff; margin-bottom:10px; box-shadow:var(--shadow);}
.exercisecard .head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.exercisecard .body{font-size:12.6px; color:var(--muted); margin:6px 0 10px; line-height:1.55;}

.scenariocard{border:1px solid var(--line); border-radius:var(--radius); padding:16px; background:#fff; box-shadow:var(--shadow);}
.scenariocard .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px;}
.scenariocard .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); font-weight:700; margin-bottom:3px;}

.chart-wrap{padding:6px 0;}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:11.5px;}
.legend .li{display:flex; align-items:center; gap:6px; color:var(--muted);}
.legend .sw{width:10px; height:10px; border-radius:3px;}

.slider-row{display:flex; align-items:center; gap:10px;}
input[type=range]{flex:1; accent-color:var(--blue);}

.readiness-flag{display:flex; align-items:center; gap:8px; font-family:'Space Grotesk'; font-weight:700; font-size:14px; padding:12px 14px; border-radius:8px; margin-bottom:14px;}

.hero{background:linear-gradient(120deg,var(--navy) 0%, var(--navy-2) 60%, #17325c 100%); color:#fff; border-radius:14px; padding:26px 28px; margin-bottom:22px; position:relative; overflow:hidden;}
.hero:before{content:""; position:absolute; right:-60px; top:-60px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(245,130,31,0.28),transparent 70%);}
.hero .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--orange-2); font-weight:700;}
.hero h1{font-size:26px; color:#fff; margin:6px 0 8px;}
.hero p{font-size:13px; color:#B9C7DE; max-width:640px; line-height:1.6; margin:0;}
.hero .tel{margin-top:14px; font-size:12.5px; color:#D9E3F2;}

footer.appfoot{margin-top:40px; padding:18px 0 4px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted-2); display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;}
footer.appfoot b{color:var(--muted);}

@media(max-width:880px){
  #sidebar{position:fixed; left:-264px; transition:left .2s; box-shadow:var(--shadow);}
  #sidebar.open{left:0;}
  .formrow{grid-template-columns:1fr;}
  #content{padding:16px;}
}
.hamburger{display:none; background:none; border:1px solid var(--line); border-radius:7px; padding:7px 9px; cursor:pointer;}
@media(max-width:880px){.hamburger{display:inline-flex;}}
</style>
</head>

</div>

--------------------------------------------------------------------- */
function gateCount(){
  const g=S.gatesP1; const vals=Object.values(g);
  return {done:vals.filter(Boolean).length, total:vals.length};
}
function phase1Ready(){ const g=gateCount(); return g.done===g.total; }

function foundationScore(){
  const parts = [S.entities.users.length>0, S.entities.periods.length>0, S.entities.profiles.length>0, S.entities.formats.length>0, S.entities.balances.length>0, S.entities.reconciliations.length>0];
  return Math.round(100*parts.filter(Boolean).length/parts.length);
}
function securityScore(s){
  s = s||S;
  const vals = Object.values(s.security);
  return Math.round(100*vals.filter(Boolean).length/vals.length);
}
function dataQualityScore(){
  if(S.migration.runs.length===0) return 20;
  const totals = S.migration.runs.reduce((a,r)=>({loaded:a.loaded+r.loaded, rejected:a.rejected+r.rejected}), {loaded:0,rejected:0});
  if(totals.loaded===0) return 20;
  return Math.round(100*clamp((totals.loaded-totals.rejected)/totals.loaded,0,1));
}
function testingScore(){
  const tabs = Object.keys(S.testing).filter(k=>TESTING_TABS.includes(k));
  const ran = tabs.filter(t=>S.testing[t].run);
  if(ran.length===0) return 10;
  let total=0,pass=0;
  ran.forEach(t=>{ total += S.testing[t].passed+S.testing[t].failed; pass += S.testing[t].passed; });
  return total===0? 10 : Math.round(100*pass/total);
}
function governanceScore(){
  if(S.governance.crs.length===0) return 30;
  const approved = S.governance.crs.filter(c=>c.stage>=5).length;
  return Math.round(100*clamp(approved/S.governance.crs.length,0.2,1));
}
function automationScore(){
  let score=0,n=0;
  if(S.autoRecon){ score+=S.autoRecon.autoRate; n++; }
  if(S.matching.results){ score+=S.matching.results.totalRate; n++; }
  return n? Math.round(score/n) : 5;
}
function integrationScore(){
  let score = 20;
  if(S.integration.lastRun) score+=30;
  if(S.integration.env==="TEST") score = Math.max(score,55);
  if(S.integration.env==="PROD") score = Math.max(score,90);
  return clamp(score,0,100);
}
function performanceScore(){
  if(!S.matching.results) return 30;
  return clamp(100 - (S.matching.workers<4? 30:0) - (S.matching.results.unmatchedRate>5?20:0), 0, 100);
}
function aiReadinessScore(){
  if(!S.phases.p4.ready) return 10;
  if(!S.ai.run) return 35;
  return clamp(Math.round(S.ai.results.acceptRate),0,100);
}
function overallScore(){
  const parts = {
    Foundation:foundationScore(), Security:securityScore(), "Data Quality":dataQualityScore(),
    Testing:testingScore(), Governance:governanceScore(), Automation:automationScore(),
    Integration:integrationScore(), Performance:performanceScore(), "AI Readiness":aiReadinessScore(),
  };
  const avg = Object.values(parts).reduce((a,b)=>a+b,0)/Object.keys(parts).length;
  return {parts, avg:Math.round(avg)};
}
function readinessLabel(){
  const {avg} = overallScore();
  if(!phase1Ready()) return {label:"Not Ready", cls:"b-bad"};
  if(avg<45) return {label:"Foundation Ready", cls:"b-warn"};
  if(S.testing.blockedProduction || securityScore()<100) return {label:"Foundation Ready", cls:"b-warn"};
  if(avg<62) return {label:"Production Ready", cls:"b-info"};
  if(avg<75) return {label:"Enterprise Ready", cls:"b-info"};
  if(avg<88 || !S.ai.run) return {label:"AI Ready", cls:"b-ok"};
  if(S.touchlessLevel>=6) return {label:"Touchless-Close Ready", cls:"b-ok"};
  return {label:"AI Ready", cls:"b-ok"};
}
function maturityIndex(){
  // 0..4 across Foundation, Control, Automation, Integration, Intelligence
  if(S.phases.p5.ready || S.touchlessLevel>=5) return 4;
  if(S.phases.p4.ready) return 3;
  if(S.phases.p3.ready) return 2;
  if(S.phases.p2.ready) return 1;
  return 0;
}
function phaseUnlocked(n){
  if(n===1) return true;
  return S.phases["p"+(n-1)].ready;
}
function recomputePhaseReadiness(){
  S.phases.p1.ready = phase1Ready();
  S.phases.p2.ready = S.phases.p1.ready && S.rules.length>0 && S.autoRecon!==null && S.aging!==null;
  S.phases.p3.ready = S.phases.p2.ready && S.matching.results!==null;
  S.phases.p4.ready = S.phases.p3.ready && S.integration.lastRun && S.integration.env==="PROD";
  S.phases.p5.ready = S.phases.p4.ready && S.ai.run;
}

function kpiCard(label,value,sub,small){
  return `<div class="kpi"><div class="label">${label}</div><div class="value ${small?'small':''}">${value}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`;
}
function progress(pct,cls){ return `<div class="progressbar ${cls||''}"><div style="width:${clamp(pct,0,100)}%"></div></div>`; }
function badge(text,cls){ return `<span class="badge ${cls}">${text}</span>`; }
function barChart(rows, colorVar){
  // rows: [{label, value, max}]
  colorVar = colorVar||"var(--blue)";
  return `<div class="barlist">${rows.map(r=>`
    <div class="row">
      <div>${esc(r.label)}</div>
      <div class="progressbar"><div style="width:${clamp(100*r.value/(r.max||100),0,100)}%; background:${r.color||colorVar}"></div></div>
      <div class="mono" style="text-align:right;">${r.display!==undefined?r.display:r.value}</div>
    </div>`).join("")}</div>`;
}
function donut(segments, size){
  size = size||130;
  let acc=0; const stops=[];
  const total = segments.reduce((a,s)=>a+s.value,0)||1;
  segments.forEach(s=>{ const start=acc/total*360; acc+=s.value; const end=acc/total*360; stops.push(`${s.color} ${start}deg ${end}deg`); });
  return `<div style="display:flex; align-items:center; gap:18px;">
    <div style="width:${size}px;height:${size}px;border-radius:50%;background:conic-gradient(${stops.join(",")}); flex-shrink:0; box-shadow: inset 0 0 0 14px #fff;"></div>
    <div class="legend" style="flex-direction:column; align-items:flex-start; margin-top:0;">
      ${segments.map(s=>`<div class="li"><span class="sw" style="background:${s.color}"></span>${esc(s.label)}: <b>&nbsp;${fmtN(s.value)}</b> (${fmtPct(100*s.value/total)})</div>`).join("")}
    </div></div>`;
}
function flowDiagram(steps, activeIdx, blockedIdx){
  return `<div class="flow">${steps.map((s,i)=>{
    let cls = i<activeIdx?"done":(i===activeIdx?"on":"");
    if(blockedIdx===i) cls="blocked";
    return `<div class="step ${cls}">${s}</div>` + (i<steps.length-1?`<span class="arrow">→</span>`:"");
  }).join("")}</div>`;
}
function checklist(items){
  return `<div class="checklist">${items.map(it=>`
    <div class="checkitem">
      <div class="box ${it.done?'done':''}" ${it.onClick?`onclick="${it.onClick}"`:""} style="${it.onClick?'cursor:pointer':''}">${it.done?"✓":""}</div>
      <div class="txt">${esc(it.label)}${it.desc?`<div class="d">${esc(it.desc)}</div>`:""}</div>
      ${it.badge||""}
    </div>`).join("")}</div>`;
}
function sectionTitle(n,title){ return `<div class="section-title"><span class="n">${n}</span><h2>${title}</h2></div>`; }

function capsTotalCount(){ return PHASES.reduce((a,p)=>a+p.capabilities.length,0); }

}
function closeCycleTimeDays(){

  return Math.max(2, d);
}
function phaseCardHtml(p){

/* ---------------------------------------------------------------------

--------------------------------------------------------------------- */
function renderPhaseDetail(n){
  return function(c){
    const p = PHASES[n-1];
    const unlocked = phaseUnlocked(n);
    if(!unlocked){
      c.innerHTML = `<div class="card"><div class="readiness-flag" style="background:var(--danger-bg); color:var(--danger);">🔒 Phase ${n} is locked</div>
      <p style="color:var(--muted); font-size:13px;">Complete Phase ${n-1}'s readiness gate before this phase unlocks. This mirrors real implementation discipline — later capabilities depend on a stable foundation.</p>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="go('phase${n-1}')">Go to Phase ${n-1} →</button></div>`;
      return;
    }
    const tabs = ["Objectives","Capabilities","Dependencies","Configuration","Testing","Risks","KPIs","Exit Criteria"];
    if(!tabs.includes(S.phaseDetailTab)) S.phaseDetailTab="Objectives";
    let body = "";
    if(S.phaseDetailTab==="Objectives") body = `<div class="card"><h3>Objective</h3><p style="font-size:13px;color:var(--muted);line-height:1.6;">${p.objective}</p></div>`;
    else if(S.phaseDetailTab==="Capabilities") body = `<div class="card"><h3>Capabilities in this phase</h3><div class="pillrow" style="margin-top:8px;">${p.capabilities.map(cp=>`<span class="pill on">${cp}</span>`).join("")}</div></div>`;
    else if(S.phaseDetailTab==="Dependencies") body = `<div class="card"><h3>Dependencies</h3>${p.dependencies.map(d=>`<div class="dep-item"><span>${d}</span><span class="status">${badge(unlocked?"Satisfied":"Blocked", unlocked?"b-ok":"b-bad")}</span></div>`).join("")}</div>`;
    else if(S.phaseDetailTab==="Configuration") body = phaseConfigBody(n);
    else if(S.phaseDetailTab==="Testing") body = phaseTestingSummary(n);
    else if(S.phaseDetailTab==="Risks") body = `<div class="card"><h3>Risks tied to Phase ${n}</h3>${riskTable(S.risks.filter(r=>r.phase===n))}</div>`;
    else if(S.phaseDetailTab==="KPIs") body = phaseKpiBody(n);
    else if(S.phaseDetailTab==="Exit Criteria") body = `<div class="card"><h3>Exit criteria</h3>${checklist(p.exit.map(e=>({label:e, done:S.phases[p.key].ready})))}
      <div style="margin-top:12px;">${S.phases[p.key].ready? `<div class="readiness-flag" style="background:var(--success-bg); color:var(--success);">✓ Phase ${n} Ready</div>` : `<div class="readiness-flag" style="background:var(--warn-bg); color:var(--warn);">In progress — complete configuration to satisfy exit criteria</div>`}</div></div>`;

    c.innerHTML = `
    <div class="card" style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div>
        <div class="hint" style="margin-bottom:2px;">PHASE ${p.n} · ${p.tag.toUpperCase()}</div>
        <h3 style="font-size:18px;">${p.title}</h3>
      </div>
      ${S.phases[p.key].ready?badge("Phase Ready","b-ok"):badge("In Progress","b-warn")}
    </div>
    <div class="tabs">${tabs.map(t=>`<div class="tab ${S.phaseDetailTab===t?'active':''}" onclick="window.setPhaseTab('${t}')">${t}</div>`).join("")}</div>
    ${body}
    `;
  };
}
window.setPhaseTab = function(t){ S.phaseDetailTab=t; render(); };

function phaseConfigBody(n){
  if(n===1) return phase1Config();
  if(n===2) return phase2Config();
  if(n===3) return phase3Config();
  if(n===4) return phase4Config();
  if(n===5) return phase5Config();
}
function phaseTestingSummary(n){
  const map = {1:["Unit","UAT"],2:["Integration","Regression"],3:["Data","Performance"],4:["Security","Production Validation"],5:["System","UAT"]};
  const tabs = map[n]||["Unit"];
  return `<div class="card"><h3>Relevant test suites</h3><div class="hint">Run these from the Testing Center — results feed the phase readiness and overall score.</div>
  <div class="grid g2">${tabs.map(t=>{
    const d = S.testing[t];
    return `<div class="card"><h3 style="font-size:13px;">${t}</h3>
      ${d.run? `<div class="pillrow"><span class="pill on" style="background:var(--success);border-color:var(--success);">Passed ${d.passed}</span><span class="pill on" style="background:var(--danger);border-color:var(--danger);">Failed ${d.failed}</span><span class="pill on" style="background:var(--muted-2);border-color:var(--muted-2);">Blocked ${d.blocked}</span></div>` : `<div class="hint">Not yet run.</div>`}
      <button class="btn btn-sm" style="margin-top:8px;" onclick="go('testing')">Open Testing Center →</button>
    </div>`;

function phaseKpiBody(n){
  const rows = {
    1:[{label:"Reconciliation Completion Rate", value:reconCompletionRate(), max:100},
       {label:"Data Load Success Rate", value:dataQualityScore(), max:100}],
    2:[{label:"Auto-Reconciliation Rate", value:S.autoRecon?S.autoRecon.autoRate:0, max:100},
       {label:"Exception Rate", value:S.autoRecon?S.autoRecon.exceptionRate:0, max:100}],
    3:[{label:"Match Rate", value:S.matching.results?S.matching.results.totalRate:0, max:100},
       {label:"Unmatched Rate", value:S.matching.results?S.matching.results.unmatchedRate:0, max:100}],
    4:[{label:"Integration Readiness", value:integrationScore(), max:100},
       {label:"Performance Score", value:performanceScore(), max:100}],
    5:[{label:"AI Suggestion Acceptance", value:S.ai.results?S.ai.results.acceptRate:0, max:100},
       {label:"Touchless Maturity Level", value:S.touchlessLevel, max:6, display:S.touchlessLevel+" / 6"}],
  };
  return `<div class="card"><h3>Phase ${n} KPIs</h3>${barChart(rows[n])}</div>`;

function reconCompletionRate(){
  if(S.entities.reconciliations.length===0) return 0;
  return Math.round(100*S.entities.reconciliations.filter(r=>r.status==="Approved").length/S.entities.reconciliations.length);

function simpleTable(headers, rows){
  if(rows.length===0) return `<div class="empty">No records yet.</div>`;
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function reconTable(){
  if(S.entities.reconciliations.length===0) return `<div class="empty">No reconciliations generated yet.</div>`;
  return `<table><thead><tr><th>ID</th><th>Profile</th><th>Period</th><th>Status</th><th>Action</th></tr></thead><tbody>
  ${S.entities.reconciliations.map(r=>`<tr><td class="mono">REC-${r.id}</td><td>${r.profile}</td><td>${r.period}</td><td>${badge(r.status, r.status==="Approved"?"b-ok":(r.status==="In Review"?"b-info":"b-warn"))}</td>
  <td>${reconActionBtn(r)}</td></tr>`).join("")}
  </tbody></table>`;
}
function reconActionBtn(r){
  if(r.status==="Draft") return `<button class="btn btn-sm" onclick="window.reconSubmit(${r.id})">Submit</button>`;
  if(r.status==="In Review") return `<button class="btn btn-sm" onclick="window.reconApprove(${r.id})">Approve</button>`;
  return `<span class="chip">Complete</span>`;
}

    rows.push({bucket:b, count, amount: Math.round(count*(1800+Math.random()*4200))});
  });
  const totalCount = rows.reduce((a,r)=>a+r.count,0)||1;
  rows.forEach(r=>r.pct = 100*r.count/totalCount);
  S.aging = {rows};
  audit("Aging","Generate distribution","Success");

};

window.runMatching = function(){
  const bank=1000000, gl=980000, total=Math.min(bank,gl);
  const tolBoost = clamp(S.matching.tolerance*2.1, 0, 21);
  const ruleAdj = S.matching.ruleSet==="Strict"?-4:(S.matching.ruleSet==="Relaxed"?4:0);
  let exactRate = clamp(74 + ruleAdj - (S.matching.tolerance*0.3) + (Math.random()*2-1), 40, 92);
  let toleranceRate = clamp(tolBoost + ruleAdj*0.4 + (Math.random()*2-1), 0, 24);
  if(exactRate+toleranceRate>98) toleranceRate = 98-exactRate;
  const unmatchedRate = clamp(100-exactRate-toleranceRate, 0.5, 100);
  const exact = Math.round(total*exactRate/100);
  const tolerance = Math.round(total*toleranceRate/100);
  const unmatched = total-exact-tolerance;
  const runtime = Math.max(4, Math.round((total/ (S.matching.workers*38000))*10)/10);
  S.matching.results = {total, exact, tolerance, unmatched, exactRate, toleranceRate, unmatchedRate, totalRate:exactRate+toleranceRate, runtime};

};

  const failChance = critical? 0.22 : 0.12;
  let failed = 0, blocked=0;
  for(let i=0;i<n;i++){ const r=Math.random(); if(r<failChance*0.6) failed++; else if(r<failChance) blocked++; }
  const passed = n-failed-blocked;
  S.testing[t] = {passed, failed, blocked, run:true};
  if(critical && failed>0) S.testing.blockedProduction = true;
  audit("Testing: "+t,"Run suite","Success","—", passed+" passed / "+failed+" failed / "+blocked+" blocked");
  toast(t+" suite executed — "+passed+" passed, "+failed+" failed", failed>0?"warn":"ok");
  render();
};

function riskTable(risks, withActions){
  if(risks.length===0) return `<div class="empty">No risks in this view.</div>`;
  return `<table><thead><tr><th>Risk</th><th>Phase</th><th>Probability</th><th>Impact</th><th>Mitigation</th><th>Owner</th><th>Status</th>${withActions?"<th></th>":""}</tr></thead>
  <tbody>${risks.map(r=>`<tr><td>${esc(r.risk)}</td><td>P${r.phase}</td><td>${probBadge(r.prob)}</td><td>${probBadge(r.impact)}</td><td style="font-size:11.8px;color:var(--muted)">${esc(r.mitigation)}</td><td>${esc(r.owner)}</td><td>${statusBadge(r.status)}</td>
  ${withActions? `<td><button class="btn btn-sm" onclick="window.cycleRiskStatus(${r.id})">Advance</button></td>`:""}</tr>`).join("")}</tbody></table>`;
}
function probBadge(v){ const cls = v==="High"?"b-bad":(v==="Medium"?"b-warn":"b-ok"); return badge(v,cls); }
function statusBadge(v){ const cls = v==="Open"?"b-bad":(v==="Mitigated"?"b-warn":"b-ok"); return badge(v,cls); }
window.cycleRiskStatus = function(id){
  const r = S.risks.find(x=>x.id===id); const seq=["Open","Mitigated","Closed"];
  const next = seq[(seq.indexOf(r.status)+1)%seq.length];
  audit("Risk: "+r.risk,"Status change","Success",r.status,next); r.status=next; toast("Risk status updated","ok"); render();
};
function riskMatrix(){
  const levels=["Low","Medium","High"];
  const grid = levels.slice().reverse().map(imp=>levels.map(prob=>S.risks.filter(r=>r.impact===imp&&r.prob===prob).length));
  const colors = {"0,0":"var(--success)","default":"var(--warn)"};
  return `<div class="riskmatrix">${grid.flat().map((n,i)=>{
    const row=Math.floor(i/3), col=i%3;
    const sev = row+col;
    const color = sev>=3?"var(--danger)":(sev>=1.5?"var(--warn)":"var(--success)");
    return `<div class="riskcell" style="background:${color}">${n}</div>`;
  }).join("")}</div>
  <div class="legend"><div class="li">Rows: Impact (High→Low) · Columns: Probability (Low→High)</div></div>`;
}
