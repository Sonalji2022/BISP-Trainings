<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISP Trainings | Oracle ARCS Transaction Matching Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --navy-950:#08152B;
  --navy-900:#0B2545;
  --navy-800:#123262;
  --navy-700:#1B4079;
  --navy-100:#E7EDF6;
  --navy-50:#F4F7FB;
  --teal-600:#0F9B8E;
  --teal-500:#14B3A3;
  --teal-100:#DFF6F2;
  --amber-500:#E8A33D;
  --amber-100:#FCEFD9;
  --red-600:#D64545;
  --red-100:#FBE4E4;
  --green-600:#1E9E5A;
  --green-100:#E1F6EA;
  --ink-900:#101827;
  --ink-700:#3A4459;
  --ink-500:#6B7488;
  --ink-300:#AAB2C0;
  --line:#DFE4EC;
  --line-soft:#EAEEF4;
  --card:#FFFFFF;
  --bg:#F5F7FA;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --radius:10px;
  --sidebar-w:246px;
  --header-h:60px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink-900);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#C9D1DE;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

a{color:inherit;}
button{font-family:inherit;}

/* ===== APP SHELL ===== */
#app{display:flex;min-height:100vh;}

/* ---- Sidebar ---- */
#sidebar{
  width:var(--sidebar-w);
  background:linear-gradient(180deg,var(--navy-950) 0%,var(--navy-900) 100%);
  color:#CBD8EE;
  position:fixed;top:0;left:0;bottom:0;
  display:flex;flex-direction:column;
  z-index:40;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:16px 18px 14px 18px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.brand img{height:30px;display:block;background:#fff;border-radius:5px;padding:3px 6px;}
.brand-text{line-height:1.15;}
.brand-text .t1{font-weight:800;font-size:13.5px;color:#fff;letter-spacing:.2px;}
.brand-text .t2{font-size:10px;color:#8FA3C4;font-weight:500;letter-spacing:.3px;text-transform:uppercase;}

.nav-scroll{flex:1;overflow-y:auto;padding:10px 10px 10px 10px;}
.nav-group-label{
  font-size:10px;font-weight:700;letter-spacing:.8px;color:#5E729A;
  text-transform:uppercase;margin:14px 10px 6px 10px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;margin:1px 2px;border-radius:8px;
  font-size:13px;font-weight:500;color:#B7C4DC;cursor:pointer;
  border-left:3px solid transparent;
  transition:background .12s ease, color .12s ease;
  white-space:nowrap;
}
.nav-item .ic{width:17px;height:17px;flex:none;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{
  background:rgba(20,179,163,0.14);
  color:#fff;
  border-left:3px solid var(--teal-500);
  font-weight:600;
}
.nav-badge{
  margin-left:auto;background:var(--amber-500);color:#3A2600;
  font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:20px;
}
.sidebar-foot{
  padding:12px 16px;border-top:1px solid rgba(255,255,255,0.08);
  font-size:10.5px;color:#5E729A;line-height:1.6;
}
.sidebar-foot b{color:#93A7C9;}

/* ---- Main column ---- */
#main-col{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0;}

/* ---- Top header ---- */
#topheader{
  height:var(--header-h);
  background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;position:sticky;top:0;z-index:30;
}
.th-left{display:flex;align-items:center;gap:14px;}
.th-title{font-size:15px;font-weight:700;color:var(--navy-900);}
.th-crumb{font-size:12px;color:var(--ink-500);}
.th-right{display:flex;align-items:center;gap:10px;}
.pill{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;
  border:1px solid var(--line);color:var(--ink-700);background:var(--navy-50);
}
.pill.env{background:var(--teal-100);color:var(--teal-600);border-color:transparent;}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--teal-500);}
.th-icon-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
  background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-500);
  position:relative;
}
.th-icon-btn:hover{background:var(--navy-50);}
.th-icon-btn .noti-dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red-600);border:1.5px solid #fff;}
.avatar{
  width:32px;height:32px;border-radius:8px;background:var(--navy-800);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;
}

/* ---- Content ---- */
#content{padding:22px 26px 60px 26px;flex:1;}
.view{display:none;animation:fadein .18s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-head h1{font-size:20px;margin:0 0 3px 0;color:var(--navy-900);font-weight:800;}
.page-head p{margin:0;color:var(--ink-500);font-size:13px;}
.head-actions{display:flex;gap:8px;}

/* ---- Buttons ---- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;
  border:1px solid var(--line);background:#fff;color:var(--ink-700);cursor:pointer;
  transition:all .12s ease;
}
.btn:hover{border-color:var(--navy-700);color:var(--navy-900);}
.btn.primary{background:var(--navy-900);border-color:var(--navy-900);color:#fff;}
.btn.primary:hover{background:var(--navy-800);}
.btn.teal{background:var(--teal-600);border-color:var(--teal-600);color:#fff;}
.btn.teal:hover{background:#0C877C;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-500);}
.btn.ghost:hover{background:var(--navy-50);color:var(--ink-900);}
.btn.sm{padding:5px 10px;font-size:11.5px;}
.btn.danger{color:var(--red-600);border-color:var(--red-100);}
.btn.danger:hover{background:var(--red-100);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn .ic{width:14px;height:14px;}

/* ---- Cards / Grid ---- */
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1200px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;
}
.card h3{margin:0 0 12px 0;font-size:13px;font-weight:700;color:var(--navy-900);display:flex;align-items:center;justify-content:space-between;}
.card h3 span.sub{font-size:11px;font-weight:500;color:var(--ink-500);}

.kpi{padding:15px 16px;}
.kpi .lbl{font-size:11.5px;color:var(--ink-500);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.kpi .val{font-family:var(--mono);font-size:25px;font-weight:600;color:var(--navy-900);margin:6px 0 4px 0;}
.kpi .delta{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px;}
.kpi .delta.up{color:var(--green-600);}
.kpi .delta.down{color:var(--red-600);}
.kpi .delta.flat{color:var(--ink-500);}
.kpi .bar-track{height:5px;border-radius:4px;background:var(--line-soft);margin-top:10px;overflow:hidden;}
.kpi .bar-fill{height:100%;border-radius:4px;background:var(--teal-500);}

/* ---- Tables ---- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px;}
table.dt thead th{
  text-align:left;background:var(--navy-50);color:var(--ink-700);
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;
}
table.dt tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-900);white-space:nowrap;}
table.dt tbody tr:hover{background:var(--navy-50);}
table.dt tbody tr:last-child td{border-bottom:none;}
.mono{font-family:var(--mono);}
.tright{text-align:right;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.2px;}
.badge.green{background:var(--green-100);color:var(--green-600);}
.badge.amber{background:var(--amber-100);color:#9C6A0E;}
.badge.red{background:var(--red-100);color:var(--red-600);}
.badge.teal{background:var(--teal-100);color:var(--teal-600);}
.badge.gray{background:var(--navy-50);color:var(--ink-500);}
.badge.navy{background:var(--navy-100);color:var(--navy-800);}

.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.search-box{
  display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  border-radius:7px;padding:7px 10px;font-size:12.5px;color:var(--ink-500);min-width:220px;
}
.search-box input{border:none;outline:none;font-size:12.5px;width:100%;background:transparent;}
.select-sm{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;background:#fff;color:var(--ink-700);}
.spacer{flex:1;}

/* ---- Modal ---- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,18,35,0.5);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:#fff;border-radius:12px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(8,21,43,0.35);
  animation:modalin .16s ease;
}
@keyframes modalin{from{opacity:0;transform:translateY(-8px) scale(.98);}to{opacity:1;transform:none;}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h4{margin:0;font-size:14.5px;font-weight:700;color:var(--navy-900);}
.modal-body{padding:18px 20px;max-height:60vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.close-x{cursor:pointer;color:var(--ink-500);font-size:18px;line-height:1;border:none;background:none;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-700);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13px;color:var(--ink-900);font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal-500);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.hint{font-size:11px;color:var(--ink-500);margin-top:4px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--navy-900);color:#fff;padding:11px 16px;border-radius:8px;font-size:12.5px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);display:flex;align-items:center;gap:8px;min-width:220px;
  animation:toastin .18s ease;
}
.toast.success{background:var(--green-600);}
.toast.error{background:var(--red-600);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.footer-brand{
  margin-top:26px;padding:16px 4px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;color:var(--ink-500);font-size:11.5px;flex-wrap:wrap;gap:6px;
}
.footer-brand b{color:var(--navy-800);}

.empty-state{padding:40px 20px;text-align:center;color:var(--ink-500);}
.empty-state .ic{font-size:30px;margin-bottom:8px;}

.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.tab{padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--ink-500);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--navy-900);border-bottom-color:var(--teal-500);}

.flow-row{display:flex;align-items:center;gap:0;overflow-x:auto;padding:8px 2px 14px 2px;}
.flow-step{
  flex:none;min-width:150px;border:1.5px solid var(--line);border-radius:9px;background:#fff;
  padding:12px 14px;position:relative;transition:all .25s ease;
}
.flow-step .fn{font-size:9.5px;font-weight:800;color:var(--ink-300);letter-spacing:.5px;text-transform:uppercase;}
.flow-step .ft{font-size:12.5px;font-weight:700;color:var(--navy-900);margin-top:3px;}
.flow-step .fv{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--teal-600);margin-top:5px;}
.flow-arrow{flex:none;width:26px;color:var(--ink-300);text-align:center;font-size:16px;}
.flow-step.active{border-color:var(--teal-500);box-shadow:0 0 0 3px var(--teal-100);}
.flow-step.done{border-color:var(--green-600);}
.flow-step.done .fv{color:var(--green-600);}

.progress-outer{height:8px;background:var(--line-soft);border-radius:8px;overflow:hidden;margin:10px 0;}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--teal-500),var(--teal-600));border-radius:8px;transition:width .3s ease;}

.wb-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.wb-panel{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;}
.wb-panel-head{background:var(--navy-50);padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.wb-panel-head b{font-size:12.5px;color:var(--navy-900);}
.wb-list{max-height:420px;overflow-y:auto;}
.wb-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12px;}
.wb-row:hover{background:var(--navy-50);}
.wb-row.selected{background:var(--teal-100);}
.wb-row input{margin:0;}
.wb-row .rmain{flex:1;min-width:0;}
.wb-row .rref{font-weight:700;color:var(--navy-900);font-family:var(--mono);font-size:11.5px;}
.wb-row .rmeta{color:var(--ink-500);font-size:10.5px;margin-top:1px;}
.wb-row .ramt{font-family:var(--mono);font-weight:700;font-size:12.5px;}
.wb-summary{border-top:1px solid var(--line);background:var(--navy-50);padding:12px 14px;}
.wb-summary .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--ink-700);}
.wb-summary .row b{font-family:var(--mono);}
.wb-summary .diffrow{font-weight:800;color:var(--navy-900);border-top:1px dashed var(--line);padding-top:6px;margin-top:6px;}

.suggest-box{border:1.5px dashed var(--teal-500);background:var(--teal-100);border-radius:9px;padding:13px 15px;margin-bottom:14px;}
.suggest-box .stitle{font-size:11px;font-weight:800;color:var(--teal-600);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}

.checklist-item{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff;}
.checklist-item .cnum{width:24px;height:24px;border-radius:7px;background:var(--navy-50);color:var(--navy-700);font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center;flex:none;}
.checklist-item.done{border-color:var(--green-600);background:var(--green-100);}
.checklist-item.done .cnum{background:var(--green-600);color:#fff;}
.checklist-item .ctitle{font-weight:700;font-size:12.5px;color:var(--navy-900);}
.checklist-item .cdesc{font-size:11.5px;color:var(--ink-500);margin-top:2px;}

.aging-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:11.5px;}
.aging-bar-row .lbl{width:90px;color:var(--ink-500);font-weight:600;flex:none;}
.aging-bar-row .track{flex:1;height:16px;background:var(--line-soft);border-radius:5px;overflow:hidden;}
.aging-bar-row .fill{height:100%;border-radius:5px;}
.aging-bar-row .num{width:38px;text-align:right;font-family:var(--mono);font-weight:700;flex:none;}

.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:18px;}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item:before{content:'';position:absolute;left:-23.5px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--teal-500);border:2px solid #fff;box-shadow:0 0 0 2px var(--teal-500);}
.tl-time{font-family:var(--mono);font-size:10.5px;color:var(--ink-500);}
.tl-txt{font-size:12.5px;color:var(--ink-900);margin-top:2px;}
.tl-txt b{color:var(--navy-900);}

.pipe-list{list-style:none;margin:0;padding:0;}
.pipe-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
.pipe-list li .seq{width:20px;height:20px;border-radius:5px;background:var(--navy-100);color:var(--navy-800);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}

.help-panel{max-width:760px;}
.help-panel h4{color:var(--navy-900);margin:20px 0 8px 0;font-size:13.5px;}
.help-panel p{color:var(--ink-700);font-size:12.5px;line-height:1.7;margin:0 0 8px 0;}

.score-ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--teal-500) calc(var(--pct)*1%),var(--line-soft) 0);display:flex;align-items:center;justify-content:center;flex:none;}
.score-ring .inner{width:74px;height:74px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-ring .inner b{font-size:19px;color:var(--navy-900);font-family:var(--mono);}
.score-ring .inner span{font-size:9px;color:var(--ink-500);text-transform:uppercase;font-weight:700;}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--ink-700);cursor:pointer;}
.chip.on{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}

@media(max-width:980px){
  :root{--sidebar-w:0px;}
  #sidebar{transform:translateX(-100%);}
  .g4{grid-template-columns:1fr 1fr;}
  .wb-cols{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <img id="brandLogo" src="" alt="BISP Trainings"/>
      <div class="brand-text">
        <div class="t1">BISP Trainings</div>
        <div class="t2">ARCS Matching Simulator</div>
      </div>
    </div>
    <div class="nav-scroll" id="navScroll"></div>
    <div class="sidebar-foot">
      <b>BISP Trainings</b><br/>
      www.bisptrainings.com<br/>
      Call Us: +91 769-409-5404
    </div>
  </aside>

  <div id="main-col">
    <header id="topheader">
      <div class="th-left">
        <div>
          <div class="th-title" id="pageTitle">Dashboard</div>
          <div class="th-crumb" id="pageCrumb">Home / Dashboard</div>
        </div>
      </div>
      <div class="th-right">

/* ---------------- Utility helpers ---------------- */
function fmtMoney(n){
  const sign = n<0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtNum(n){ return n.toLocaleString('en-US'); }
function pad(n,len){ return String(n).padStart(len,'0'); }
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,7).toUpperCase(); }
function nowTimeStr(){
  const d = new Date();
  let h = d.getHours(), m = pad(d.getMinutes(),2);
  const ap = h>=12?'PM':'AM';
  h = h%12; if(h===0) h=12;
  return `${h}:${m} ${ap}`;
}
function daysBetween(d1,d2){
  return Math.round((d2 - d1) / (1000*60*60*24));
}
function dateFromDay(dayOfJan){
  return new Date(2026,0,dayOfJan);
}
function fmtDate(d){
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${pad(d.getDate(),2)}-${months[d.getMonth()]}-${d.getFullYear()}`;
}
function newJobId(){
  APP.jobCounter++;
  return 'JOB-TM-' + pad(APP.jobCounter,5);
}
function addAudit(user,action,object,oldVal,newVal,status){
  APP.auditLog.unshift({
    time: nowTimeStr(),
    date: 'Aug 12, 2026',
    user: user || 'Training User',
    action, object,
    oldVal: oldVal||'-', newVal: newVal||'-',
    status: status || 'Success'
  });
}
function addJob(type, records, status, extra){
  const j = {
    id: newJobId(), type, start: nowTimeStr(), end: nowTimeStr(),
    records: records||0, status: status||'Completed', user:'Training User', extra: extra||''
  };
  APP.jobs.unshift(j);
  return j;
}
function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind||'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 2600);
}

let GLSeq = 90000;

function buildSampleData(){
  BankTxns = []; GLTxns = []; TxnSeq = 10000; GLSeq = 90000;

      date:dateFromDay(dayGL), account:'101100', entity:'100', tag,
      status:'Unmatched', matchGroup:null, duplicate:false

    const amt = Math.round((500 + Math.random()*20000));
    const diff = (Math.random()<0.5?1:-1) * (1+Math.floor(Math.random()*5));
    const day = 3 + (i % 25);
    pushPair(amt, amt+diff, day, day, 'DEP-'+depSeq, 'DEP-'+depSeq, 'tolerance');
  }

  // 10 date-difference matches — within 3 days
  for(let i=0;i<10;i++){
    depSeq++;
    const amt = Math.round((500 + Math.random()*15000));
    const dayB = 3 + (i % 24);
    const dayG = dayB + (Math.random()<0.5?1:2);
    pushPair(amt, amt, dayB, Math.min(dayG,31), 'DEP-'+depSeq, 'DEP-'+depSeq, 'datediff');
  }

  // 5 duplicates (bank side has a duplicate entry)
  for(let i=0;i<5;i++){
    depSeq++;
    const amt = Math.round((300 + Math.random()*9000));
    const day = 4 + i*3;
    const p = pushPair(amt, amt, day, day, 'DEP-'+depSeq, 'DEP-'+depSeq, 'duplicate');
    TxnSeq++;
    const dup = {...p.bank, id:'B-'+TxnSeq, status:'Unmatched', duplicate:true};
    BankTxns.push(dup);
  }

  // 5 high-value unmatched (bank only, no GL counterpart)
  for(let i=0;i<5;i++){
    depSeq++; TxnSeq++;
    BankTxns.push({
      id:'B-'+TxnSeq, source:'BANK', ref:'WIRE-'+(9000+i), amount: 55000+Math.round(Math.random()*120000),
      currency:'USD', date:dateFromDay(6+i*4), account:'101100', entity:'100', tag:'highvalue_unmatched',
      status:'Unmatched', matchGroup:null, duplicate:false
    });
  }

  // 5 old unmatched (GL only, dated much earlier — will age >90 days conceptually)
  for(let i=0;i<5;i++){
    depSeq++; GLSeq++;
    GLTxns.push({
      id:'G-'+GLSeq, source:'GL', ref:'MISC-'+(7000+i), amount: 800+Math.round(Math.random()*4000),
      currency:'USD', date:dateFromDay(2+i), account:'101100', entity:'100', tag:'old_unmatched',
      status:'Unmatched', matchGroup:null, duplicate:false, agingOverrideDays: 95+ i*40
    });
  }

  // fill remaining to reach ~100/100 with plain unmatched noise items
  while(BankTxns.length < 100){
    depSeq++; TxnSeq++;
    BankTxns.push({
      id:'B-'+TxnSeq, source:'BANK', ref:'MISC-'+depSeq, amount: 150+Math.round(Math.random()*6000),
      currency:'USD', date:dateFromDay(2+Math.floor(Math.random()*28)), account:'101100', entity:'100', tag:'noise',
      status:'Unmatched', matchGroup:null, duplicate:false
    });
  }
  while(GLTxns.length < 100){
    depSeq++; GLSeq++;
    GLTxns.push({
      id:'G-'+GLSeq, source:'GL', ref:'MISC-'+depSeq, amount: 150+Math.round(Math.random()*6000),
      currency:'USD', date:dateFromDay(2+Math.floor(Math.random()*28)), account:'101100', entity:'100', tag:'noise',
      status:'Unmatched', matchGroup:null, duplicate:false
    });
  }
}

function safeChart(key, canvasId, config){
  if(typeof Chart === 'undefined'){

function computeStats(){
  const totalTxns = BankTxns.length + GLTxns.length - (AutoMatchState.hasRun?0:0);
  const matchedBank = BankTxns.filter(t=>t.status==='Matched');
  const matchedGL = GLTxns.filter(t=>t.status==='Matched');
  const autoMatched = BankTxns.filter(t=>t.matchGroup && t.matchMethod==='auto').length + GLTxns.filter(t=>t.matchGroup && t.matchMethod==='auto').length;
  const manualMatched = BankTxns.filter(t=>t.matchGroup && t.matchMethod==='manual').length + GLTxns.filter(t=>t.matchGroup && t.matchMethod==='manual').length;
  const unmatchedBank = BankTxns.filter(t=>t.status!=='Matched');
  const unmatchedGL = GLTxns.filter(t=>t.status!=='Matched');
  const totalUnmatched = unmatchedBank.length + unmatchedGL.length;
  const totalMatched = matchedBank.length + matchedGL.length;
  const highValueUnmatched = unmatchedBank.filter(t=>t.amount>50000).length + unmatchedGL.filter(t=>t.amount>50000).length;
  const oldUnmatched = unmatchedGL.filter(t=>t.tag==='old_unmatched').length + unmatchedBank.filter(t=>ageOf(t)>90).length;
  const pendingApprovals = Adjustments.filter(a=>a.status==='Submitted').length;
  const journalExported = Adjustments.filter(a=>['Exported','ERP Accepted','Posted'].includes(a.journalStatus)).length;
  return {
    totalTxns, totalMatched, totalUnmatched, autoMatched, manualMatched,
    adjustments: Adjustments.length, highValueUnmatched, oldUnmatched, pendingApprovals, journalExported,
    matchRate: totalTxns? (totalMatched/totalTxns*100):0
  };
}
function ageOf(t){
  const ref = new Date(2026,1,1); // "today" = Feb 1 2026 for training purposes
  let d = daysBetween(t.date, ref);
  if(t.agingOverrideDays) d = t.agingOverrideDays;
  return Math.max(d,0);
}

function getAgingBuckets(){
  const buckets = [
    {label:'0-30 Days', min:0,max:30,count:0},
    {label:'31-60 Days', min:31,max:60,count:0},
    {label:'61-90 Days', min:61,max:90,count:0},
    {label:'91-180 Days', min:91,max:180,count:0},
    {label:'181-365 Days', min:181,max:365,count:0},
    {label:'>365 Days', min:366,max:99999,count:0},
  ];
  const all = [...BankTxns, ...GLTxns].filter(t=>t.status!=='Matched');
  all.forEach(t=>{
    const a = ageOf(t);
    const b = buckets.find(bk=>a>=bk.min && a<=bk.max);
    if(b) b.count++;
  });
  return buckets;
}

ImportUI.run = function(){
  if(this.running) return;
  this.running = true;
  const sourceSel = document.getElementById('impSource').value;
  const isBank = sourceSel.startsWith('BANK');
  const fileName = isBank ? 'BANK_JAN_2026.csv' : 'GL_JAN_2026.csv';
  const total = isBank ? BankTxns.length : GLTxns.length;
  const rejected = Math.max(1, Math.round(total*0.012));
  const dup = isBank ? BankTxns.filter(t=>t.duplicate).length : 0;
  const valid = total - rejected;
  const area = document.getElementById('impProgressArea');
  const btn = document.getElementById('impBtn');
  btn.disabled = true; btn.textContent = 'Importing...';
  const jobId = newJobId();
  area.innerHTML = `
    <div style="font-size:12.5px;color:var(--ink-700);margin-bottom:6px;">Job <b class="mono">${jobId}</b> — loading <b>${fileName}</b>...</div>
    <div class="progress-outer"><div class="progress-inner" id="impBar" style="width:0%;"></div></div>
    <div style="font-size:11.5px;color:var(--ink-500);" id="impStage">Connecting to source...</div>
  `;
  const stages = ['Connecting to source...','Reading file records...','Validating field mapping...','Checking duplicates...','Finalizing load...','Completed'];
  let pct = 0, si = 0;
  const timer = setInterval(()=>{
    pct += 18 + Math.random()*10;
    if(pct>100) pct=100;
    document.getElementById('impBar').style.width = pct+'%';
    si = Math.min(stages.length-1, Math.floor(pct/20));
    document.getElementById('impStage').textContent = stages[si];
    if(pct>=100){
      clearInterval(timer);
      setTimeout(()=>ImportUI.finish(jobId, fileName, total, valid, rejected, dup, isBank), 250);
    }
  }, 220);
};
ImportUI.finish = function(jobId, fileName, total, valid, rejected, dup, isBank){
  const area = document.getElementById('impProgressArea');
  area.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <span class="badge green">Completed</span><span class="mono" style="font-size:12px;">${jobId}</span>

  `;
  document.getElementById('impBtn').disabled = false;
  document.getElementById('impBtn').textContent = 'Import File';
  this.running = false;
  this.history = this.history || [];
  this.history.unshift({id:jobId, source:fileName, received:total, valid, rejected, dup, status:'Completed', time:nowTimeStr()});
  this.renderHistory();
  addJob('Transaction Import', total, 'Completed', fileName);
  addAudit(null,'Transaction Imported', fileName, '-', `${valid} valid / ${rejected} rejected`);
  toast(`${fileName} imported — ${fmtNum(valid)} valid records`,'success');

};

/* The matching engine — applies rules deterministically against sample data by tag */
const AutoMatchEngine = {
  preview(){
    // rough preview counts based on tags, used only for animated step values
    const exact = BankTxns.filter(t=>t.tag==='exact').length;
    const tol = BankTxns.filter(t=>t.tag==='tolerance').length;
    const dd = BankTxns.filter(t=>t.tag==='datediff').length;
    return { rule1:exact, rule2:tol, rule3:dd, totalMatched:(exact+tol+dd)*2, adjustments:tol, unmatchedCount:(BankTxns.length+GLTxns.length)-((exact+tol+dd)*2) };
  },
  execute(jobId){
    let rule1=0, rule2=0, rule3=0, adjustmentsCreated=0;
    // group by ref for exact/tolerance/datediff pairing
    const glByRef = {};
    GLTxns.forEach(g=>{ if(!glByRef[g.ref]) glByRef[g.ref]=[]; glByRef[g.ref].push(g); });

    BankTxns.forEach(b=>{
      if(b.status==='Matched') return;
      if(b.duplicate){ return; } // duplicates remain unmatched, flagged for exception review
      const candidates = (glByRef[b.ref]||[]).filter(g=>g.status!=='Matched');
      if(!candidates.length) return;
      // pick best candidate (closest amount)
      candidates.sort((x,y)=>Math.abs(x.amount-b.amount)-Math.abs(y.amount-b.amount));
      const g = candidates[0];
      const amtDiff = Math.abs(g.amount-b.amount);
      const dateDiff = Math.abs(daysBetween(b.date,g.date));

      if(amtDiff===0 && dateDiff===0){
        confirmMatch(b,g,'auto','RULE_EXACT_REF_AMT');
        rule1++;
      } else if(amtDiff<=5 && dateDiff===0){
        confirmMatch(b,g,'auto','RULE_AMT_TOL');
        rule2++;
        if(amtDiff>0){ createAutoAdjustment(b,g,amtDiff); adjustmentsCreated++; }
      } else if(amtDiff<=5 && dateDiff<=3){
        confirmMatch(b,g,'auto','RULE_DATE_TOL');
        rule3++;
        if(amtDiff>0){ createAutoAdjustment(b,g,amtDiff); adjustmentsCreated++; }
      }
    });

    const unmatchedCount = BankTxns.filter(t=>t.status!=='Matched').length + GLTxns.filter(t=>t.status!=='Matched').length;
    const totalMatched = BankTxns.filter(t=>t.status==='Matched').length + GLTxns.filter(t=>t.status==='Matched').length;

    return {
      jobId, timestamp:'Aug 12, 2026 ' + nowTimeStr(),
      eligible: BankTxns.length+GLTxns.length,
      rule1, rule2, rule3, totalMatched, unmatchedCount, adjustments: adjustmentsCreated
    };
  }
};

function confirmMatch(b,g,method,ruleId){
  const grp = uid('MG');
  b.status='Matched'; g.status='Matched';
  b.matchGroup=grp; g.matchGroup=grp;
  b.matchMethod=method; g.matchMethod=method;
  b.matchRule=ruleId; g.matchRule=ruleId;
}
function createAutoAdjustment(b,g,amtDiff){
  APP.adjCounter++;
  Adjustments.push({
    id:'ADJ-'+pad(APP.adjCounter,4),
    type:'Bank Fee', debit:'Bank Charges Expense', credit:'Cash — 101100',
    entity:'100', department:'Treasury', currency:'USD', amount:amtDiff,
    desc:`Auto-created tolerance adjustment for ${b.id} vs ${g.id}`,
    accDate:fmtDate(g.date), source:'AutoMatch', category:'Tolerance', comment:'',
    status:'Draft', journalStatus:'Not Exported', linkedBank:b.id, linkedGL:g.id,
    createdBy:'System (AutoMatch)', created:'12-Aug-2026'
  });
}

    this.updateSummary();

  rowHtml(t, side){
    const selSet = side==='A'?this.selA:this.selB;
    const checked = selSet.has(t.id) ? 'checked' : '';
    const dupTag = t.duplicate ? '<span class="badge red" style="margin-left:6px;">DUP</span>' : '';
    return `

          <div class="rmeta">${fmtDate(t.date)} &middot; Acct ${t.account} &middot; Entity ${t.entity}</div>
        </div>
        <div class="ramt">${fmtMoney(t.amount)}</div>
      </label>
    `;
  },
  toggle(side,id){
    const set = side==='A'?this.selA:this.selB;
    if(set.has(id)) set.delete(id); else set.add(id);
    this.renderLists();
  },
  updateSummary(){
    const findT = (id)=> BankTxns.find(t=>t.id===id) || GLTxns.find(t=>t.id===id);
    const totalA = [...this.selA].reduce((s,id)=>s+findT(id).amount,0);
    const totalB = [...this.selB].reduce((s,id)=>s+findT(id).amount,0);
    const totalAEl = document.getElementById('wbTotalA');
    if(!totalAEl) return;
    totalAEl.textContent = fmtMoney(totalA);
    document.getElementById('wbTotalB').textContent = fmtMoney(totalB);
    document.getElementById('wbCountA').textContent = this.selA.size;
    document.getElementById('wbCountB').textContent = this.selB.size;
    const diff = totalA-totalB;
    const diffEl = document.getElementById('wbDiff');
    diffEl.textContent = fmtMoney(diff);
    diffEl.style.color = Math.abs(diff)<0.005 ? 'var(--green-600)' : (Math.abs(diff)<=5?'var(--amber-500)':'var(--red-600)');
  },
  clear(){ this.selA.clear(); this.selB.clear(); document.getElementById('wbSuggestArea').innerHTML=''; this.renderLists(); },
  suggest(){
    if(this.selA.size!==1){ toast('Select exactly one Source A transaction to see suggestions','error'); return; }
    const bid = [...this.selA][0];
    const b = BankTxns.find(t=>t.id===bid);
    const glOpen = GLTxns.filter(t=>t.status!=='Matched');
    const scored = glOpen.map(g=>{
      const amtDiff = Math.abs(g.amount-b.amount);
      const dateDiff = Math.abs(daysBetween(b.date,g.date));
      const refMatch = g.ref===b.ref;
      let confidence = 0;
      if(refMatch) confidence += 60;
      confidence += Math.max(0, 25 - amtDiff);
      confidence += Math.max(0, 15 - dateDiff*3);
      return {g, amtDiff, dateDiff, confidence: Math.min(99,Math.round(confidence))};
    }).sort((x,y)=>y.confidence-x.confidence);
    const best = scored[0];
    if(!best || best.confidence<30){
      document.getElementById('wbSuggestArea').innerHTML = `<div class="empty-state">No strong candidate found for ${b.id}. Try Manual Match or create an Adjustment.</div>`;
      return;
    }
    document.getElementById('wbSuggestArea').innerHTML = `
      <div class="suggest-box">
        <div class="stitle">Suggested Match &middot; Confidence ${best.confidence}%</div>
        <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:12.5px;">
          <div><b>Bank:</b> ${b.id} &middot; ${fmtMoney(b.amount)} &middot; ${b.ref}</div>
          <div><b>Candidate GL:</b> ${best.g.id} &middot; ${fmtMoney(best.g.amount)} &middot; ${best.g.ref}</div>
          <div><b>Date Difference:</b> ${best.dateDiff} day(s)</div>
          <div><b>Amount Difference:</b> ${fmtMoney(best.amtDiff)}</div>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="btn teal sm" onclick="WorkbenchUI.confirmSuggested('${b.id}','${best.g.id}')">Confirm Match</button>
          <button class="btn ghost sm" onclick="WorkbenchUI.matchWithAdjustment()">Match with Adjustment</button>
          <button class="btn ghost sm" onclick="document.getElementById('wbSuggestArea').innerHTML=''">Reject</button>
        </div>
      </div>
    `;
  },
  confirmSuggested(bid,gid){
    const b = BankTxns.find(t=>t.id===bid), g = GLTxns.find(t=>t.id===gid);
    confirmMatch(b,g,'manual','MANUAL_SUGGESTED');
    addAudit(null,'Match Created (Suggested)', `${b.id} ↔ ${g.id}`, 'Unmatched','Matched');
    toast('Match confirmed','success');
    this.selA.clear(); this.selB.clear();
    document.getElementById('wbSuggestArea').innerHTML='';
    this.renderLists();
    Renderers.dashboard();
    TrainingUI.markTaskComplete('manual_match');
  },
  match(type){
    if(this.selA.size===0 || this.selB.size===0){ toast('Select at least one item from each source','error'); return; }
    if(!type && (this.selA.size>1 || this.selB.size>1)){
      toast('Use One-to-Many / Many-to-One / Many-to-Many for multi-item matches','error'); return;
    }
    const findT = (id)=> BankTxns.find(t=>t.id===id) || GLTxns.find(t=>t.id===id);
    const totalA = [...this.selA].reduce((s,id)=>s+findT(id).amount,0);
    const totalB = [...this.selB].reduce((s,id)=>s+findT(id).amount,0);
    const diff = Math.abs(totalA-totalB);
    if(diff>0.005){
      toast(`Totals differ by ${fmtMoney(diff)} — use Match with Adjustment instead`,'error');
      return;
    }
    const grp = uid('MG');
    [...this.selA,...this.selB].forEach(id=>{
      const t = findT(id);
      t.status='Matched'; t.matchGroup=grp; t.matchMethod='manual'; t.matchRule='MANUAL_'+(type||'1:1').toUpperCase();
    });
    addAudit(null,'Match Created ('+(type||'1:1')+')', grp, 'Unmatched','Matched');
    toast(`Match created (${this.selA.size} : ${this.selB.size})`,'success');
    this.clear();
    Renderers.dashboard();
    TrainingUI.markTaskComplete('manual_match');
  },
  matchWithAdjustment(){
    if(this.selA.size===0 || this.selB.size===0){ toast('Select at least one item from each source','error'); return; }
    const findT = (id)=> BankTxns.find(t=>t.id===id) || GLTxns.find(t=>t.id===id);
    const totalA = [...this.selA].reduce((s,id)=>s+findT(id).amount,0);
    const totalB = [...this.selB].reduce((s,id)=>s+findT(id).amount,0);
    const diff = totalA-totalB;
    AdjustmentUI.openCreate({
      amount: Math.abs(diff).toFixed(2),
      linkedBank: [...this.selA][0]||'', linkedGL:[...this.selB][0]||'',
      onSaveCallback: ()=>{
        const grp = uid('MG');
        [...this.selA,...this.selB].forEach(id=>{
          const t = findT(id);
          t.status='Matched'; t.matchGroup=grp; t.matchMethod='manual'; t.matchRule='MANUAL_ADJ';
        });
        this.clear();
        Renderers.dashboard();
        TrainingUI.markTaskComplete('adj_create');
      }
    });
  }
};

            <div class="ctitle">TASK ${i+1}: ${t.title}</div>
            <div class="cdesc">${t.desc}</div>
          </div>
          <div>${done?'<span class="badge green">Completed</span>':`<button class="btn sm" onclick="Nav.go('${t.go}')">Go</button>`}</div>
        </div>
      `;
    }).join('');
    this.active = true;
  }
};
Renderers.training = function(){ TrainingUI.render(); };


/* ===================================================================
   APP INIT
   =================================================================== */
(function init(){
  const viewIds = ['dashboard','training','matchtypes','datasources','processes','rules','import','automatch','manual','unmatched','adjustments','journal','balance','audit','jobs','config','help'];
  const content = document.getElementById('content');
  content.innerHTML = viewIds.map(id=>`<section class="view" id="view-${id}"></section>`).join('');

  Nav.buildSidebar();

  // seed some initial audit/job history so the app doesn't look empty
  addAudit(null,'Application Initialized','BISP ARCS Simulator','-','Ready');

  Nav.go('dashboard');
})();

</script>
