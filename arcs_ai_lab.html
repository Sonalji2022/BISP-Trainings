<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle ARCS — AI-Enabled Capabilities Lab | BISP Trainings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#080B14;
  --bg-grid:#0B1020;
  --panel:#111832;
  --panel-alt:#161F42;
  --panel-soft:#0E1530;
  --border:#26315A;
  --border-soft:#1B2547;
  --text:#E7ECFB;
  --text-dim:#93A0C7;
  --text-faint:#5C6A96;
  --cyan:#43D9F2;
  --cyan-dim:#1D5A66;
  --violet:#9C8BFF;
  --violet-dim:#3A3272;
  --amber:#FFC15E;
  --amber-dim:#5A4520;
  --green:#4FE3A6;
  --green-dim:#164E3B;
  --red:#FF6480;
  --red-dim:#5A1F2E;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
body{
  background-image:
    radial-gradient(circle at 15% 0%, rgba(67,217,242,0.07), transparent 40%),
    radial-gradient(circle at 85% 15%, rgba(156,139,255,0.07), transparent 45%),
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: auto, auto, 42px 42px, 42px 42px;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:.2px;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#26315A;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== SHELL ===== */
#shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
#sidebar{
  background:linear-gradient(180deg,#0A0E1F,#080B14 70%);
  border-right:1px solid var(--border-soft);
  padding:22px 14px 18px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brandbox{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
.brandbox img{height:34px;border-radius:6px;background:#fff;padding:3px;}
.brandbox .bname{font-size:12.5px;font-weight:700;color:var(--text);font-family:'Space Grotesk',sans-serif;}
.brandbox .burl{font-size:10px;color:var(--text-faint);}
.navgroup-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-faint);margin:16px 8px 6px;font-weight:600;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--text-dim);
  font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:.15s;
}
.navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
.navitem:hover{background:var(--panel-soft);color:var(--text);}
.navitem.active{background:linear-gradient(90deg,rgba(67,217,242,0.12),rgba(156,139,255,0.06));border-color:var(--border);color:#fff;}
.navitem.active .dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}

#main{padding:26px 34px 60px;max-width:1240px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.topbar h1{font-size:22px;}
.topbar .sub{color:var(--text-dim);font-size:13px;margin-top:4px;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:99px;letter-spacing:.4px;text-transform:uppercase;}
.pill-sim{background:var(--violet-dim);color:#D9CFFF;border:1px solid #4B3F9A;}
.pill-warn{background:var(--amber-dim);color:#FFDCA0;border:1px solid #7A5B24;}
.pill-block{background:var(--red-dim);color:#FFB4C2;border:1px solid #7A2A3D;}

/* ===== CARDS / PANELS ===== */
.card{background:linear-gradient(180deg,var(--panel),var(--panel-soft));border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.kpi{padding:16px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--border-soft);position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent,var(--cyan));}
.kpi .val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
.kpi .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;margin-top:4px;}
.kpi .trend{font-size:11px;margin-top:8px;color:var(--green);}

.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-faint);margin:26px 0 10px;font-weight:700;}
.section-title:first-child{margin-top:0;}

/* ===== TABS ===== */
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--border-soft);padding-bottom:0;}
.tabbtn{background:transparent;border:none;color:var(--text-dim);font-size:12.5px;font-weight:600;padding:9px 14px;border-bottom:2px solid transparent;}
.tabbtn:hover{color:var(--text);}
.tabbtn.active{color:var(--cyan);border-bottom-color:var(--cyan);}

/* ===== BUTTONS ===== */
.btn{border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--panel-alt);color:var(--text);transition:.15s;}
.btn:hover{border-color:var(--cyan);color:#fff;}
.btn-primary{background:linear-gradient(90deg,#2EA9C4,#3A6FD8);border:none;color:#04121C;color:#06131C;font-weight:700;}
.btn-primary{background:linear-gradient(90deg,var(--cyan),#6C8CFF);color:#04121C;}
.btn-accept{background:var(--green-dim);border-color:#2A7A5C;color:#B8FFE3;}
.btn-reject,.btn-dismiss{background:var(--red-dim);border-color:#7A2A3D;color:#FFC7D2;}
.btn-ghost{background:transparent;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

/* ===== CONFIDENCE RAIL (signature element) ===== */
.rail-wrap{margin:10px 0;}
.rail-top{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-faint);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;}
.rail{position:relative;height:8px;border-radius:6px;background:#0A1230;border:1px solid var(--border-soft);overflow:visible;}
.rail-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--amber),var(--cyan),var(--violet));}
.rail-marker{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--cyan);box-shadow:0 0 10px rgba(67,217,242,.7);transform:translateX(-50%);}
.rail-ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-faint);margin-top:5px;}

/* ===== RISK / STATUS BADGES ===== */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:7px;text-transform:uppercase;letter-spacing:.4px;}
.badge-low{background:var(--green-dim);color:#B8FFE3;}
.badge-med{background:var(--amber-dim);color:#FFDCA0;}
.badge-high{background:var(--red-dim);color:#FFC7D2;}
.badge-info{background:var(--violet-dim);color:#DCD3FF;}

/* ===== TABLES ===== */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border-soft);}
td{padding:10px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);}
tr:hover td{background:rgba(67,217,242,0.03);color:var(--text);}

/* ===== FLOWCHART ===== */
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0;}
.flow.vertical{flex-direction:column;align-items:flex-start;}
.flow-step{background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:12px;font-weight:600;white-space:nowrap;}
.flow-arrow{color:var(--text-faint);font-size:16px;}
.flow.vertical .flow-arrow{transform:rotate(90deg);margin-left:20px;}

/* ===== FORM ===== */
label.f{display:block;font-size:11px;color:var(--text-faint);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;background:#0A1230;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;
}
textarea{resize:vertical;min-height:70px;}
.field{margin-bottom:14px;}

/* ===== AI RESPONSE PANEL ===== */
.ai-panel{border:1px solid var(--cyan-dim);background:linear-gradient(180deg,rgba(67,217,242,0.06),transparent);border-radius:12px;padding:16px;margin-top:14px;}
.ai-panel .ai-head{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:10px;}
.ai-panel .ai-head::before{content:'◆';}

.note{font-size:11.5px;color:var(--text-faint);margin-top:10px;line-height:1.5;}
.warn-strip{background:var(--amber-dim);border:1px solid #7A5B24;color:#FFDCA0;font-size:12px;padding:9px 13px;border-radius:9px;margin:12px 0;font-weight:600;}
.block-strip{background:var(--red-dim);border:1px solid #7A2A3D;color:#FFC7D2;font-size:13px;padding:12px 14px;border-radius:9px;margin:12px 0;font-weight:700;}

/* ===== CHARTS ===== */
.chart-box{background:var(--panel-soft);border:1px solid var(--border-soft);border-radius:12px;padding:14px;}
.chart-title{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-bottom:8px;}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;}
.bar{flex:1;border-radius:4px 4px 0 0;position:relative;min-width:6px;}
.bar-label{font-size:9px;color:var(--text-faint);text-align:center;margin-top:4px;}
.legend{display:flex;gap:14px;font-size:10.5px;color:var(--text-dim);margin-top:8px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

/* ===== HEATMAP ===== */
.heat-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;}
.heat-cell{aspect-ratio:1;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:#04121C;font-weight:700;transition:.15s;border:1px solid rgba(255,255,255,.06);}
.heat-cell:hover{outline:2px solid #fff;transform:scale(1.06);}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:400px;max-width:100%;background:linear-gradient(180deg,var(--panel),var(--panel-soft));border:1px solid var(--border);border-radius:18px;padding:34px 30px;box-shadow:0 30px 80px rgba(0,0,0,.5);}
.login-logo{text-align:center;margin-bottom:6px;}
.login-logo img{height:44px;background:#fff;padding:5px;border-radius:8px;}
.login-title{text-align:center;margin:14px 0 2px;font-size:20px;}
.login-sub{text-align:center;color:var(--cyan);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px;font-weight:700;}
.login-tag{text-align:center;color:var(--text-faint);font-size:11px;letter-spacing:1.5px;margin-bottom:26px;}
.env-row{display:flex;gap:8px;}
.env-btn{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--border);background:var(--panel-alt);color:var(--text-dim);font-size:11.5px;font-weight:600;text-align:center;}
.env-btn.active{border-color:var(--cyan);color:#fff;background:rgba(67,217,242,.12);}
.enter-btn{width:100%;margin-top:22px;padding:12px;font-size:13px;border-radius:10px;}
.login-footer{text-align:center;margin-top:22px;font-size:10.5px;color:var(--text-faint);}

/* ===== CAPABILITY CARDS ===== */
.cap-card{padding:24px;border-radius:16px;background:linear-gradient(160deg,var(--panel),var(--panel-soft));border:1px solid var(--border-soft);cursor:pointer;transition:.18s;position:relative;overflow:hidden;}
.cap-card:hover{border-color:var(--cyan);transform:translateY(-3px);}
.cap-card .cap-icon{font-size:26px;margin-bottom:12px;}
.cap-card h3{font-size:16px;margin-bottom:6px;}
.cap-card p{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin:0 0 12px;}
.cap-card .cap-go{font-size:11px;color:var(--cyan);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}

/* ===== DO/DONT FLIP CARDS ===== */
.flip-card{perspective:1000px;height:150px;cursor:pointer;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;border-radius:12px;padding:16px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;}
.flip-front{background:var(--panel);border:1px solid var(--border-soft);}
.flip-back{background:var(--panel-alt);border:1px solid var(--cyan-dim);transform:rotateY(180deg);}
.flip-face .tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px;}
.flip-face p{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5;}

/* ===== EXAM ===== */
.opt-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--border-soft);border-radius:9px;margin-bottom:8px;cursor:pointer;font-size:13px;}
.opt-row:hover{border-color:var(--cyan-dim);}
.opt-row.selected{border-color:var(--cyan);background:rgba(67,217,242,.07);}
.opt-row.correct{border-color:var(--green);background:rgba(79,227,166,.08);}
.opt-row.incorrect{border-color:var(--red);background:rgba(255,100,128,.08);}
.progress-bar{height:5px;background:#0A1230;border-radius:4px;overflow:hidden;margin-bottom:18px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));}

.scenario-step{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border-soft);border-radius:10px;margin-bottom:8px;}
.scenario-step.done{border-color:var(--green-dim);background:rgba(79,227,166,.05);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.scenario-step.done .step-num{background:var(--green);color:#04121C;}

.footer-block{margin-top:50px;padding:30px 0 10px;border-top:1px solid var(--border-soft);text-align:center;color:var(--text-faint);font-size:11px;}
.footer-block img{height:26px;background:#fff;padding:3px;border-radius:6px;vertical-align:middle;margin-bottom:10px;}

@media(max-width:820px){
  #shell{grid-template-columns:1fr;}
  #sidebar{position:relative;height:auto;}
}
</style>
</head>

<div id="login-screen"></div>
<div id="shell" style="display:none;">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>

/* ============================================================
   SMALL COMPONENTS
============================================================ */
function railColor(pct){ return pct<40?'var(--amber)':pct<75?'var(--cyan)':'var(--violet)'; }
function railWord(pct){ return pct<40?'LOW':pct<75?'MEDIUM':'HIGH'; }

function confidenceRail(pct,label){
  label = label || "AI Confidence";
  return `<div class="rail-wrap">
    <div class="rail-top"><span>${label}</span><span style="color:${railColor(pct)};font-weight:700;">${railWord(pct)} · ${pct}%</span></div>
    <div class="rail"><div class="rail-fill" style="width:${pct}%;"></div><div class="rail-marker" style="left:${pct}%;"></div></div>
    <div class="rail-ticks"><span>LOW</span><span>MEDIUM</span><span>HIGH</span></div>
  </div>`;
}

function riskBadge(level){
  const cls = level==='HIGH'?'badge-high':level==='MEDIUM'?'badge-med':'badge-low';
  return `<span class="badge ${cls}">${level} risk</span>`;
}

function pillSim(){ return `<span class="pill pill-sim">Illustrative Training Simulation</span>`; }

function flow(steps, vertical){
  return `<div class="flow ${vertical?'vertical':''}">` + steps.map((s,i)=>
    `<div class="flow-step">${s}</div>` + (i<steps.length-1?`<span class="flow-arrow">→</span>`:'')
  ).join('') + `</div>`;
}

function barChart(title, data, color){
  const max = Math.max(...data.map(d=>d.v));
  return `<div class="chart-box"><div class="chart-title">${title}</div>
    <div class="bars">${data.map(d=>`<div style="display:flex;flex-direction:column;align-items:center;flex:1;">
      <div class="bar" style="height:${Math.max(6,(d.v/max)*90)}px;background:${color||'var(--cyan)'};width:100%;"></div>
      <div class="bar-label">${d.k}</div></div>`).join('')}</div>
  </div>`;
}

function lineChart(title, series){
  // series: [{name,color,points:[y..]}] all same length, drawn on 0-100 svg viewbox
  const w=280,h=110,n=series[0].points.length;
  const max = Math.max(...series.flatMap(s=>s.points))*1.15;
  const toPts = pts => pts.map((v,i)=>`${(i/(n-1))*w},${h-(v/max)*h}`).join(' ');
  return `<div class="chart-box"><div class="chart-title">${title}</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:110px;">
      ${series.map(s=>`<polyline points="${toPts(s.points)}" fill="none" stroke="${s.color}" stroke-width="2.4"/>`).join('')}
      ${series.map(s=>s.points.map((v,i)=>`<circle cx="${(i/(n-1))*w}" cy="${h-(v/max)*h}" r="2.6" fill="${s.color}"/>`).join('')).join('')}
    </svg>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>
  </div>`;
}

function kpi(val,lbl,accent,trend){
  return `<div class="kpi" style="--accent:${accent||'var(--cyan)'}"><div class="val">${val}</div><div class="lbl">${lbl}</div>${trend?`<div class="trend">${trend}</div>`:''}</div>`;
}

  {q:'Why is a controlled deployment used for new match rules?',opts:['To skip testing','To limit risk while validating rule performance','To avoid documentation','To bypass governance'],a:1,e:'Controlled deployment limits exposure while the rule proves itself.'},
  {q:'What is the AI-Enabled ARCS Specialist badge awarded for?',opts:['Logging in once','Completing the capability center, scenarios, and assessment activities','Viewing the login screen only','Nothing specific'],a:1,e:"The badge reflects engagement across the lab's capabilities, scenarios, and exam."},
];
function pageExam(){
  const st = STATE.quiz;
  if(!st.started){
    return pageHeader("Exam Mode","20 original certification-style questions") + `
    <div class="card" style="text-align:center;padding:40px;">
      <h3 style="margin-bottom:10px;">Ready to test your knowledge?</h3>
      <p class="note" style="margin-bottom:18px;">20 questions · tracked score, correct/incorrect, and time.</p>
      <button class="btn btn-primary" onclick="startExam()">START EXAM</button>
    </div>`;
  }
  if(st.finished){
    const correct = st.answers.filter(a=>a.correct).length;
    const elapsed = Math.round((Date.now()-st.startTime)/1000);
    return pageHeader("Exam Results","") + `
    <div class="card" style="text-align:center;padding:30px;">
      <div style="font-size:40px;font-weight:700;font-family:'Space Grotesk';color:var(--cyan);">${correct}/20</div>
      <div class="note" style="margin:10px 0;">Correct: ${correct} · Incorrect: ${20-correct} · Time: ${elapsed}s</div>
      <button class="btn btn-primary" onclick="startExam()">RETAKE EXAM</button>
      <button class="btn" onclick="go('scorecard')">VIEW FINAL SCORECARD</button>
    </div>`;
  }
  const q = QUESTIONS[st.idx];
  return pageHeader("Exam Mode",`Question ${st.idx+1} of 20`) + `
  <div class="progress-bar"><div class="progress-fill" style="width:${(st.idx/20)*100}%"></div></div>
  <div class="card"><h3 style="font-size:15px;margin-bottom:16px;">${q.q}</h3>
  ${q.opts.map((o,i)=>`<div class="opt-row" onclick="answerExam(${i})">${o}</div>`).join('')}
  </div>`;
}
function startExam(){ STATE.quiz = {idx:0,score:0,answers:[],started:true,finished:false,startTime:Date.now()}; renderMain(); }
function answerExam(i){
  const st = STATE.quiz; const q = QUESTIONS[st.idx];
  const correct = i===q.a;
  st.answers.push({correct});
  if(correct) st.score++;
  // show feedback briefly inline
  const rows = document.querySelectorAll('.opt-row');
  rows.forEach((r,idx)=>{ r.onclick=null; if(idx===q.a) r.classList.add('correct'); else if(idx===i) r.classList.add('incorrect'); });
  setTimeout(()=>{
    if(st.idx<19){ st.idx++; } else { st.finished=true; }
    renderMain();
  }, 700);
}

/* ============================================================
   14) FINAL SCORECARD (screen 37)
============================================================ */
function pageScorecard(){
  const examDone = STATE.quiz.finished;
  const examPct = examDone ? Math.round((STATE.quiz.score/20)*100) : null;
  const cats = [
    ['Reconciliation Copilot',88],['Matching Intelligence',84],['Close Intelligence',80],
    ['Explainability',90],['Confidence',86],['Human Control',93],['Audit',91],
    ['Scenarios', Math.round(([28,29,30].reduce((s,id)=>s+STATE.scenario[id].size,0)/(8+4+5))*100) || 0],
    ['Troubleshooting',82], ['Exam', examPct===null?0:examPct],
  ];
  const overall = Math.round(cats.reduce((s,c)=>s+c[1],0)/cats.length);
  return pageHeader("Final Scorecard","Illustrative competency summary") + `
  <div class="card" style="text-align:center;padding:30px;margin-bottom:18px;">
    <div style="font-size:44px;">🏆</div>
    <h2 style="margin:8px 0 4px;">AI-ENABLED ARCS SPECIALIST</h2>
    <div class="note">Overall score: <strong style="color:var(--cyan)">${overall}%</strong></div>
  </div>
  <div class="card">${cats.map(c=>`<div style="margin-bottom:14px;">
    <div class="rail-top" style="margin-bottom:5px;"><span style="color:var(--text)">${c[0]}</span><span>${c[1]}%</span></div>
    <div class="rail"><div class="rail-fill" style="width:${c[1]}%"></div></div></div>`).join('')}
    ${!examDone?'<div class="note" style="color:var(--amber);">Exam score is 0% until you complete Exam Mode.</div>':''}
  </div>
  <div class="footer-block">
    <img src="${LOGO}"/><br/>
    <strong style="color:var(--text);font-family:'Space Grotesk';font-size:14px;">ORACLE ARCS</strong><br/>
    AI-ENABLED CAPABILITIES LAB<br/>
    <span style="letter-spacing:1.5px;">ASSIST · ANALYZE · PREDICT · EXPLAIN · RECOMMEND</span><br/><br/>
    BISP Trainings · www.bisptrainings.com · Call Us: +91 769-409-5404<br/>
    © BISP Trainings | www.bisptrainings.com
  </div>`;
}

   INIT
============================================================ */
renderLogin();
</script>
