<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISP Trainings | Dashboards &amp; Analytics Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0A1930;
  --navy-2:#122A4E;
  --navy-3:#1B3A66;
  --paper:#EFF3F8;
  --card:#FFFFFF;
  --line:#DCE3ED;
  --ink:#101B2D;
  --muted:#5A6B85;
  --blue:#2158C4;
  --blue-2:#1A46A0;
  --orange:#E8622C;
  --teal:#0D9E8C;
  --amber:#E5A421;
  --red:#D6394A;
  --shadow: 0 1px 2px rgba(10,25,48,.06), 0 8px 24px -12px rgba(10,25,48,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora',Arial,sans-serif;margin:0;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c3cede;border-radius:8px;}

/* ---------- Ledger rail signature element ---------- */
.rail{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:14px 0;}
.rail-node{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--navy-2);white-space:nowrap;}
.rail-node.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.rail-node.done{background:#E9F7F3;border-color:#BFE7DD;color:var(--teal);}
.rail-arrow{width:26px;height:2px;background:var(--line);position:relative;margin:0 2px;}
.rail-arrow::after{content:'';position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--line);}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:linear-gradient(90deg,var(--navy),var(--navy-3));color:#fff;display:flex;align-items:center;
  padding:10px 22px;gap:16px;box-shadow:var(--shadow);position:sticky;top:0;z-index:40;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:34px;background:#fff;border-radius:6px;padding:3px 6px;}
.brand-text{line-height:1.15;}
.brand-text b{font-family:'Sora';font-size:15px;display:block;}
.brand-text span{font-size:10.5px;color:#B9C7E0;letter-spacing:.04em;text-transform:uppercase;}
.topbar .title{margin-left:6px;padding-left:16px;border-left:1px solid rgba(255,255,255,.2);}
.topbar .title h1{font-size:15px;color:#fff;}
.topbar .title small{color:#AFC0DE;font-size:11px;}
.topbar .spacer{flex:1;}
.userpill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:999px;font-size:12.5px;}
.userpill .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);}
.body-wrap{display:flex;flex:1;min-height:0;}
.sidebar{width:224px;background:var(--navy-2);color:#EAF0FB;padding:16px 10px;flex-shrink:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;
  color:#C9D6EC;cursor:pointer;margin-bottom:2px;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--blue);color:#fff;font-weight:600;}
.nav-icon{width:18px;text-align:center;font-size:14px;}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7C8EB2;margin:14px 10px 6px;}
.main{flex:1;padding:22px 26px 50px;min-width:0;}
.crumbtop{font-size:11.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
.pagehead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap;gap:8px;}
.pagehead h2{font-size:22px;}
.pagehead .sub{color:var(--muted);font-size:13px;}
.illus-tag{display:inline-flex;align-items:center;gap:6px;background:#FFF4E9;color:#A85A1B;border:1px solid #F3D9B8;
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;margin:8px 0 18px;}
.illus-tag::before{content:'◆';font-size:8px;}

footer.appfoot{background:var(--navy);color:#B9C7E0;text-align:center;padding:16px;font-size:12px;margin-top:auto;}
footer.appfoot b{color:#fff;}

/* ---------- generic grid / cards ---------- */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;}
.card h3{font-size:13.5px;color:var(--navy-2);margin-bottom:10px;}
.card h3 .n{color:var(--muted);font-weight:500;font-size:11px;}

.kpi{cursor:pointer;position:relative;overflow:hidden;transition:transform .12s ease, box-shadow .12s ease;border-left:4px solid var(--blue);}
.kpi:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(10,25,48,.08),0 14px 28px -14px rgba(10,25,48,.28);}
.kpi.selected{outline:2px solid var(--navy);outline-offset:-2px;}
.kpi .label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.kpi .value{font-family:'IBM Plex Mono';font-weight:700;font-size:26px;margin-top:6px;color:var(--ink);}
.kpi .trend{font-size:11.5px;margin-top:5px;font-weight:600;}
.kpi .trend.up{color:var(--teal);} .kpi .trend.down{color:var(--red);} .kpi .trend.flat{color:var(--muted);}
.kpi.risk{border-left-color:var(--red);} .kpi.warn{border-left-color:var(--amber);} .kpi.good{border-left-color:var(--teal);}

.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;}
.chip.High{background:#FCE4E6;color:var(--red);} .chip.Medium{background:#FCF0D9;color:#93670C;} .chip.Low{background:#E4F5F1;color:var(--teal);}
.chip.Approved{background:#E4F5F1;color:var(--teal);} .chip.Rejected{background:#FCE4E6;color:var(--red);}
.chip.Submitted{background:#E7EEFB;color:var(--blue-2);} .chip.InProgress,.chip.In-Progress{background:#FCF0D9;color:#93670C;}
.chip.NotStarted,.chip.Not-Started{background:#EDEFF3;color:var(--muted);}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
table th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
  border-bottom:1px solid var(--line);padding:8px 10px;background:#F7F9FC;}
table td{padding:8px 10px;border-bottom:1px solid #EEF1F6;}
table tr.rowlink{cursor:pointer;}
table tr.rowlink:hover{background:#F4F8FF;}
.tblwrap{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;}

.btn{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;}
.btn:hover{background:var(--blue-2);}
.btn.ghost{background:#fff;color:var(--navy-2);border:1px solid var(--line);}
.btn.ghost:hover{background:#F3F6FB;}
.btn.small{padding:6px 11px;font-size:12px;}
.btn.orange{background:var(--orange);} .btn.orange:hover{background:#C94E1E;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}

.filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px;}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld label{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.04em;}
.fld select,.fld input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.8px;min-width:130px;background:#fff;}
.fld input[type=text]{min-width:170px;}

.modal-bg{position:fixed;inset:0;background:rgba(9,17,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 30px 60px rgba(0,0,0,.35);}
.modal h3{font-size:16px;margin-bottom:4px;}
.modal .close{float:right;background:none;border:none;color:var(--muted);font-size:18px;}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.kv div{background:#F7F9FC;border-radius:8px;padding:9px 11px;}
.kv .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;}
.kv .v{font-family:'IBM Plex Mono';font-weight:600;margin-top:2px;}

canvas{max-height:260px;}
.chartbox{position:relative;height:250px;}

.flow{display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:14px 0 4px;}
.flow-step{background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:700;
  color:var(--navy-2);min-width:110px;text-align:center;}
.flow-step.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.flow-arrow{width:22px;text-align:center;color:var(--muted);font-weight:700;}

.scn-card{border-left:4px solid var(--blue);}
.scn-card.complete{border-left-color:var(--teal);}
.badge-done{background:#E4F5F1;color:var(--teal);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
.stepline{border-left:2px solid var(--line);padding:2px 0 2px 18px;position:relative;margin-left:6px;}
.stepline .step{margin-bottom:12px;position:relative;}
.stepline .step::before{content:'';position:absolute;left:-23px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--line);}
.stepline .step.done::before{background:var(--teal);}
.stepline .step.cur::before{background:var(--blue);box-shadow:0 0 0 4px #E7EEFB;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(1200px 600px at 15% -10%, #1B3A66 0%, transparent 60%), var(--navy);padding:20px;}
.login-card{background:#fff;border-radius:16px;width:100%;max-width:440px;padding:34px 32px;box-shadow:0 30px 70px rgba(0,0,0,.4);}
.login-card .brand{justify-content:center;margin-bottom:6px;}
.login-card img{height:46px;}
.login-title{text-align:center;margin:14px 0 2px;font-size:19px;}
.login-sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px;letter-spacing:.04em;text-transform:uppercase;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 20px;}
.role-btn{padding:10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:12.5px;font-weight:600;color:var(--navy-2);text-align:center;}
.role-btn.sel{border-color:var(--blue);background:#EEF3FE;color:var(--blue-2);}
.login-card label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.login-card input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;margin:6px 0 16px;font-size:14px;}
.login-card .btn{width:100%;padding:12px;font-size:14px;}

.progressbar{height:8px;background:#E7ECF4;border-radius:99px;overflow:hidden;margin:8px 0 4px;}
.progressbar > div{height:100%;background:var(--teal);}

.final-wrap{text-align:center;padding:40px 20px;}
.final-wrap h1{font-size:30px;color:var(--navy);}
.trophy{font-size:52px;}

.notice{background:#EEF3FE;border:1px solid #C9DAF7;color:var(--blue-2);padding:10px 14px;border-radius:9px;font-size:12.8px;margin-bottom:14px;}

.mcq label{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;font-size:13px;cursor:pointer;}
.mcq label:hover{background:#F5F8FC;}
.mcq input{margin-right:8px;}
.mcq label.correct{background:#E4F5F1;border-color:var(--teal);}
.mcq label.incorrect{background:#FCE4E6;border-color:var(--red);}

.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.pill-btn{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--navy-2);}
.pill-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}

.widget-card{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);padding:14px;}
.widget-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.widget-head h4{font-size:13px;}
.widget-cfg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.widget-cfg select,.widget-cfg input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;}
.x-btn{background:none;border:none;color:var(--muted);font-size:14px;}
.x-btn:hover{color:var(--red);}

.palette{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px;}
.pal-btn{background:#fff;border:1.5px dashed var(--blue);color:var(--blue-2);padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:700;}
.pal-btn:hover{background:#EEF3FE;}

small.hint{color:var(--muted);font-size:11.5px;display:block;margin-top:4px;}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:10px;}
</style>
</head>

<div id="app"></div>

/* ---------------- deterministic PRNG ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(42);
function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
function rint(min,max){return Math.floor(rnd()*(max-min+1))+min;}
function fmtC(n){return '$'+Math.round(n).toLocaleString('en-US');}
function fmtC2(n){const a=Math.abs(n);const s=a>=1e6?(a/1e6).toFixed(1)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':a.toFixed(0);return (n<0?'-$':'$')+s;}
function uid(p){return p+'-'+Math.random().toString(36).slice(2,7).toUpperCase();}

const ACCOUNT_TYPES=['Cash','Bank','Intercompany','Accrual','Fixed Assets','Prepaid Expense'];
const PREPARERS=['A. Mehta','R. Singh','J. Alvarez','P. Chen','S. Okafor','M. Kapoor','T. Nguyen'];

const STATUSES=['Not Started','In Progress','Submitted','Approved','Rejected'];
const RISKS=['High','Medium','Low'];
const REJECT_REASONS=['Unsupported Balance','Missing Attachment','Incorrect GL Mapping','Late Submission','Variance Threshold Exceeded'];
const PERIODS=['Mar-2026','Apr-2026','May-2026','Jun-2026','Jul-2026','Aug-2026'];
const CUR_PERIOD='Aug-2026';
const MATCH_RULES=['Exact Match','Tolerance Match','Date Match','Many-to-One','Other'];
const SOURCES=['Source A — ERP Feed','Source B — Bank Feed','Source C — Card Processor'];

/* ---------------- mock data generation ---------------- */
function genRecords(n){
  const out=[];
  for(let i=0;i<n;i++){
    const period=i<n*0.72?CUR_PERIOD:pick(PERIODS.slice(0,-1));
    const status=pick(STATUSES.concat(['Approved','Approved','Approved'])); // weight toward approved
    const risk=rnd()<0.16?'High':rnd()<0.5?'Medium':'Low';
    const approved=status==='Approved';
    const daysOpen=approved?rint(0,4):rint(1,110);
    const late = !approved && daysOpen>15 && rnd()<0.6;
    const onTime = approved && rnd()<0.86;
    const autoRecon = approved && rnd()<0.42;
    const balance = Math.round((rnd()*480000+500)*(rnd()<0.2?-1:1));
    const difference = (status==='Rejected'||risk==='High')? Math.round(rnd()*38000+250)*(rnd()<0.3?-1:1) : (rnd()<0.7?0:Math.round(rnd()*4000));
    out.push({
      id:uid('REC'),
      account:'GL-'+rint(10000,89999),
      orgUnit:pick(ORG_UNITS),
      accountType:pick(ACCOUNT_TYPES),
      period, status, risk,
      preparer:pick(PREPARERS), reviewer:pick(REVIEWERS),
      balance, difference, daysOpen,
      late, onTime, autoRecon,
      rejectionReason: status==='Rejected'?pick(REJECT_REASONS):null,
      owner: pick(PREPARERS)
    });
  }
  return out;
}
const RECORDS = genRecords(140);

function genTxns(n){
  const out=[];
  for(let i=0;i<n;i++){
    const r=rnd();
    const matchType = r<0.63?'Auto':r<0.86?'Manual':'Unmatched';
    const rule = matchType!=='Unmatched'? pick(MATCH_RULES) : null;
    const ageDays = matchType==='Unmatched'? rint(0,140): rint(0,5);
    out.push({
      id:uid('TXN'),
      source:pick(SOURCES),
      matchType, rule,
      amount: Math.round((rnd()*22000+40)*(rnd()<0.25?-1:1)),
      ageDays,
      valid: rnd()<0.9,
      duplicate: rnd()<0.05,
      missingFields: rnd()<0.07,
      suggested: matchType==='Unmatched' && rnd()<0.35
    });
  }
  return out;
}

/* ---------------- computed KPIs ---------------- */
function computeExecKPIs(recs){
  const total=recs.length;
  const completed=recs.filter(r=>r.status==='Approved').length;
  const onTime=recs.filter(r=>r.onTime).length;
  const late=recs.filter(r=>r.late).length;
  const open=recs.filter(r=>['Not Started','In Progress','Submitted'].includes(r.status)).length;
  const rejected=recs.filter(r=>r.status==='Rejected').length;
  const auto=recs.filter(r=>r.autoRecon).length;
  const highRisk=recs.filter(r=>r.risk==='High' && r.status!=='Approved').length;
  const unexplained=recs.filter(r=>r.status!=='Approved').reduce((s,r)=>s+Math.abs(r.difference),0);
  const aging=recs.filter(r=>r.status!=='Approved' && r.daysOpen>60).reduce((s,r)=>s+Math.abs(r.balance),0);
  const matchRate= total? Math.round((completed+auto*0.0)/total*100):0;
  const unmatchedValue = recs.filter(r=>r.difference!==0).reduce((s,r)=>s+Math.abs(r.difference),0);
  return {total,completed,onTime,late,open,rejected,auto,highRisk,unexplained,aging,matchRate,unmatchedValue};
}
function computeTxnKPIs(txns){
  const total=txns.length;
  const auto=txns.filter(t=>t.matchType==='Auto').length;
  const manual=txns.filter(t=>t.matchType==='Manual').length;
  const unmatched=txns.filter(t=>t.matchType==='Unmatched');
  const unmatchedAmt=unmatched.reduce((s,t)=>s+Math.abs(t.amount),0);
  const suggested=txns.filter(t=>t.suggested).length;
  const adjustments=Math.round(unmatched.length*0.18);
  const old90=unmatched.filter(t=>t.ageDays>90).length;
  return {
    total, autoRate: total?Math.round(auto/total*100):0, manualRate: total?Math.round(manual/total*100):0,
    unmatchedCount: unmatched.length, unmatchedAmt, suggested, adjustments, old90,
    jobDuration: 14, // minutes, illustrative
  };
}

    if(state.match.bucket){

    }
    return true;
  });

const WIDGET_TYPES=[
  {t:'kpi',label:'KPI Tile'},{t:'bar',label:'Bar Chart'},{t:'line',label:'Line Chart'},
  {t:'donut',label:'Pie / Donut'},{t:'pivot',label:'Pivot View'},{t:'list',label:'List View'},
  {t:'table',label:'Table'},{t:'filter',label:'Filter'},{t:'drill',label:'Drill-through Panel'},{t:'prompt',label:'Saved Prompt'}

function addWidget(type){
  const id='w'+Math.random().toString(36).slice(2,8);
  const base={id,type};
  if(type==='kpi') Object.assign(base,{metric:'matchRate',title:'Match Rate',threshold:90});
  if(type==='bar') Object.assign(base,{dimension:'orgUnit',measure:'count'});
  if(type==='line') Object.assign(base,{measure:'unexplained'});
  if(type==='donut') Object.assign(base,{});
  if(type==='pivot') Object.assign(base,{rows:'preparer',cols:'status'});
  if(type==='list') Object.assign(base,{cols:['account','orgUnit','risk','balance']});
  if(type==='table') Object.assign(base,{});
  if(type==='drill') Object.assign(base,{enabled:true,segment:null});
  if(type==='prompt') Object.assign(base,{name:'',cond:{}});
  state.builder.components.push(base);
  logAction('builder_add_'+type);
}
function builderFilteredRecords(){
  const f=state.builder.filters;
  return RECORDS.filter(r=>{
    if(f.period && r.period!==f.period) return false;
    if(f.orgUnit && r.orgUnit!==f.orgUnit) return false;
    if(f.accountType && r.accountType!==f.accountType) return false;
    if(f.status && r.status!==f.status) return false;
    if(f.risk && r.risk!==f.risk) return false;
    if(f.preparer && r.preparer!==f.preparer) return false;
    if(f.reviewer && r.reviewer!==f.reviewer) return false;
    return true;
  });
}
function builderFlowStep(){
  const b=state.builder;
  if(b.savedDashboards.length) return 7;
  if(b.components.some(c=>c.type==='drill')) return 6;
  if(b.savedPrompts.length) return 5;
  if(Object.keys(b.filters).length) return 4;
  if(b.components.length) return 3;
  return 1;
}

function drawBuilderCharts(){
  state.builder.components.forEach(w=>{
    const data=builderFilteredRecords();
    if(w.type==='bar'){
      const dims={orgUnit:ORG_UNITS,accountType:ACCOUNT_TYPES,preparer:PREPARERS,reviewer:REVIEWERS,status:STATUSES,risk:RISKS};
      const cats=dims[w.dimension];
      const vals=cats.map(c=>{
        const rows=data.filter(r=>r[w.dimension]===c);
        if(w.measure==='count') return rows.length;
        if(w.measure==='balance') return rows.reduce((s,r)=>s+r.balance,0);
        return rows.reduce((s,r)=>s+r.difference,0);
      });
      mkChart(w.id,{type:'bar',data:{labels:cats,datasets:[{data:vals,backgroundColor:'#2158C4'}]},options:{plugins:{legend:{display:false}}}});
    }
    if(w.type==='line'){
      const series = w.measure==='unexplained'?TREND_UNEXPLAINED : w.measure==='completion'?TREND_COMPLETION : TREND_MATCHRATE;
      mkChart(w.id,{type:'line',data:{labels:PERIODS,datasets:[{data:series,borderColor:'#0D9E8C',backgroundColor:'#0D9E8C22',fill:true,tension:.3}]},options:{plugins:{legend:{display:false}}}});
    }
    if(w.type==='donut'){
      const auto=data.filter(r=>r.autoRecon).length, manual=data.filter(r=>r.status==='Approved'&&!r.autoRecon).length, exc=data.filter(r=>r.status==='Rejected'||r.risk==='High').length;
      mkChart(w.id,{type:'doughnut',data:{labels:['Auto-Reconciled','Manual','Exception'],datasets:[{data:[auto,manual,exc],backgroundColor:['#0D9E8C','#2158C4','#D6394A']}]},options:{plugins:{legend:{position:'bottom'}}}});
    }
    if(w.type==='drill'){
      const byOrg=ORG_UNITS.map(o=>data.filter(r=>r.orgUnit===o).length);
      mkChart(w.id,{type:'bar',data:{labels:ORG_UNITS,datasets:[{data:byOrg,backgroundColor:ORG_UNITS.map(o=>o===w.segment?'#0A1930':'#E5A421')}]},

    }
  });
}

function buildPracticePool(){
  const lateByOrg={}; ORG_UNITS.forEach(o=>lateByOrg[o]=RECORDS.filter(r=>r.orgUnit===o && r.late).length);
  const topLateOrg=Object.entries(lateByOrg).sort((a,b)=>b[1]-a[1])[0][0];
  const rejByReason={}; REJECT_REASONS.forEach(r=>rejByReason[r]=RECORDS.filter(x=>x.rejectionReason===r).length);
  const topReason=Object.entries(rejByReason).sort((a,b)=>b[1]-a[1])[0][0];
  const qualBySrc=SOURCES.map(s=>{const st=TXNS.filter(t=>t.source===s);return [s,st.length?st.filter(t=>t.valid).length/st.length:1];});
  const worstSrc=qualBySrc.sort((a,b)=>a[1]-b[1])[0][0];
  const prepApproved={}; PREPARERS.forEach(p=>prepApproved[p]=RECORDS.filter(r=>r.preparer===p&&r.status==='Approved').length);
  const topPreparer=Object.entries(prepApproved).sort((a,b)=>b[1]-a[1])[0][0];
  return [
    {q:'Which organizational unit has the highest number of late reconciliations?',opts:shuffle([topLateOrg,...sampleOthers(ORG_UNITS,topLateOrg,3)]),ans:topLateOrg},
    {q:'Which rejection reason occurs most frequently?',opts:shuffle([topReason,...sampleOthers(REJECT_REASONS,topReason,3)]),ans:topReason},
    {q:'Which source has the lowest data quality?',opts:shuffle([worstSrc,...sampleOthers(SOURCES,worstSrc,2)]),ans:worstSrc},
    {q:'Which preparer has completed (Approved) the most reconciliations?',opts:shuffle([topPreparer,...sampleOthers(PREPARERS,topPreparer,3)]),ans:topPreparer},
    {q:'Based on the Executive Overview, is the current Match Rate above or below 90%?',opts:['Above 90%','Below 90%'],ans: computeExecKPIs(RECORDS).matchRate>=90?'Above 90%':'Below 90%'},
    {q:'Which dashboard shows Auto-Match Rate and Unmatched Amount?',opts:shuffle(['Transaction Matching Dashboard','Compliance Dashboard','Executive Overview']),ans:'Transaction Matching Dashboard'},
  ];
}
function sampleOthers(list,exclude,n){const rest=list.filter(x=>x!==exclude);const out=[];while(out.length<n&&rest.length){const i=Math.floor(rnd()*rest.length);out.push(rest.splice(i,1)[0]);}return out;}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderPractice(){
  if(!state.practice.pool){state.practice.pool=buildPracticePool();state.practice.qIdx=0;state.practice.correct=0;state.practice.total=0;state.practice.answered=false;}
  const p=state.practice;
  if(p.qIdx>=p.pool.length){
    return `
    <div class="crumbtop">Dashboards &amp; Analytics / Practice Mode</div>
    <div class="pagehead"><h2>Practice Mode</h2><div class="sub">Session complete</div></div>
    <div class="card"><h3>Results</h3><p style="font-size:14px;margin:10px 0;">Score: <b class="mono">${p.correct}/${p.total}</b> (${Math.round(p.correct/p.total*100)}%)</p>
    <button class="btn" id="restartPractice">Restart Practice</button></div>`;
  }
  const q=p.pool[p.qIdx];
  return `
  <div class="crumbtop">Dashboards &amp; Analytics / Practice Mode</div>
  <div class="pagehead"><h2>Practice Mode</h2><div class="sub">Task ${p.qIdx+1} of ${p.pool.length} · Score ${p.correct}/${p.total}</div></div>
  <div class="card">
    <h3>${q.q}</h3>
    <div class="mcq" id="mcqWrap" style="margin-top:14px;">
      ${q.opts.map((o,i)=>`<label data-opt="${o.replace(/"/g,'&quot;')}"><input type="radio" name="pmcq" value="${o.replace(/"/g,'&quot;')}"> ${o}</label>`).join('')}
    </div>
    <button class="btn" id="submitPractice" ${p.answered?'disabled':''}>Submit Answer</button>
    <button class="btn ghost" id="nextPractice" style="display:${p.answered?'inline-block':'none'};margin-left:8px;">Next Task</button>
    <div id="pFeedback" style="margin-top:10px;"></div>
  </div>`;
}

      const p=state.practice; const q=p.pool[p.qIdx];
      if(!sel){return;}
      const val=sel.value;
      p.answered=true; p.total++;
      const correct = val===q.ans;
      if(correct) p.correct++;
      document.querySelectorAll('#mcqWrap label').forEach(l=>{
        if(l.dataset.opt===q.ans) l.classList.add('correct');
        else if(l.dataset.opt===val) l.classList.add('incorrect');
      });
      document.getElementById('pFeedback').innerHTML = correct? '<b style="color:var(--teal);">Correct!</b>' : `<b style="color:var(--red);">Not quite.</b> Correct answer: ${q.ans}`;
      submit.disabled=true;
      document.getElementById('nextPractice').style.display='inline-block';
    });
    const nextBtn=document.getElementById('nextPractice');
    if(nextBtn) nextBtn.addEventListener('click',()=>{state.practice.qIdx++; state.practice.answered=false; render();});
    const restart=document.getElementById('restartPractice');
    if(restart) restart.addEventListener('click',()=>{state.practice.pool=null; render();});
  }
  if(sub==='exam'){
    const next=document.getElementById('examNext');
    if(next) next.addEventListener('click',()=>{
      const sel=document.querySelector('input[name="examq"]:checked');
      if(sel) state.exam.answers[state.exam.qIdx]=+sel.value;
      if(state.exam.qIdx<EXAM_BANK.length-1){state.exam.qIdx++;render();}
      else {state.exam.submitted=true;render();}
    });
    const back=document.getElementById('examBack');
    if(back) back.addEventListener('click',()=>{
      const sel=document.querySelector('input[name="examq"]:checked'); if(sel) state.exam.answers[state.exam.qIdx]=+sel.value;
      state.exam.qIdx--; render();
    });
    const retake=document.getElementById('retakeExam');
    if(retake) retake.addEventListener('click',()=>{state.exam={qIdx:0,answers:{},submitted:false,startTime:Date.now()};render();});
    const gf=document.getElementById('gotoFinal');
    if(gf) gf.addEventListener('click',()=>{state.sub='final';render();});
  }
}

render();
</script>
</body>
</html>
