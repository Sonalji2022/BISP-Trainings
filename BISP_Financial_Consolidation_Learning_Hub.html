const QUESTIONS=[{"id":1,"category":"Consolidation Basics","level":"Foundation","prompt":"What is the main purpose of consolidated financial statements?","options":["Show only the parent’s results","Present a group as one economic entity","Replace each subsidiary’s records","Report only intercompany transactions"],"answer":1,"explanation":"Consolidation combines the parent and controlled entities as though the whole group were one business.","example":"Parent assets of $800 plus subsidiary assets of $300 give $1,100 before consolidation adjustments."},{"id":2,"category":"Consolidation Basics","level":"Foundation","prompt":"Which balance is normally eliminated on consolidation?","options":["Cash held with an external bank","Revenue from an external customer","A receivable from another group company","Share capital held by outside investors"],"answer":2,"explanation":"Amounts owed within the group cancel because the group cannot owe money to itself.","example":"A $25 group receivable and matching $25 group payable are both removed."},{"id":3,"category":"Consolidation Basics","level":"Foundation","prompt":"What does non-controlling interest (NCI) represent?","options":["Parent shareholders’ interest","External ownership in a subsidiary","Intercompany debt","Goodwill impairment"],"answer":1,"explanation":"NCI is the part of a subsidiary’s net assets and profit belonging to shareholders outside the parent group.","example":"If outsiders own 20% of a subsidiary with $500 net assets, NCI’s share is $100."},{"id":4,"category":"IFRS 10","level":"Foundation","prompt":"Under IFRS 10, which three elements establish control?","options":["Ownership, dividends and audit rights","Power, variable returns and ability to use power to affect returns","A board seat, a loan and a guarantee","25% voting rights, profit and cash"],"answer":1,"explanation":"Control needs power over relevant activities, exposure to variable returns and a link between power and returns.","example":"A 48% investor may control when the other 52% is scattered among 1,000 passive investors."},{"id":5,"category":"IFRS 10","level":"Foundation","prompt":"When does consolidation generally begin?","options":["At incorporation of the parent","When control is obtained","At the next year-end","When the first dividend arrives"],"answer":1,"explanation":"A subsidiary enters the consolidated statements from the date the parent obtains control.","example":"Control on 1 October means 3 months of results are consolidated to 31 December."},{"id":6,"category":"IFRS 10","level":"Foundation","prompt":"What happens when a parent loses control of a subsidiary?","options":["Continue full consolidation","Remove the subsidiary’s assets, liabilities and NCI","Eliminate only its revenue","Keep goodwill unchanged forever"],"answer":1,"explanation":"Loss of control ends consolidation; the former subsidiary’s balances and NCI are removed and any retained interest is remeasured.","example":"Net assets of $700 and NCI of $140 both leave the group accounts."},{"id":7,"category":"IFRS 9","level":"Foundation","prompt":"Which two tests drive classification of a financial asset under IFRS 9?","options":["Entity size and currency","Business model and contractual cash-flow characteristics","Interest rate and maturity only","Credit rating and collateral only"],"answer":1,"explanation":"Classification depends on how the asset is managed and whether cash flows are solely principal and interest (SPPI).","example":"A $100 bond held to collect principal plus 5% interest may qualify for amortised cost."},{"id":8,"category":"IFRS 9","level":"Foundation","prompt":"What does ECL stand for in IFRS 9?","options":["Estimated contract liability","Expected credit loss","Effective cash leverage","External capital limit"],"answer":1,"explanation":"Expected credit loss is a forward-looking estimate of credit losses on relevant financial assets.","example":"A $10,000 receivable with a 2% expected loss rate has a $200 ECL allowance."},{"id":9,"category":"IFRS 9","level":"Foundation","prompt":"Which ECL approach commonly applies to a basic trade receivable without a significant financing component?","options":["No allowance","Lifetime ECL simplified approach","Only incurred losses","Fair value hedge accounting"],"answer":1,"explanation":"The simplified approach recognises lifetime expected losses from the start.","example":"A $50,000 receivables pool with a 3% lifetime loss rate needs a $1,500 allowance."},{"id":10,"category":"IFRS 11","level":"Foundation","prompt":"What are the two types of joint arrangement under IFRS 11?","options":["Associate and subsidiary","Joint operation and joint venture","Branch and division","Partnership and trust"],"answer":1,"explanation":"The parties’ rights and obligations determine whether an arrangement is a joint operation or joint venture.","example":"Two parties taking 50% of output and paying 50% of liabilities may have a joint operation."},{"id":11,"category":"IFRS 11","level":"Foundation","prompt":"What is essential for joint control?","options":["One party decides alone","Relevant decisions require unanimous consent of controlling parties","Every party owns exactly 50%","The arrangement is a company"],"answer":1,"explanation":"Joint control exists when the parties sharing control must agree unanimously on relevant activities.","example":"A contract may require both a 50% holder and a 30% holder to approve key decisions."},{"id":12,"category":"IFRS 11","level":"Foundation","prompt":"How does a joint operator recognise its interest?","options":["Only one net investment line","Its assets, liabilities, revenue and expenses","Nothing until dividends arrive","Full assets with no liabilities"],"answer":1,"explanation":"A joint operator records the rights and obligations it directly has.","example":"A 40% operator records $40 of a jointly controlled $100 asset when rights are proportionate."},{"id":13,"category":"Consolidation Basics","level":"Foundation","prompt":"Why is unrealised profit on intragroup inventory eliminated?","options":["The sale is illegal","The group has not earned profit from an external party","Inventory must be zero","Tax rules prohibit profit"],"answer":1,"explanation":"The group earns profit only when the inventory is sold to an outside customer.","example":"Goods costing $80 sold inside the group for $100 contain $20 unrealised profit while unsold."},{"id":14,"category":"Consolidation Basics","level":"Professional","prompt":"Parent sells inventory costing $60 to Subsidiary for $90. Half remains unsold. What profit is eliminated?","options":["$10","$15","$30","$45"],"answer":1,"explanation":"Only the profit inside closing inventory remains unrealised.","example":"$90 − $60 = $30 total profit; 50% unsold × $30 = $15 eliminated."},{"id":15,"category":"Consolidation Basics","level":"Professional","prompt":"How is goodwill calculated in a basic acquisition?","options":["Consideration plus NCI minus identifiable net assets","Assets plus liabilities","Revenue minus expenses","Consideration minus parent share capital"],"answer":0,"explanation":"Goodwill is the excess of consideration and NCI over the fair value of identifiable net assets.","example":"$800 consideration + $180 NCI − $900 net assets = $80 goodwill."},{"id":16,"category":"Consolidation Basics","level":"Professional","prompt":"Equipment fair value exceeds book value by $100 and has 5 years remaining. What annual adjustment follows?","options":["Increase depreciation by $20","Reduce depreciation by $20","Increase revenue by $100","No adjustment"],"answer":0,"explanation":"The fair-value uplift is depreciated over the remaining useful life.","example":"$100 uplift ÷ 5 years = $20 extra annual depreciation."},{"id":17,"category":"Consolidation Basics","level":"Professional","prompt":"Parent owns 80% of Subsidiary. Subsidiary earns $200 after acquisition. What profit is attributable to NCI before adjustments?","options":["$20","$40","$160","$200"],"answer":1,"explanation":"NCI receives its outside ownership share of post-acquisition profit.","example":"20% outside ownership × $200 profit = $40."},{"id":18,"category":"Consolidation Basics","level":"Professional","prompt":"What is the effect of a $50 intragroup management fee on consolidation?","options":["Increase group revenue by $50","Eliminate income and expense by $50","Eliminate only the expense","Recognise goodwill of $50"],"answer":1,"explanation":"Internal income and matching internal expense are removed; group profit is unchanged.","example":"Removing $50 revenue and $50 expense has a net profit effect of $0."},{"id":19,"category":"IFRS 10","level":"Professional","prompt":"Can an investor control an investee with less than 50% of voting rights?","options":["Never","Yes, through de facto control or other rights","Only with government approval","Only if it owns debt"],"answer":1,"explanation":"Voting percentage matters, but dispersed holdings or contractual rights can give practical power.","example":"A 42% holder may control when no other shareholder owns more than 1%."},{"id":20,"category":"IFRS 10","level":"Professional","prompt":"Are protective rights alone enough to give control?","options":["Yes, always","No, they do not give current power over relevant activities","Yes, if contractual","Only when rates rise"],"answer":1,"explanation":"Protective rights safeguard an investor but do not normally let it direct key activities.","example":"A lender may veto asset sales above $10 million but cannot direct daily production."},{"id":21,"category":"IFRS 10","level":"Professional","prompt":"How is a change in ownership treated when control is retained?","options":["As an equity transaction","As a disposal gain in profit or loss","As new goodwill","As revenue"],"answer":0,"explanation":"Transactions with NCI that do not change control are owner transactions.","example":"Buying 10% for $70 when its carrying NCI is $60 reduces parent equity by $10."},{"id":22,"category":"IFRS 10","level":"Professional","prompt":"Which entity may qualify for the investment entity exception?","options":["Any listed parent","An entity investing mainly for capital appreciation or investment income","Every bank","Every family business"],"answer":1,"explanation":"A qualifying investment entity generally measures certain subsidiaries at fair value through profit or loss.","example":"A fund invests $5 million in startups solely for value growth and measures performance at fair value."},{"id":23,"category":"IFRS 9","level":"Professional","prompt":"A debt asset is held to collect and sell, and it passes SPPI. How is it normally measured?","options":["Amortised cost","FVOCI","FVTPL only","Historical cost without impairment"],"answer":1,"explanation":"A collect-and-sell business model with SPPI cash flows normally leads to FVOCI.","example":"A bond rises from $1,000 to $1,040; the $40 fair-value movement is generally reported in OCI."},{"id":24,"category":"IFRS 9","level":"Professional","prompt":"What ECL amount applies to a Stage 1 financial asset?","options":["No ECL","12-month ECL","Lifetime ECL","Only the overdue amount"],"answer":1,"explanation":"Stage 1 recognises losses from defaults possible within the next 12 months.","example":"$100,000 × 1% default probability × 40% loss given default = $400 ECL."},{"id":25,"category":"IFRS 9","level":"Professional","prompt":"When does an asset generally move from Stage 1 to Stage 2?","options":["At first recognition","When credit risk increases significantly","Only after legal default","Whenever rates fall"],"answer":1,"explanation":"A significant increase in credit risk triggers lifetime ECL before the asset is necessarily credit-impaired.","example":"Default probability rising from 1% to 8% may support a move to Stage 2."},{"id":26,"category":"IFRS 9","level":"Professional","prompt":"Where are equity investment fair-value changes normally recognised?","options":["FVTPL, unless an eligible non-trading investment has an irrevocable FVOCI election","Always amortised cost","Always directly in retained earnings","Never recognised"],"answer":0,"explanation":"Equities default to FVTPL, with an FVOCI election available for eligible non-trading investments.","example":"Shares rise from $200 to $230; the $30 gain goes to profit or loss unless FVOCI was elected."},{"id":27,"category":"IFRS 11","level":"Professional","prompt":"How is a joint venture normally accounted for in consolidated statements?","options":["Full consolidation","Equity method","Proportionate consolidation","Cash basis"],"answer":1,"explanation":"A joint venture gives rights to net assets and is generally equity-accounted under IAS 28.","example":"A 40% share of $100 profit increases group profit and the investment by $40."},{"id":28,"category":"IFRS 11","level":"Professional","prompt":"Does a separate legal vehicle automatically mean a joint venture?","options":["Yes","No, legal form is only one factor","Only in manufacturing","Only with equal ownership"],"answer":1,"explanation":"Contract terms and other facts may give parties direct rights to assets and obligations for liabilities.","example":"Two 50% owners must take all output and fund all liabilities, suggesting a joint operation."},{"id":29,"category":"IFRS 11","level":"Professional","prompt":"Three parties hold 50%, 30% and 20%; decisions need 75%. Is there joint control without more agreement?","options":["Yes, the 50% holder controls","No, more than one combination can reach the threshold","Yes, all three control","Yes, the 20% holder controls"],"answer":1,"explanation":"Joint control needs a specified combination to agree; here alternative coalitions are possible.","example":"50%+30%=80%, while 50%+20%=70%; the contract must clarify who must agree."},{"id":30,"category":"IFRS 11","level":"Professional","prompt":"A joint operator sells an asset to the operation. How much gain is recognised initially?","options":["The full gain","Only the portion attributable to other parties, unless loss indicators apply","No gain ever","Twice the gain"],"answer":1,"explanation":"The operator recognises only the part effectively sold to the other investors.","example":"On a $40 gain with a 30% operator interest, 70% × $40 = $28 is recognised."},{"id":31,"category":"Consolidation Basics","level":"Expert","prompt":"Parent sells equipment for $150; carrying amount was $100 and remaining life is 5 years. What is the first-year net profit adjustment?","options":["Reduce profit by $40","Reduce profit by $50","Increase profit by $10","No adjustment"],"answer":0,"explanation":"Eliminate the $50 internal gain, then reverse $10 excess depreciation.","example":"$50 gain − ($50 ÷ 5) excess depreciation = $40 net profit reduction."},{"id":32,"category":"Consolidation Basics","level":"Expert","prompt":"Goodwill is $120 before a $30 impairment. Under partial goodwill, where is the impairment allocated?","options":["Entirely to NCI","Entirely to the parent","Equally","To revenue"],"answer":1,"explanation":"Partial goodwill recognises only the parent’s goodwill, so impairment is attributed to the parent.","example":"$120 goodwill − $30 impairment = $90 closing goodwill."},{"id":33,"category":"Consolidation Basics","level":"Expert","prompt":"Consideration is $900, fair-value NCI is $220 and net assets are $1,000. What is full goodwill?","options":["$80","$100","$120","$220"],"answer":2,"explanation":"Full goodwill includes both parent and NCI portions.","example":"$900 + $220 − $1,000 = $120 goodwill."},{"id":34,"category":"Consolidation Basics","level":"Expert","prompt":"An upstream intragroup sale creates $24 unrealised profit and the seller is 75%-owned. How much reduces NCI profit?","options":["$0","$6","$18","$24"],"answer":1,"explanation":"An upstream adjustment reduces subsidiary profit, so NCI bears its 25% share.","example":"25% × $24 = $6 reduction in profit attributable to NCI."},{"id":35,"category":"Consolidation Basics","level":"Expert","prompt":"Why must group entities use uniform accounting policies?","options":["To make tax equal","To report similar transactions consistently","To eliminate all estimates","To avoid audit"],"answer":1,"explanation":"Comparable group figures require consistent policies for similar transactions.","example":"A $100 asset over 5 years gives $20 depreciation; group policy of 4 years requires $25."},{"id":36,"category":"IFRS 10","level":"Expert","prompt":"An investor holds substantive options to acquire a majority immediately. How may they affect control?","options":["Always ignored","They may give current power if practical to exercise","They create NCI only","They matter only after exercise"],"answer":1,"explanation":"Substantive potential voting rights can provide current ability to direct relevant activities.","example":"A 40% holder can buy 15% for $1m when worth $2m; the in-the-money option may be substantive."},{"id":37,"category":"IFRS 10","level":"Expert","prompt":"When an asset manager makes decisions, who may be the principal?","options":["The manager always","Investors if the manager mainly acts on their behalf","No one","The auditor"],"answer":1,"explanation":"An agent does not control the investee; scope, pay, other interests and removal rights are assessed.","example":"A manager earns 1% and can be removed by investors holding 60%, suggesting agency."},{"id":38,"category":"IFRS 10","level":"Expert","prompt":"Parent loses control: net assets $600, proceeds $500, retained interest fair value $180. Ignoring goodwill and NCI, what gain arises?","options":["$20","$80","$100","$680"],"answer":1,"explanation":"Compare proceeds plus retained interest fair value with the carrying amount removed.","example":"$500 + $180 − $600 = $80 gain."},{"id":39,"category":"IFRS 10","level":"Expert","prompt":"If relevant activities change over time, what must the investor do?","options":["Keep the original conclusion","Reassess control when facts indicate change","Consolidate every second year","Ask NCI to decide"],"answer":1,"explanation":"Control is a continuing assessment, not a one-time ownership test.","example":"A 45% interest may become controlling after a former 30% block is dispersed among 300 investors."},{"id":40,"category":"IFRS 10","level":"Expert","prompt":"A structured entity is designed so voting rights do not direct key activities. What should the control assessment focus on?","options":["Legal title only","Contractual arrangements and the purpose and design","Number of employees","Tax rate"],"answer":1,"explanation":"Where votes are not dominant, power may arise from contractual rights built into the entity’s design.","example":"An investor directs which $100m loan pool is serviced even though it holds only 10% of votes."},{"id":41,"category":"IFRS 9","level":"Expert","prompt":"A bond pays returns linked to an equity index. Does it normally pass SPPI?","options":["Yes, always","No, equity-linked exposure is inconsistent with basic lending returns","Only if held 12 months","Only if issued at par"],"answer":1,"explanation":"SPPI permits basic lending risks, not exposure to equity performance.","example":"A $1,000 bond paying 2% plus 10% of an equity-index rise has non-basic cash flows."},{"id":42,"category":"IFRS 9","level":"Expert","prompt":"A loan of $200,000 has 6% lifetime default probability and 35% loss given default. Approximate ECL?","options":["$4,200","$7,000","$12,000","$42,000"],"answer":0,"explanation":"A simple estimate multiplies exposure by probability of default and loss given default.","example":"$200,000 × 6% × 35% = $4,200."},{"id":43,"category":"IFRS 9","level":"Expert","prompt":"A financial liability designated at FVTPL has fair-value change caused by own credit risk. Where is that part usually presented?","options":["OCI, unless that creates or enlarges an accounting mismatch","Always revenue","Always cash flow","Never reported"],"answer":0,"explanation":"Own-credit movements are usually separated into OCI, subject to the mismatch exception.","example":"Of a $12 liability gain, $5 from own credit may go to OCI and the other $7 to profit or loss."},{"id":44,"category":"IFRS 9","level":"Expert","prompt":"A hedging instrument gains $18 and the cash-flow hedge’s effective portion is $15. Where do amounts go?","options":["All $18 to OCI","$15 to OCI and $3 ineffectiveness to profit or loss","All $18 to profit or loss","$3 to OCI and $15 to profit"],"answer":1,"explanation":"The effective part of a qualifying cash-flow hedge goes to OCI; ineffectiveness goes to profit or loss.","example":"$18 total gain − $15 effective = $3 ineffectiveness in profit or loss."},{"id":45,"category":"IFRS 9","level":"Expert","prompt":"When can a financial asset be reclassified under IFRS 9?","options":["Whenever management prefers","Only when the business model for managing assets changes","Every year-end","When market value falls"],"answer":1,"explanation":"Reclassification is required only for genuine, infrequent changes in the business model.","example":"A $20m loan portfolio changes from hold-to-collect to active sale after a documented business disposal."},{"id":46,"category":"IFRS 11","level":"Expert","prompt":"Two parties have rights to all assets and obligations for all liabilities of a company. Classification?","options":["Joint venture because it is incorporated","Joint operation because substance gives direct rights and obligations","Subsidiary","Financial asset only"],"answer":1,"explanation":"Substance can override the legal vehicle when parties have direct rights to assets and obligations for liabilities.","example":"Each party takes 50% of $8m output and funds 50% of $6m debt, supporting joint operation."},{"id":47,"category":"IFRS 11","level":"Expert","prompt":"An arrangement needs 70% approval. Parties hold 60%, 25% and 15%, and the contract requires the first two to agree. Who share joint control?","options":["60% holder alone","60% and 25% holders","All three","25% and 15% holders"],"answer":1,"explanation":"The specified 60% and 25% parties must agree to exceed 70%, so they share control.","example":"60% + 25% = 85%; the required pair is expressly identified by contract."},{"id":48,"category":"IFRS 11","level":"Expert","prompt":"A joint operator buys an asset from the operation. When is its share of the operation’s gain recognised?","options":["Immediately in full","Only when the asset is sold to an external party, unless loss indicators apply","Never","When cash is paid"],"answer":1,"explanation":"The operator defers the portion of gain representing its own interest until external realisation.","example":"With a 30% interest in a $50 gain, $15 is deferred until the asset is sold externally."},{"id":49,"category":"IFRS 11","level":"Expert","prompt":"A party owns 35% of a joint venture that earns $240 and pays $40 dividends. What is the net increase in its investment before other adjustments?","options":["$14","$70","$84","$98"],"answer":1,"explanation":"Under the equity method, profit increases the investment and dividends reduce it.","example":"35% × $240 = $84 profit share; 35% × $40 = $14 dividend; net increase = $70."},{"id":50,"category":"IFRS 11","level":"Expert","prompt":"A party participates in decisions but unanimous consent is not required from it. Does it have joint control?","options":["Yes, participation is enough","No, it does not share joint control, though it may have significant influence","Yes, if profitable","Only if it owns debt"],"answer":1,"explanation":"A party shares joint control only when its consent is required for decisions about relevant activities.","example":"If A and B’s 80 votes can approve a decision without C’s 20 votes, C does not share joint control."}];

ck answer & explain</button>':'')+(shown?'<div class="explanation"><div class="explanation-title"><span>✦</span><b>Plain-language explanation</b></div><p>'+q.explanation+'</p><div class="numeric"><span>123</span><p><b>Numeric example</b>'+q.example+'</p></div></div>':'')+'<div class="question-nav"><button data-action="prev" '+(state.index===0?'disabled':'')+'>← Previous</button>'+(state.index===state.quiz.length-1?'<button class="finish" data-action="finish">Finish & view results</button>':'<button data-action="next">Next question →</button>')+'</div></div></div></section>'+footer()}

function results(){const a=state.attempts[0],pct=a.percentage;return header()+'<section class="results page-shell"><div class="result-hero"><span class="result-mark">'+(pct>=70?'✓':'↗')+'</span><span class="kicker">SESSION COMPLETE</span><h1>'+(pct>=80?'Excellent work':pct>=70?'Well done':'A solid learning step')+', '+esc(state.student.name.split(' ')[0])+'.</h1><p>'+(pct>=70?'You demonstrated a strong grasp of financial consolidation principles.':'Review the topic breakdown and use Practice mode to strengthen the areas below.')+'</p></div><div class="result-grid"><div class="score-card"><div class="score-ring" style="--score:'+(pct*3.6)+'deg"><div><strong>'+pct+'%</strong><span>'+a.score+' / '+a.count+' correct</span></div></div><span class="result-badge '+(pct>=70?'pass':'review')+'">'+(pct>=70?'PASSED':'KEEP LEARNING')+'</span><p>Completion benchmark: 70%</p></div><div class="breakdown-card"><div class="card-heading"><span>02</span><div><h2>Topic performance</h2><p>Where your knowledge is strongest</p></div></div>'+Object.keys(a.categoryScores).map(function(c){const v=a.categoryScores[c],p=Math.round(v.correct/v.total*100);return '<div class="topic-row"><div><span>'+c+'</span><b>'+v.correct+'/'+v.total+'</b></div><div><i style="width:'+p+'%;background:'+COLORS[c]+'"></i></div><small>'+p+'%</small></div>'}).join('')+'</div></div><div class="result-actions"><button class="primary" data-action="print">▣ Print certificate</button><button class="secondary" data-mode="practice">Practice again</button><button class="text-button" data-action="home">Return home</button></div><div class="answer-review"><h2>Review answers</h2>'+state.quiz.map(function(q,i){const ok=state.answers[q.id]===q.answer;return '<details><summary class="'+(ok?'ok':'bad')+'">'+(i+1)+'. '+q.prompt+' — '+(ok?'Correct':'Review')+'</summary><p><b>Correct answer:</b> '+q.options[q.answer]+'</p><p>'+q.explanation+' '+q.example+'</p></details>'}).join('')+'</div><div class="certificate"><div class="certificate-inner"><img src="'+LOGO+'" alt="BISP"><span>CERTIFICATE OF COMPLETION</span><h2>Financial Consolidation Mastery</h2><p>This certifies that</p><h1>'+esc(state.student.name)+'</h1><p>completed a '+a.count+'-question '+a.mode+' assessment covering Consolidation Basics, IFRS 10, IFRS 9 and IFRS 11 with a score of</p><strong>'+pct+'%</strong><div class="certificate-footer"><span>'+new Date().toLocaleDateString('en-GB')+'<small>Date of completion</small></span><span>BISP Learning Hub<small>Training provider</small></span></div></div></div></section>'+footer()}
function admin(){const at=state.attempts,avg=at.length?Math.round(at.reduce(function(s,a){return s+a.percentage},0)/at.length):0,pass=at.length?Math.round(at.filter(function(a){return a.percentage>=70}).length/at.length*100):0,students=new Set(at.map(function(a){return a.student.email.toLowerCase()})).size,tot={};at.forEach(function(a){Object.keys(a.categoryScores).forEach(function(c){tot[c]=tot[c]||{correct:0,total:0};tot[c].correct+=a.categoryScores[c].correct;tot[c].total+=a.categoryScores[c].total})});return header()+'<section class="admin-page page-shell"><div class="admin-heading"><div><button class="back-link" data-action="home">← Return to learning hub</button><span class="kicker">ADMIN DASHBOARD</span><h1>Training insights</h1><p>Historical results saved in this browser.</p></div><button class="secondary" data-action="print">▣ Print report</button></div><div class="stat-grid">'+[["LEARNERS",students,"Unique emails"],["ATTEMPTS",at.length,"All sessions"],["AVERAGE SCORE",avg+"%","All attempts"],["PASS RATE",pass+"%","At or above 70%"]].map(function(x){return '<article><span>'+x[0]+'</span><b>'+x[1]+'</b><small>'+x[2]+'</small></article>'}).join('')+'</div><div class="admin-card"><div class="card-heading"><span>01</span><div><h2>Category mastery</h2><p>Combined historical accuracy</p></div></div>'+CATEGORIES.map(function(c){const v=tot[c]||{correct:0,total:0},p=v.total?Math.round(v.correct/v.total*100):0;return '<div class="mastery-row"><div><span>'+c+'</span><b>'+p+'%</b></div><div><i style="width:'+p+'%;background:'+COLORS[c]+'"></i></div></div>'}).join('')+'</div><div class="history-card" style="margin-top:24px"><div class="card-heading"><span>02</span><div><h2>Attempt history</h2><p>Most recent sessions first</p></div></div>'+(at.length?'<div class="table-wrap"><table><thead><tr><th>Learner</th><th>Date</th><th>Mode</th><th>Questions</th><th>Score</th><th>Time</th></tr></thead><tbody>'+at.map(function(a){return '<tr><td><b>'+esc(a.student.name)+'</b><small>'+esc(a.student.email)+'</small></td><td>'+new Date(a.date).toLocaleDateString('en-GB')+'</td><td><span class="table-mode '+a.mode+'">'+a.mode+'</span></td><td>'+a.count+'</td><td><b class="'+(a.percentage>=70?'good-score':'low-score')+'">'+a.percentage+'%</b></td><td>'+fmt(a.durationSeconds)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty-state"><h3>No attempts yet</h3><p>Completed sessions appear here.</p></div>')+'</div></section>'+footer()}
function modal(type){const existing=document.querySelector('.modal-backdrop');if(existing)existing.remove();const wrap=document.createElement('div');wrap.className='modal-backdrop';if(type==='about')wrap.innerHTML='<div class="modal about-modal"><button class="modal-close" data-close>×</button><img src="'+LOGO+'" alt="BISP"><span class="kicker">ABOUT BISP TRAININGS</span><h2>Skills that translate into confident decisions.</h2><p>Business Intelligence Solution Providers Inc. delivers focused professional learning in finance, reporting, analytics and enterprise technology.</p><div class="about-values"><div><b>Practical</b><span>Real-world examples</span></div><div><b>Progressive</b><span>Foundation to expert</span></div><div><b>Professional</b><span>Workplace-ready skills</span></div></div></div>';else wrap.innerHTML='<form class="modal admin-modal" id="admin-form"><button type="button" class="modal-close" data-close>×</button><span class="admin-lock">⚙</span><span class="kicker">ADMIN ACCESS</span><h2>Open training insights</h2><p>Enter the administrator access code.</p><label>Access code<input name="pin" type="password" required autofocus></label><button class="primary full">Open dashboard</button><small class="demo-code">Demo access code: BISP2026</small></form>';document.body.appendChild(wrap);wrap.addEventListener('click',function(e){if(e.target===wrap||e.target.hasAttribute('data-close'))wrap.remove()});const f=document.getElementById('admin-form');if(f)f.addEventListener('submit',function(e){e.preventDefault();if(f.pin.value.toUpperCase()!=='BISP2026'){alert('Incorrect access code.');return}wrap.remove();state.screen='admin';render()})}
function render(){clearInterval(state.timer);app.innerHTML=state.screen==='home'?home():state.screen==='register'?register():state.screen==='quiz'?quiz():state.screen==='results'?results():admin();window.scrollTo(0,0);if(state.screen==='quiz'){state.timer=setInterval(function(){state.seconds--;const c=document.getElementById('clock');if(c)c.textContent=fmt(state.seconds);if(state.seconds<=0)finish()},1000)}bind()}
function bind(){document.querySelectorAll('[data-action="home"]').forEach(function(b){b.onclick=function(){state.screen='home';render()}});document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){state.mode=b.dataset.mode;state.screen='register';render()}});document.querySelectorAll('[data-action="about"]').forEach(function(b){b.onclick=function(){modal('about')}});document.querySelectorAll('[data-action="admin"]').forEach(function(b){b.onclick=function(){modal('admin')}});document.querySelectorAll('[data-count]').forEach(function(b){b.onclick=function(){state.count=Number(b.dataset.count);render()}});const reg=document.getElementById('registration');if(reg)reg.onsubmit=function(e){e.preventDefault();const d=new FormData(reg);state.student={name:d.get('name'),email:d.get('email'),organization:d.get('organization'),city:d.get('city')};state.quiz=buildQuiz();state.index=0;state.answers={};state.revealed={};state.seconds=state.count*(state.mode==='test'?90:120);state.started=Date.now();state.screen='quiz';render()};document.querySelectorAll('[data-index]').forEach(function(b){b.onclick=function(){state.index=Number(b.dataset.index);render()}});document.querySelectorAll('[data-option]').forEach(function(b){b.onclick=function(){const q=state.quiz[state.index];if(state.mode==='practice'&&state.revealed[q.id])return;state.answers[q.id]=Number(b.dataset.option);render()}});const ex=document.querySelector('[data-action="explain"]');if(ex)ex.onclick=function(){state.revealed[state.quiz[state.index].id]=true;render()};const prev=document.querySelector('[data-action="prev"]');if(prev)prev.onclick=function(){state.index--;render()};const next=document.querySelector('[data-action="next"]');if(next)next.onclick=function(){state.index++;render()};const done=document.querySelector('[data-action="finish"]');if(done)done.onclick=function(){if(Object.keys(state.answers).length<state.quiz.length&&!confirm('Some questions are unanswered. Finish anyway?'))return;finish()};document.querySelectorAll('[data-action="print"]').forEach(function(b){b.onclick=function(){window.print()}})}
render();
</script></body></html>
