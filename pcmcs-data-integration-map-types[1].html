}.section-head h2{font-size:clamp(26px,4vw,39px);line-height:1.15;margin:4px 0 8px}.summary{color:var(--muted);max-width:780px}.complete.done{background:var(--green);border-color:var(--green);color:#fff}.definition{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px;margin-bottom:16px}.definition .tag,.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:var(--soft);color:var(--oracle);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.definition p{margin:7px 0 0;color:var(--muted)}.view-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.view-btn[aria-pressed="true"]{background:var(--oracle);border-color:var(--oracle);color:#fff}.view[hidden]{display:none}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px;box-shadow:var(--shadow)}.card h3{font-size:17px;margin:7px 0 10px}.map-line{display:grid;grid-template-columns:1fr 32px 1fr;align-items:center;gap:7px;margin:12px 0}.map-value{padding:10px;background:var(--sand);border-radius:8px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}.arrow{text-align:center;color:var(--oracle);font-weight:800}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.meta div{padding:9px;background:var(--sand);border-radius:7px;font-size:12px}.meta small{display:block;color:var(--muted)}.card p{color:var(--muted);font-size:13px}.table-wrap{overflow-x:auto}.map-table{width:100%;border-collapse:collapse;background:var(--panel)}.map-table th,.map-table td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}.map-table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.map-table code{overflow-wrap:anywhere}.flow-list{display:grid;gap:12px}.flow-row{d <div class="app">
<aside class="side" id="side"><img class="logo" src="BISPLogo.png" alt="BISP Trainings logo"><h1>PCMCS Data Integration</h1><div class="sub">Map Members • 30 applied examples</div><div class="progress-box"><div class="progress-row"><span>Types completed</span><strong id="progressText">0 / 6</strong></div><div class="track"><div class="bar" id="progressBar"></div></div></div><input class="search" id="search" type="search" placeholder="Search all 30 examples…" aria-label="Search examples"><nav class="type-nav" id="typeNav" aria-label="Map types"></nav><div class="side-links"><a href="#workflow">Integration workflow</a><a href="#precedence">Mapping precedence</a><a href="#playground">Mapping designer</a><a href="https://www.bisptrainings.com/" target="_blank" rel="noopener">BISP Trainings ↗</a></div></aside>
<main class="main"><header class="top"><div><button class="btn menu" id="menuBtn" aria-label="Open navigation">☰</button> <small>Oracle Fusion Cloud EPM • Profitability and Cost Management</small></div><div class="actions"><a class="btn" href="https://www.bisptrainings.com/" target="_blank" rel="noopener">BISP Trainings</a><button class="btn" id="themeBtn" aria-label="Toggle theme">◐</button></div></header><div class="content" id="content"></div></main>
</div>
<script>
const types=[
{id:'in',name:'In',icon:'∈',definition:'Maps a list of non-sequential source values to one target member in a single rule.',note:'Best when several specific members share one target but do not form a continuous range.',examples:[
['Travel account consolidation','Account','610100, 610110, 610125','Travel_Expense','GL Expense','10','Three non-sequential travel accounts feed one PCMCS expense member.'],
['Shared-service cost centers','Cost Center','CC010, CC025, CC090','Shared_Services','Department Load','20','Selected corporate support centers are grouped for service-cost allocation.'],
['North America entities','Entity','US01, US03, CA02','North_America','Entity Load','30','A chosen list of legal entities maps to one reporting region.'],
['Digital sales channels','Channel','WEB, MOBILE, MARKETPLACE','Digital_Channel','Revenue Load','40','Non-contiguous channel codes are grouped for channel profitability.'],
['Workforce drivers','Driver','FTE, HC, HEADS','Headcount_Driver','Driver Load','50','Alternative source labels are standardized into one allocation driver.']]},
{id:'explicit',name:'Explicit',icon:'=',definition:'Matches one source value exactly and replaces it with one target value.',note:'Use for controlled one-to-one mappings and exceptions that must override broader rules.',examples:[
['Airfare account','Account','610100','Airfare_Expense','GL Expense','10','One GL account maps exactly to the PCMCS airfare member.'],
['Finance cost center','Cost Center','CC010','Finance','Department Load','20','The source finance cost center maps directly to the Finance member.'],
['Corporate entity','Entity','CORP01','Corporate_HQ','Entity Load','30','The headquarters entity receives a dedicated target.'],
['US dollar currency','Currency','USD','USD','FX Load','40','The source currency code is retained exactly in the target.'],
['Premium product','Product','PRD100','Premium_Product','Revenue Load','50','A specific product receives its governed profitability member.']]},
{id:'like',name:'Like',icon:'*',definition:'Uses wildcard characters to match source strings that share a pattern.',note:'An asterisk matches any number of characters; a question mark matches one character.',examples:[
['Operating expense family','Account','61*','Operating_Expense','GL Expense','10','All source accounts beginning with 61 are grouped as operating expense.'],
['Four-character cost centers','Cost Center','CC??','Department_Cost_Center','Department Load','20','CC followed by exactly two characters matches the departmental convention.'],
['United States entities','Entity','US_*','United_States','Entity Load','30','All entity codes carrying the US_ prefix map to the US region.'],
['Product hierarchy family','Product','PROD_A*','Product_Family_A','Revenue Load','40','Products with the PROD_A prefix roll into one family.'],
['Allocation input members','Account','*_ALLOC','Allocation_Input','Driver Load','50','Any member ending in _ALLOC is classified as an allocation input.']]},
{id:'multidim',name:'Multi-Dimension',icon:'◇',definition:'Assigns a target member only when a specified combination of multiple source dimension values is true.',note:'Targets must be explicit member names; use this for conditional mapping across dimensions.',examples:[
['US travel classification','Account','Entity=US01 AND Account=610100','US_Travel','GL Expense','10','Travel is classified differently when incurred by the US entity.'],
['Premium digital revenue','Channel','Product=PREMIUM AND Channel=ONLINE','Premium_Digital','Revenue Load','20','Product and channel together determine the profitability channel target.'],
['Cloud infrastructure cost','Account','CostCenter=IT AND Account=CloudCost','Technology_Infrastructure','GL Expense','30','IT ownership plus cloud account identifies infrastructure cost.'],
['UK local currency view','Currency','Entity=UK01 AND Currency=GBP','UK_Local','FX Load','40','Entity and currency identify the local-currency reporting member.'],
['Capitalized project labor','Account','Project=CAPEX AND Account=Labor','Capitalized_Labor','Project Load','50','Labor is capitalized only for qualifying capital projects.']]},
{id:'regex',name:'Regular Expression',icon:'.*',definition:'Uses a Java-compatible regular expression to match text patterns in source records.',note:'Oracle documents this type for Quick Mode file-based loads and source records only.',examples:[
['Six-digit OPEX accounts','Account','^61[0-9]{4}$','OPEX_Account','Quick File Load','10','Matches a six-digit account beginning with 61.'],
['Standard cost-center code','Cost Center','^[A-Z]{2}-[0-9]{3}$','Standard_Cost_Center','Quick File Load','20','Matches two letters, a hyphen and three digits.'],
['Core product code','Product','^PROD-(A|B|C)-[0-9]{2}$','Core_Product','Quick File Load','30','Matches product groups A, B or C followed by a two-digit item.'],
['Intercompany suffix','Account','.*-INTERCO$','Intercompany_Account','Quick File Load','40','Matches any source value ending in -INTERCO.'],
['Ignore malformed five-digit row','$RECORD$','.*\\d{5}.*','IGNORE','Quick File Load','50','Illustrates record-level filtering when a five-digit pattern signals a rejected row.']]},
{id:'all',name:'All',icon:'☷',definition:'Displays mappings across all available mapping types; it is a combined view, not a separate transformation rule.',note:'Use All to audit coverage, overlaps, exceptions and processing order across the mapping set.',examples:[
['Exact exception before wildcard','Audit view','Explicit 610100→Airfare; Like 61*→OPEX','610100 resolves to Airfare','All mappings','—','Explicit has precedence over a broader Like rule.'],
['Selected list before wildcard','Audit view','In CC010,CC025→Shared; Like CC*→Department','CC010 resolves to Shared','All mappings','—','In mapping is evaluated before Like for the selected member.'],
['Conditional combination before wildcard','Audit view','Multi Entity=US01+61*→US_OPEX; Like 61*→OPEX','US01/610100 resolves to US_OPEX','All mappings','—','The multi-dimensional condition takes precedence over Like.'],
['Catch-all coverage review','Audit view','Explicit exceptions plus Like *→*','Unmatched values pass through','All mappings','—','All view confirms that governed exceptions exist before the fallback.'],
['Quick Mode regex inventory','Audit view','Explicit and Like plus Regex source filters','Review mode compatibility','All mappings','—','Audit regex separately because it applies to Quick Mode file-based source records.']]}
];
const completed=new Set(JSON.parse(localStorage.getItem('pcmcs-map-completed')||'[]'));let current='in',view='cards';
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){const q=$('#search').value.toLowerCase();$('#typeNav').innerHTML=types.map((t,i)=>{const count=t.examples.filter(e=>e.join(' ').toLowerCase().includes(q)).length;return `<button class="type-btn ${t.id===current?'active':''}" data-id="${t.id}"><span>${t.icon}</span><span>${t.name}${q?` (${count})`:''}</span><span class="tick">${completed.has(t.id)?'✓':''}</span></button>`}).join('');document.querySelectorAll('.type-btn').forEach(b=>b.onclick=()=>{current=b.dataset.id;$('#side').classList.remove('open');render()});updateProgress()}
function updateProgress(){$('#progressText').textContent=`${completed.size} / 6`;$('#progressBar').style.width=(completed.size/6*100)+'%'}
function overview(){return `<section class="hero"><img class="hero-logo" src="BISPLogo.png" alt="BISP Trainings"><div class="eyebrow">BISP Trainings • Oracle-inspired PCMCS learning <span class="version-badge">Version 2</span></div><h2>Data Integration Map Types in PCMCS</h2><p>Learn when and how to use each Map Members option through 30 allocation and profitability examples. Compare rules as cards, tables or source-to-target flows.</p><div class="pills"><span class="pill">6 dropdown choices</span><span class="pill">30 worked examples</span><span class="pill">Mapping designer</span><span class="pill">Precedence graph</span></div><div class="hero-brand">Practical enterprise learning by Business Intelligence Solution Providers</div></section><div class="notice"><strong>Important distinction:</strong> Oracle documents five transformation behaviors shown here. <b>All</b> is the combined dropdown view used to inspect rules across types. Regular Expression is available for Quick Mode file-based loads and applies to source records.</div>
<section class="overview-grid" id="workflow"><article class="diagram"><h3>Data Integration flowchart</h3><svg viewBox="0 0 620 210" role="img" aria-label="Source data flows through import, dimension mapping, member mapping, validation and PCMCS"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--oracle)"/></marker></defs><path d="M100 78H135M235 78H270M370 78H405M505 78H540" fill="none" stroke="var(--oracle)" stroke-width="2" marker-end="url(#arr)"/><g fill="var(--panel)" stroke="var(--line)"><rect x="5" y="45" width="95" height="66" rx="9"/><rect x="135" y="45" width="100" height="66" rx="9"/><rect x="270" y="45" width="100" height="66" rx="9"/><rect x="405" y="45" width="100" height="66" rx="9"/><rect x="540" y="45" width="75" height="66" rx="9"/></g><g class="svg-label" text-anchor="middle"><text x="52" y="72">Source GL</text><text x="52" y="91" class="svg-small">File / ERP</text><text x="185" y="72">Map</text><text x="185" y="91" class="svg-small">Dimensions</text><text x="320" y="72">Map</text><text x="320" y="91" class="svg-small">Members</text><text x="455" y="72">Validate</text><text x="455" y="91" class="svg-small">Coverage</text><text x="577" y="72">PCMCS</text><text x="577" y="91" class="svg-small">Load</text></g></svg></article><article class="diagram"><h3>Mapping SmartArt</h3><svg viewBox="0 0 620 210" role="img" aria-label="Map Members connects exact, list, wildcard, conditional and regex methods"><g stroke="var(--oracle)" stroke-width="2"><path d="M310 102L90 43M310 102L200 174M310 102L420 174M310 102L530 43"/></g><g fill="var(--panel)" stroke="var(--line)"><rect x="235" y="69" width="150" height="66" rx="12" stroke="var(--oracle)" stroke-width="3"/><rect x="25" y="18" width="130" height="50" rx="9"/><rect x="135" y="150" width="130" height="50" rx="9"/><rect x="355" y="150" width="130" height="50" rx="9"/><rect x="465" y="18" width="130" height="50" rx="9"/></g><g class="svg-label" text-anchor="middle"><text x="310" y="98">Map Members</text><text x="310" y="116" class="svg-small">governed translation</text><text x="90" y="48">Exact / List</text><text x="200" y="180">Wildcard</text><text x="420" y="180">Conditional</text><text x="530" y="48">Regex / Audit</text></g></svg></article></section>
<section class="reference-image"><h3>Reference image: Map Type dropdown</h3><img src="pcmcs-map-types-screen.png" alt="Oracle PCMCS Data Integration Map Members screen showing In, Explicit, Like, Multi dimension, Regular expression and All"><div class="caption">Provided PCMCS screen. The learning examples below follow the visible choices and Oracle’s documented behavior.</div></section>`}
function render(){const t=types.find(x=>x.id===current),q=$('#search').value.toLowerCase();const rows=t.examples.filter(e=>e.join(' ').toLowerCase().includes(q));const cards=`<div class="cards">${rows.map((e,i)=>`<article class="card"><span class="tag">Example ${i+1}</span><h3>${e[0]}</h3><div class="map-line"><div class="map-value">${esc(e[2])}</div><div class="arrow">→</div><div class="map-value">${esc(e[3])}</div></div><p>${e[6]}</p><div class="meta"><div><small>Dimension</small>${e[1]}</div><div><small>Integration</small>${e[4]}</div><div><small>Processing order</small>${e[5]}</div><div><small>Map choice</small>${t.name}</div></div></article>`).join('')}</div>`;const table=`<div class="table-wrap"><table class="map-table"><thead><tr><th>#</th><th>Scenario</th><th>Dimension</th><th>Source expression</th><th>Target / result</th><th>Why</th></tr></thead><tbody>${rows.map((e,i)=>`<tr><td>${i+1}</td><td><strong>${e[0]}</strong></td><td>${e[1]}</td><td><code>${esc(e[2])}</code></td><td><code>${esc(e[3])}</code></td><td>${e[6]}</td></tr>`).join('')}</tbody></table></div>`;const flow=`<div class="flow-list">${rows.map((e,i)=>`<div class="flow-row"><div class="flow-node"><small>Source ${i+1}</small><strong>${esc(e[2])}</strong></div><div class="flow-arrow">→</div><div class="flow-node"><small>${t.name} rule</small>${e[6]}</div><div class="flow-arrow">→</div><div class="flow-node"><small>Target / result</small><strong>${esc(e[3])}</strong></div></div>`).join('')}</div>`;$('#content').innerHTML=(current==='in'?overview():'')+`<section class="section-head"><div><div class="eyebrow" style="color:var(--oracle)">Map choice ${types.findIndex(x=>x.id===current)+1} of 6</div><h2>${t.name}</h2><p class="summary">${t.definition}</p></div><button class="btn primary complete ${completed.has(t.id)?'done':''}" id="completeBtn">${completed.has(t.id)?'✓ Completed':'Mark complete'}</button></section><div class="definition"><div><span class="tag">When to use it</span><p>${t.note}</p></div><strong>${rows.length} examples</strong></div><div class="view-tabs" role="group" aria-label="Example view"><button class="btn view-btn" data-view="cards" aria-pressed="${view==='cards'}">Cards</button><button class="btn view-btn" data-view="table" aria-pressed="${view==='table'}">Table</button><button class="btn view-btn" data-view="flow" aria-pressed="${view==='flow'}">Flowchart</button></div><div class="view" data-panel="cards" ${view==='cards'?'':'hidden'}>${cards}</div><div class="view" data-panel="table" ${view==='table'?'':'hidden'}>${table}</div><div class="view" data-panel="flow" ${view==='flow'?'':'hidden'}>${flow}</div>${playground()}${precedence()}${sources()}<footer class="footer"><span>© BISP Trainings • PCMCS Data Integration learning guide</span><span><a href="https://www.bisptrainings.com/" target="_blank" rel="noopener">www.bisptrainings.com</a></span></footer>`;$('#completeBtn').onclick=()=>{completed.has(t.id)?completed.delete(t.id):completed.add(t.id);localStorage.setItem('pcmcs-map-completed',JSON.stringify([...completed]));render();nav()};document.querySelectorAll('.view-btn').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});bindPlayground();nav();window.scrollTo({top:0,behavior:'smooth'})}
function playground(){return `<section class="playground" id="playground"><div class="eyebrow" style="color:var(--oracle)">Interactive practice</div><h2>Mapping-rule designer</h2><p class="summary">Draft a training rule and preview its documentation row. This does not connect to an Oracle environment.</p><div class="fields"><div class="field"><label for="pgType">Map choice</label><select id="pgType">${types.map(t=>`<option value="${t.id}" ${t.id===current?'selected':''}>${t.name}</option>`).join('')}</select></div><div class="field"><label for="pgDimension">Dimension</label><select id="pgDimension"><option>Account</option><option>Cost Center</option><option>Entity</option><option>Product</option><option>Channel</option><option>Driver</option></select></div><div class="field"><label for="pgOrder">Processing order</label><input id="pgOrder" type="number" value="10"></div><div class="field"><label for="pgSource">Source expression</label><input id="pgSource" value="610100"></div><div class="field"><label for="pgTarget">Target member / result</label><input id="pgTarget" value="Airfare_Expense"></div><div class="field"><label for="pgDescription">Description</label><input id="pgDescription" value="Training mapping rule"></div></div><div class="preview" id="pgPreview"></div></section>`}
function bindPlayground(){const ids=['pgType','pgDimension','pgOrder','pgSource','pgTarget','pgDescription'];const draw=()=>{const t=types.find(x=>x.id===$('#pgType').value);$('#pgPreview').innerHTML=`<span class="tag">Preview</span><div class="map-line"><div class="map-value">${esc($('#pgSource').value||'(source required)')}</div><div class="arrow">→</div><div class="map-value">${esc($('#pgTarget').value||'(target required)')}</div></div><strong>${t.name} • ${$('#pgDimension').value} • Order ${esc($('#pgOrder').value)}</strong><p class="summary">${esc($('#pgDescription').value)} ${t.id==='all'?'All is an audit view; create the underlying rule under its actual mapping type.':''}</p>`};ids.forEach(id=>$('#'+id).oninput=draw);draw()}
function precedence(){return `<section class="precedence" id="precedence"><div class="eyebrow" style="color:var(--oracle)">Rule-resolution graph</div><h2>Documented standard mapping precedence</h2><p class="summary">When more than one standard mapping applies, Oracle documents this order. Regular Expression belongs to the Quick Mode file-based context and is shown separately from this standard precedence chain.</p><div class="precedence-bars">${[['Explicit',100,'1'],['Between',82,'2'],['In',64,'3'],['Multi-Dimension',46,'4'],['Like',28,'5']].map(x=>`<div class="precedence-row"><strong>${x[0]}</strong><div class="precedence-track"><div class="precedence-fill" style="width:${x[1]}%"></div></div><span>${x[2]}</span></div>`).join('')}</div></section>`}
function sources(){return `<section class="source-links"><h3>Oracle documentation used</h3><ul><li><a href="https://docs.oracle.com/en/cloud/saas/enterprise-performance-management-common/diepm/integrations_member_create_106x967e0d1c.html" target="_blank" rel="noopener">Adding Member Mappings</a></li><li><a href="https://docs.oracle.com/en/cloud/saas/enterprise-performance-management-common/erpia/creating_mappings_using_the_in_method.html" target="_blank" rel="noopener">Creating Mappings Using the In Method</a></li><li><a href="https://docs.oracle.com/en/cloud/saas/epm-cloud/diepm/integrations_members_multi_dimensional_102x29c6fda3.html" target="_blank" rel="noopener">Using Multi-Dimensional Mappings</a></li><li><a href="https://docs.oracle.com/en/cloud/saas/enterprise-performance-management-common/diepm/integrations_quick_mode_file_con.html" target="_blank" rel="noopener">Quick Mode File-Based Load Considerations</a></li></ul></section>`}
$('#search').oninput=()=>{render();nav()};$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');$('#themeBtn').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';localStorage.setItem('pcmcs-theme',d.dataset.theme)};document.documentElement.dataset.theme=localStorage.getItem('pcmcs-theme')||'light';nav();render();
</script>
</body>
