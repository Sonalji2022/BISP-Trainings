<script>
const modules=[
{title:'Introduction to FP&A',topic:'Role of FP&A in an organization',summary:'Understand how FP&A connects strategy, operations and financial outcomes—and where its remit differs from accounting and controllership.',concepts:[['FP&A vs accounting','Accounting records what happened; FP&A interprets what happened, anticipates what may happen, and recommends actions.'],['Organization & stakeholders','FP&A often partners with sales, operations, HR, executives and the board while coordinating closely with finance control teams.']],examples:[['Monthly performance partnership','A SaaS company misses its revenue target by 6%. Accounting closes the books and validates revenue recognition. FP&A separates the miss into fewer new customers, delayed go-lives and weaker expansion, then proposes recovery actions.','Outcome: leaders receive a forward-looking decision narrative, not only a historical result.'],['New market decision','The CEO considers entering a new region. FP&A models demand, hiring, launch spend, cash needs and downside risk; controllership advises on compliance and accounting treatment.','Outcome: clear ownership keeps the investment decision fast and controlled.']],tip:'The signature FP&A question is: “What happened, why, what happens next, and what should we do?”'},
{title:'Overview of Planning & Budgeting',topic:'Core concepts',summary:'Distinguish the strategic plan, annual budget and current forecast, then choose the right balance of top-down direction and bottom-up knowledge.',concepts:[['Plan, budget, forecast','The strategic plan expresses long-term choices; the budget allocates near-term resources; the forecast updates the expected landing based on current evidence.'],['Top-down vs bottom-up','Top-down planning creates alignment and speed. Bottom-up planning adds operational detail and ownership. Strong processes reconcile both.']],examples:[['Three views of one year','A retailer targets 15% growth in its three-year plan. Its approved annual budget funds 12%. After a weak first quarter, the latest forecast shows 8%.','The three figures are not competing “truths”; each serves a different management purpose.'],['Target reconciliation','Leadership asks for 10% OPEX reduction, while department submissions total only 3%. FP&A identifies discretionary spend, vacancy timing and shared-service opportunities to bridge the 7-point gap.','The final plan combines strategic constraint with operational feasibility.']],tip:'Never overwrite the budget with the forecast; preserving both enables accountability and learning.'},
{title:'Budgeting Fundamentals',topic:'Types of budgets',summary:'Select a budget design that matches the decision: fixed accountability, volume-adjusted control, ground-up challenge or efficient annual refresh.',concepts:[['Static & flexible','A static budget stays fixed at the original activity level. A flexible budget recalculates allowed cost for actual activity, isolating efficiency from volume.'],['Zero-based & incremental','Zero-based budgeting requires fresh justification. Incremental budgeting adjusts the current baseline and is faster but may preserve outdated spend.']],examples:[['Flexible service budget','A support team budgets 10,000 tickets at $4 variable cost plus $30,000 fixed cost: $70,000. Actual volume is 12,000, so the flexible budget is $78,000. Actual spend of $80,000 creates a $2,000 unfavorable efficiency variance—not $10,000.','Flexible comparison separates higher workload from overspending.'],['Zero-based marketing review','Instead of adding 5% to last year’s $500,000 marketing budget, the team rebuilds spend by campaign: $180,000 demand generation, $120,000 events and $90,000 content.','$110,000 is released because each activity must earn its place.']],tip:'Use static budgets for commitment tracking and flexible budgets for performance diagnosis.'},
{title:'Budgeting Approaches',topic:'Methodologies',summary:'Compare traditional line-item budgeting with driver-based and activity-based approaches that explain why costs move.',concepts:[['Traditional & driver-based','Traditional budgets plan accounts or cost centers. Driver-based budgets translate operational assumptions—units, customers, FTEs—into financial outcomes.'],['Activity-based budgeting','ABB starts with forecast demand, calculates required activities, and translates activities into resource requirements and cost.']],examples:[['Driver-based cloud cost','A platform expects 2.4 million transactions at $0.018 hosting cost each plus $25,000 fixed capacity. Budgeted cloud cost is $68,200.','Operational volume becomes a transparent, testable cost assumption.'],['Activity-based claims budget','An insurer forecasts 30,000 claims. Each claim needs 1.5 review hours; one FTE supplies 1,650 productive hours. Required staffing is about 28 FTEs before shrinkage.','ABB links demand → activity → capacity → cost.']],tip:'Use the smallest set of drivers that explains most movement; excessive detail creates false precision.'},
{title:'Forecasting Concepts',topic:'Rolling forecasts',summary:'Build a repeatable forward view, decide forecast horizon and frequency, and measure quality without encouraging sandbagging.',concepts:[['Rolling horizon & cadence','A rolling forecast adds a new period as one closes, maintaining a constant 12- or 18-month view. Update frequency should match decision speed and volatility.'],['Accuracy metrics','Bias shows systematic over- or under-forecasting. Absolute percentage error measures magnitude, but needs care when actual values are near zero.']],examples:[['Rolling 12-month refresh','After March closes, the forecast covers April through next March. The team updates the next quarter in detail and later months using drivers.','The company always sees a full year ahead instead of approaching a year-end cliff.'],['Forecast accuracy','Forecast revenue is $9.5m; actual is $10m. Error is −$0.5m, bias is −5%, and absolute percentage error is 5%.','Repeated negative bias indicates conservative forecasting, even if average absolute error looks acceptable.']],tip:'Forecast accuracy is a learning tool—not a weapon. Punitive use encourages hidden buffers.'},
{title:'Revenue Planning',topic:'Building revenue budgets',summary:'Translate commercial activity into revenue using pipeline, price-volume-mix and seasonal patterns.',concepts:[['Pipeline & conversion','Probability-weighted pipeline can inform near-term bookings, but stage probabilities should be calibrated to historical win rates and timing.'],['Price-volume-mix & seasonality','PVM separates revenue change into unit volume, selling price and product/customer mix. Seasonality distributes annual demand using evidence.']],examples:[['Weighted pipeline','Qualified deals: $2m at 60%; proposal deals: $1m at 40%; early deals: $3m at 10%. Weighted pipeline is $1.9m.','The estimate is a starting point; capacity, sales cycle and deal concentration still matter.'],['Price and volume bridge','Prior year: 100,000 units × $20 = $2.0m. Plan: 110,000 × $21 = $2.31m. Volume adds $200k and price adds $110k.','The bridge clarifies whether growth depends on demand or monetization.']],tip:'Keep bookings, billings and recognized revenue distinct—timing rules can make them diverge materially.',lab:'revenue'},
{title:'Expense Planning (OPEX)',topic:'Cost planning',summary:'Plan operating costs by behavior, responsibility and workforce mechanics instead of applying one blanket growth rate.',concepts:[['Fixed, variable & step costs','Fixed costs remain stable in a relevant range; variable costs move with activity; step costs jump when capacity thresholds are crossed.'],['Cost centers & compensation','Cost-center owners plan controllable spend. Headcount models incorporate salary, start dates, merit, bonus, benefits and payroll burden.']],examples:[['Mixed logistics cost','A warehouse pays $40,000 monthly rent plus $2.50 per shipment. At 18,000 shipments, budgeted cost is $85,000.','Separating fixed and variable components makes scenario changes defensible.'],['Phased hiring expense','Three analysts at $72,000 annual salary start July 1. Base salary expense in the budget year is 3 × $72,000 × 6/12 = $108,000, before burden.','Start-date phasing prevents a full-year overstatement.']],tip:'Assign every material expense a clear owner, driver and timing assumption.'},
{title:'Capital Expenditure (CAPEX) Planning',topic:'Investment budgeting',summary:'Prioritize investments with strategic, financial and capacity criteria while reflecting depreciation and cash-flow timing.',concepts:[['Prioritization & returns','Rank projects using strategic fit, regulatory need, risk, NPV/ROI, payback and scarce implementation capacity—not one metric alone.'],['Depreciation impact','CAPEX is a cash outflow when purchased; its expense reaches the P&L over the asset’s useful life, subject to accounting policy.']],examples:[['Automation payback','A $240,000 automation project saves $10,000 per month. Simple payback is 24 months; annual simple ROI is 50% before tax and maintenance.','The model should also test ramp-up, failure risk and residual value.'],['Depreciation timing','Equipment costing $120,000 is placed in service July 1 with a five-year straight-line life and no residual value. Annual depreciation is $24,000; first-year expense is $12,000.','Cash and P&L impacts occur on different schedules.']],tip:'A strong capital plan includes approved, committed and proposed projects separately.',lab:'capex'},
{title:'Workforce/Headcount Planning',topic:'People costs',summary:'Model positions, timing, pay, attrition and burden to connect organizational design with the financial plan.',concepts:[['Positions, bands & hiring','Plan authorized positions by role, location, level, salary band, start date and recruiting lead time. Distinguish heads from full-time equivalents.'],['Attrition & burden','Expected exits influence vacancies and replacement timing. Employer taxes, benefits, bonus and other burden can materially exceed base pay.']],examples:[['Salary plus burden','A role pays $90,000 with 8% bonus and 22% benefits/payroll burden on base. Annual people cost is $90,000 + $7,200 + $19,800 = $117,000.','Budget total employment cost, not salary alone.'],['Attrition model','A 200-person team expects 12% annual attrition: roughly 24 exits. With a three-month replacement lag, average vacancy benefit is about 6 FTE-years.','Turnover can reduce near-term spend while increasing operational risk.']],tip:'Keep named employees private; planning can usually work at position or aggregated cohort level.',lab:'workforce'},
{title:'Balance Sheet & Cash Flow Planning',topic:'Beyond P&L',summary:'Extend the plan into working capital, liquidity, financing and covenant headroom so profit translates into cash resilience.',concepts:[['Working capital & cash','Receivables, inventory and payables convert operating assumptions into cash timing. DSO, DIO and DPO are common planning drivers.'],['Debt covenants','Model covenant definitions exactly, including permitted adjustments, testing dates and minimum headroom under downside scenarios.']],examples:[['Receivables requirement','Annual credit sales of $36.5m with 45 DSO imply average accounts receivable of about $4.5m ($36.5m ÷ 365 × 45).','Reducing DSO by five days releases about $0.5m of cash.'],['Covenant headroom','Debt is $12m and covenant EBITDA is $4m, so leverage is 3.0×. If the limit is 3.5×, EBITDA can fall to about $3.43m before breach, assuming debt is unchanged.','Headroom is only $0.57m of EBITDA—important in stress testing.']],tip:'A profitable plan can still fail if working capital consumes cash faster than financing is available.',lab:'working'},
{title:'Driver-Based Planning',topic:'Linking operational drivers to financials',summary:'Create transparent causal relationships from operational KPIs to financial statements and test which assumptions matter most.',concepts:[['Driver selection','Choose measurable, forecastable factors with a genuine causal relationship: traffic, conversion, units, utilization, FTEs or capacity.'],['Model architecture','Separate assumptions, calculations and outputs. Make units and time periods explicit; avoid circular logic and double counting.']],examples:[['Subscription model','10,000 opening customers + 2,000 new − 1,000 churned = 11,000 closing customers. Average customers are about 10,500; at $30 monthly ARPU, monthly revenue is about $315,000.','Customer movement explains revenue more clearly than a growth percentage.'],['Restaurant labor model','2,400 weekly covers × 0.18 labor hours per cover = 432 hours. At $19 per hour, direct weekly labor is $8,208 before payroll burden.','Demand and productivity jointly drive cost.']],tip:'A driver is valuable when managers can understand it, influence it and refresh it reliably.',lab:'driver'},
{title:'Variance Analysis',topic:'Budget vs Actual (BvA)',summary:'Quantify favorable and unfavorable results, isolate root causes and communicate the operational story with action and outlook.',concepts:[['Variance logic','For revenue, actual above budget is usually favorable. For expense, actual below budget is usually favorable. Always label sign conventions.'],['Root cause & commentary','Move beyond account labels: separate volume, rate, mix, timing, one-time items and execution effects, then state corrective action.']],examples:[['Revenue variance','Budget: 5,000 units × $50 = $250,000. Actual: 4,800 × $53 = $254,400. Lower volume costs $10,000; higher price adds $14,400; net variance is $4,400 favorable.','A favorable total masks an underlying volume shortfall.'],['Expense flux commentary','Travel is $60k vs $80k budget, $20k favorable because two events moved to next quarter. Full-year forecast is unchanged.','Good commentary distinguishes timing from permanent savings.']],tip:'Use: result → driver → action → forward impact. Avoid “due to variance in spending.”',lab:'variance'},
{title:'Management Reporting',topic:'Communicating results',summary:'Design dashboards, scorecards and executive narratives that focus attention on decisions rather than data volume.',concepts:[['Audience & hierarchy','Start with the decision and audience. Lead with outcomes, material exceptions and outlook; preserve detail for drill-down.'],['Scorecards & board decks','Use a small set of defined KPIs with target, actual, trend and owner. Board materials emphasize strategy, risk, liquidity and forward view.']],examples:[['Executive summary','“Q2 revenue was 3% below plan from delayed enterprise launches; gross margin held through pricing. Recovery actions support the annual forecast, but $1.2m remains at risk.”','The summary states performance, cause, mitigation and residual risk in three sentences.'],['KPI scorecard','A subscription scorecard shows ARR growth, net retention, gross margin and cash runway—with definitions and owners.','Four linked KPIs tell a stronger story than 40 disconnected metrics.']],tip:'If every metric is highlighted, none is prioritized.'},
{title:'Scenario Planning & What-If Analysis',topic:'Sensitivity modeling',summary:'Explore coherent base, upside and downside futures; isolate sensitivities; and stress the business beyond the expected range.',concepts:[['Scenarios vs sensitivities','A scenario changes a coherent set of assumptions. A sensitivity changes one or two variables to show exposure around a case.'],['Stress testing','Stress tests examine severe but plausible conditions and management responses, including liquidity and covenant effects.']],examples:[['Three-case revenue view','Base: 100k units at $25. Upside: 110k at $26. Downside: 85k at $24. Revenue ranges from $2.04m to $2.86m.','Cases combine demand and pricing assumptions into internally consistent outcomes.'],['Cash stress test','A 20% sales decline plus 15-day DSO increase pushes minimum cash below the company’s $1m floor. Delaying CAPEX and freezing hiring restore $0.7m.','The test converts risk into specific contingency actions.']],tip:'Document triggers for switching actions on; a scenario without a response plan is only a forecast variant.',lab:'scenario'},
{title:'Long-Range Planning (LRP)',topic:'3–5 year strategic financial plans',summary:'Connect strategic choices to multi-year financial targets, capacity, capital allocation and potential M&A effects.',concepts:[['Strategy to targets','Translate strategic initiatives into market, customer, pricing, capacity, investment, margin and cash assumptions across years.'],['M&A considerations','Model acquisition price, funding, timing, synergies, integration costs and dilution/accretion while keeping organic performance visible.']],examples:[['Capacity-led growth plan','Demand grows 12% annually, but the current plant reaches capacity in year 3. A year-2 expansion prevents lost sales and changes CAPEX, depreciation and cash timing.','LRP exposes strategic constraints before they become annual budget emergencies.'],['Acquisition case','A target adds $8m revenue and $1m EBITDA; $0.6m synergies ramp over two years, with $0.8m one-time integration cost.','A bridge separates standalone target value, synergies and execution cost.']],tip:'Precision should decrease with distance: detailed near term, driver-based long term.'},
{title:'Budget Governance & Process Management',topic:'Process discipline',summary:'Run a controlled planning cycle with clear dates, decision rights, assumptions, versions and accountability.',concepts:[['Calendar & workflow','Sequence guidance, submissions, reviews, challenge rounds, consolidation, executive approval and board approval with realistic dependencies.'],['Ownership & RACI','Define who is Responsible, Accountable, Consulted and Informed for assumptions, submissions, approvals and changes.']],examples:[['Eight-week budget cycle','Week 1 guidance; weeks 2–3 operating submissions; week 4 FP&A review; weeks 5–6 challenge and revision; week 7 executive approval; week 8 board package.','A visible critical path prevents late inputs from silently compressing review quality.'],['Revenue assumption RACI','Sales Ops prepares pipeline inputs (R), CRO owns the revenue submission (A), FP&A and Marketing are consulted (C), CEO is informed (I).','One accountable owner prevents assumption disputes at consolidation.']],tip:'Lock approved versions, but maintain a documented route for material late changes.'},
{title:'FP&A Tools & Technology Landscape',topic:'Systems overview (vendor-neutral)',summary:'Choose fit-for-purpose technology across data, modeling, workflow, reporting and controls without anchoring the course to a vendor.',concepts:[['Spreadsheets vs planning platforms','Spreadsheets offer flexibility and familiarity. Planning platforms add governed dimensions, workflow, auditability, concurrency and scale.'],['Automation & AI','Automation reduces repetitive collection and reconciliation. AI can assist classification, anomaly detection and draft narratives, subject to controls and review.']],examples:[['Tool fit decision','A five-person company with one entity may use a controlled spreadsheet model. A global group with 80 contributors and multiple currencies benefits from centralized workflow and version control.','Select tools based on process complexity and control needs, not fashion.'],['Safe narrative automation','A system drafts variance commentary from approved data. FP&A validates materiality, causality and tone before publication.','Human review remains accountable for judgment and communication.']],tip:'Fix definitions and process ownership before automating; technology scales both clarity and confusion.'},
{title:'Key FP&A Metrics & Ratios',topic:'Financial analysis toolkit',summary:'Use contribution margin, EBITDA, run-rate and unit economics consistently—and know what each measure leaves out.',concepts:[['Margin & EBITDA','Contribution margin shows revenue left after variable costs. EBITDA is a common operating performance proxy but not cash flow.'],['Run-rate & unit economics','Run-rate annualizes a current pace. Unit economics connect customer or product value to acquisition and service costs.']],examples:[['Contribution margin','Revenue is $1.0m and variable costs are $650k. Contribution margin is $350k, or 35%. Each additional $1 of revenue contributes $0.35 before fixed costs.','The ratio supports break-even and growth trade-off analysis.'],['SaaS unit economics','Customer acquisition cost is $900. Monthly gross profit per customer is $75 and monthly churn is 2%, implying simple lifetime of 50 months and LTV of $3,750. LTV/CAC is 4.2×.','Interpret cautiously: cohort behavior and discounting can change the result.']],tip:'Put a definition, source, owner and frequency behind every KPI.',lab:'metrics'},
{title:'Case Study / Capstone',topic:'Applied exercise',summary:'Bring the course together by building and explaining an integrated budget for a sample business.',concepts:[['End-to-end build','Set assumptions, build revenue and workforce drivers, plan OPEX/CAPEX, integrate statements, test scenarios and prepare management commentary.'],['Review & recommendation','Validate model integrity, compare to targets, explain gaps, quantify risks and recommend actions with accountable owners.']],examples:[['Base budget build','Northstar Services plans 12,000 jobs at $240 average price. Direct labor is 1.8 hours per job at $28/hour; variable materials are $32/job. Revenue is $2.88m and direct variable cost is $0.99m.','The operating model provides a traceable base for OPEX, staffing and cash planning.'],['Downside action plan','A 10% volume downside reduces revenue by $288k and contribution by about $197k. Delaying two hires and $50k discretionary spend offsets $120k, leaving $77k residual exposure.','The final recommendation quantifies both risk and mitigation.']],tip:'Capstone deliverable: an integrated model, one-page executive summary and five-minute decision briefing.',lab:'capstone'}
];
const practices=[
['A business unit is 6% below revenue plan. Write the three questions FP&A should answer before recommending action.','Separate the result into operational drivers, identify whether each is timing or structural, update the forward outlook, and recommend owned recovery actions.'],
['A strategic target says 15% growth, the budget funds 12%, and the forecast shows 8%. Explain each number to an executive.','The strategic plan is the ambition, the budget is the approved resource commitment, and the forecast is the latest expected landing. Keep all three visible.'],
['Actual activity is 20% above budget. Explain why a flexible budget is a fairer performance baseline.','It recalculates allowed variable cost at actual volume, so workload effects are separated from rate or efficiency effects.'],
['Choose an approach for cloud hosting cost driven by transactions and explain why.','Driver-based budgeting: transaction volume and unit hosting rate create a transparent causal model, with fixed capacity modeled separately.'],
['A team consistently forecasts revenue below actual. Diagnose the pattern and propose one process improvement.','Negative forecast bias may indicate conservative assumptions or sandbagging. Calibrate probabilities to history and review bias separately from absolute error.'],
['Build a short revenue bridge using volume, price, mix, and timing. Which driver would management act on first?','Quantify each driver, distinguish permanent from timing effects, and prioritize the largest controllable driver with a named commercial action.'],
['Classify rent, transaction fees, and supervisor labor as fixed, variable, or step cost.','Rent is fixed in the relevant range; transaction fees are variable; supervisor labor is typically a step cost when capacity thresholds are crossed.'],
['A project has a strong ROI but weak strategic fit. Write a balanced recommendation.','Show ROI, payback, execution capacity and strategic fit together; recommend defer, redesign or reject rather than allowing one return metric to dominate.'],
['Create a one-line people-cost formula for a midyear hire.','Headcount × annual salary × months employed ÷ 12 × (1 + burden rate), plus separately modeled bonus or one-time recruiting costs.'],
['Sales grow but cash declines. List three working-capital drivers to investigate.','Investigate DSO/collections, inventory days, and payable timing; also reconcile non-cash profit items and CAPEX or debt movements.'],
['Select three operational drivers for a subscription revenue model.','Opening customers, new adds, churn/retention, and ARPU are core drivers; use average customers for period revenue when appropriate.'],
['Write a variance comment using result → driver → action → outlook.','State the quantified variance, name the operational cause, identify the corrective owner/action, and clarify full-year forecast impact.'],
['Reduce a 20-metric dashboard to an executive scorecard. What stays?','Retain the few measures tied to strategy, material performance, risk and decisions; give each a definition, target, trend and owner.'],
['Design a downside scenario and name one trigger for management action.','Combine coherent downside assumptions, quantify P&L/cash effects, specify an observable trigger, and predefine actions such as hiring or CAPEX gates.'],
['A plant reaches capacity in year three. Explain how the LRP should respond.','Model expansion timing, lost-sales risk, CAPEX, depreciation, hiring and cash; bring the decision forward far enough to protect capacity.'],
['Assign RACI roles for a revenue submission.','Sales Operations can be Responsible, the CRO Accountable, FP&A and Marketing Consulted, and the CEO Informed.'],
['When should an organization move beyond spreadsheets?','When contributor count, dimensional complexity, versioning, auditability, security or workflow risk exceeds what a controlled spreadsheet process can reliably handle.'],
['Explain why EBITDA is not cash flow and calculate what else must be considered.','EBITDA excludes working-capital movements, CAPEX, interest, tax and financing; reconcile these items to understand cash generation.'],
['Prepare a two-sentence capstone recommendation for a 10% volume downside.','Quantify the revenue and contribution risk, then state specific mitigations, owners and the remaining exposure after action.']

const beginnerBasics=[
'FP&A helps a company decide where money should go next. Accounting records and verifies what already happened.',
'A plan is the destination, a budget is the approved spending map, and a forecast is today’s best estimate of where you will land.',
'A budget is simply an organized expectation of income, cost and cash. Different budget types answer different management questions.',
'A driver is a real-world activity—such as customers, units or employees—that causes a financial number to change.',
'A forecast is not a promise. It is a regularly refreshed estimate built from the best available evidence.',
'Revenue is value earned from customers. It may not equal cash received in the same month because timing rules matter.',
'OPEX means day-to-day operating expense: salaries, rent, software and other costs required to run the business.',
'CAPEX is spending on longer-lived assets. Cash is paid now, while depreciation spreads accounting expense over useful life.',
'Headcount is the number of people; FTE adjusts for working time. Total people cost is salary plus bonus, benefits and employer burden.',
'The income statement shows profit, the balance sheet shows what is owned and owed, and the cash-flow statement explains cash movement.',
'A model connects assumptions to outputs. Good FP&A models make the cause-and-effect relationship visible and testable.',
'A variance is the difference between a reference—often budget—and actual performance. The job is to explain the cause and next action.',
'Management reporting turns numbers into a short decision story for a specific audience.',
'A scenario changes a coherent set of assumptions. A sensitivity changes one factor to see how exposed the result is.',
'Long-range planning connects strategy to money over several years; distant years normally use less detail.',
'Governance defines who submits, reviews and approves the plan, by when, and under which assumptions.',
'Planning technology stores assumptions, calculations, workflow and reports. Technology cannot repair unclear definitions or ownership.',
'A metric is a defined measure used to evaluate performance. Always ask how it is calculated and what it leaves out.',
'The capstone combines revenue, costs, people, assets, cash, scenarios and communication into one traceable planning story.'
];
const glossaryTerms=[
['Asset','Something the business controls that can create future value, such as cash, inventory or equipment.'],['Liability','An obligation the business must pay or settle, such as a loan or supplier invoice.'],['Equity','The owners’ residual interest: assets minus liabilities.'],['Revenue','Income earned by providing goods or services; it is not always the same as cash collected.'],['Expense','A cost recognized in the period to operate the business or generate revenue.'],['Profit','Revenue minus expenses for a period.'],['Cash flow','Cash moving into and out of the business.'],['Accrual','Recognition when value is earned or consumed, even if cash moves at a different time.'],['P&L','Profit and loss statement, also called the income statement.'],['Balance sheet','A snapshot of assets, liabilities and equity at a point in time.'],['Working capital','Short-term operating investment, commonly receivables plus inventory minus payables.'],['Budget','An approved financial plan used for resource allocation and accountability.'],['Forecast','The latest expected financial outcome based on current information.'],['Actual','A recorded result that has already occurred.'],['Variance','The difference between two values, often actual versus budget.'],['CAPEX','Capital expenditure on assets expected to benefit more than one period.'],['OPEX','Operating expenditure for the company’s normal activities.'],['Depreciation','Allocation of an asset’s cost over its useful life.'],['EBITDA','Earnings before interest, tax, depreciation and amortization; it is not cash flow.'],['KPI','Key performance indicator—a defined measure tied to an important objective.']
];

function beginnerHub(){return `<section class="foundation" id="beginner-foundations"><div class="module-no">Start here — no finance background required</div><h2>Accounting Zero-to-One</h2><p class="module-summary">Six ideas make the rest of the course much easier. Learn the business meaning first; terminology comes second.</p><div class="foundation-grid"><article class="foundation-card"><strong>1. The accounting equation</strong><p>Everything a business owns is funded either by obligations or by owners.</p><div class="equation">Assets = Liabilities + Equity</div></article><article class="foundation-card"><strong>2. Income statement</strong><p>Shows revenue, expenses and profit over a period—like a movie of operating performance.</p></article><article class="foundation-card"><strong>3. Balance sheet</strong><p>Shows assets, liabilities and equity on one date—like a financial photograph.</p></article><article class="foundation-card"><strong>4. Cash-flow statement</strong><p>Explains cash from operations, investing and financing. Profit and cash can differ.</p></article><article class="foundation-card"><strong>5. Accrual versus cash</strong><p>Accounting records economic activity when earned or consumed; cash may move earlier or later.</p></article><article class="foundation-card"><strong>6. FP&amp;A’s role</strong><p>Use financial history plus operational drivers to anticipate outcomes and guide decisions.</p></article></div></section>
<section class="readiness"><div class="module-no">Five-minute knowledge check</div><h2>Beginner readiness quiz</h2><div class="quiz-question" data-answer="a"><p>1. Which equation must a balance sheet follow?</p><div class="quiz-options"><label><input type="radio" name="q0" value="a"> Assets = Liabilities + Equity</label><label><input type="radio" name="q0" value="b"> Cash = Revenue − Expense</label></div></div><div class="quiz-question" data-answer="b"><p>2. Can a profitable company still run short of cash?</p><div class="quiz-options"><label><input type="radio" name="q1" value="a"> No</label><label><input type="radio" name="q1" value="b"> Yes</label></div></div><div class="quiz-question" data-answer="c"><p>3. What best distinguishes a budget from a forecast?</p><div class="quiz-options"><label><input type="radio" name="q2" value="a"> They are identical</label><label><input type="radio" name="q2" value="b"> Forecasts never change</label><label><input type="radio" name="q2" value="c"> Budget is the approved plan; forecast is the latest expectation</label></div></div><div class="quiz-question" data-answer="a"><p>4. CAPEX usually relates to:</p><div class="quiz-options"><label><input type="radio" name="q3" value="a"> Longer-lived assets</label><label><input type="radio" name="q3" value="b"> Everyday office snacks</label></div></div><div class="quiz-question" data-answer="b"><p>5. A variance is:</p><div class="quiz-options"><label><input type="radio" name="q4" value="a"> A bank account</label><label><input type="radio" name="q4" value="b"> A difference between compared values</label></div></div><button class="primary" id="scoreQuiz">Check my score</button><div class="quiz-result" id="quizResult" hidden></div></section>
<section class="glossary" id="glossary"><div class="glossary-head"><div><div class="module-no">Plain-language reference</div><h2>Accounting and FP&amp;A glossary</h2></div><label>Find a term<input type="search" id="glossarySearch" placeholder="Try revenue, cash or EBITDA"></label></div><div class="glossary-grid" id="glossaryGrid">${glossaryTerms.map(t=>`<article class="term" data-term="${(t[0]+' '+t[1]).toLowerCase()}"><strong>${t[0]}</strong><p>${t[1]}</p></article>`).join('')}</div></section>
<section class="career-explorer" id="career-explorer"><div class="module-no">Career options and progression</div><h2>Explore where these skills can take you</h2><p class="module-summary">Job titles differ across organizations. Use these paths as a skill progression guide, not a guaranteed timeline.</p><div class="career-options-grid">${careerOptions.map(o=>`<div class="career-option"><strong>${o[0]}</strong><small>${o[1]}</small></div>`).join('')}</div><div class="career-controls"><label>Choose a career route<select id="careerTrack"><option value="fpa">Core FP&amp;A</option><option value="accounting">Accounting to FP&amp;A</option><option value="epm">Oracle EPM planning</option></select></label></div><div class="career-path" id="careerPath">${careerPathHtml('fpa')}</div></section>`}
function specialTopics(){return `<section class="special-topics" id="applied-planning"><div class="module-no">Applied FP&amp;A toolkit</div><h2>Forecasting, revenue, profit and problem solving</h2><p class="module-summary">Use the tabs to move from process concepts into working planning tools.</p><div class="topic-tabs" role="group" aria-label="Applied planning topics"><button class="topic-tab" data-topic="rolling" aria-pressed="true">Rolling forecast</button><button class="topic-tab" data-topic="cycle" aria-pressed="false">Forecast cycle</button><button class="topic-tab" data-topic="revenue" aria-pressed="false">Revenue planning</button><button class="topic-tab" data-topic="profit" aria-pressed="false">Profit planning</button><button class="topic-tab" data-topic="problem" aria-pressed="false">Problem statements</button><button class="topic-tab" data-topic="roles" aria-pressed="false">FP&amp;A roles</button></div>
<div class="topic-panel" data-topic-panel="rolling"><h3>Rolling forecast: always keep the same forward horizon</h3><p>When one month closes, replace its forecast with actuals and add one new month at the far end. A rolling 12-month forecast therefore always looks 12 months ahead.</p><div class="forecast-horizon">${['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'].map((m,i)=>`<div class="forecast-month forecast"><strong>${m}</strong><div>${i<3?'Detailed':'Driver-based'}</div></div>`).join('')}</div><div class="training-note"><strong>Example:</strong> March closes as actual. The refreshed forecast covers April through the following March; April–June receive detailed updates while later months use stable drivers until better information arrives.</div></div>
<div class="topic-panel" data-topic-panel="cycle" hidden><h3>A practical forecast cycle</h3><div class="cycle-flow"><div class="cycle-step"><strong>1. Close</strong><small>Load actuals and validate the baseline.</small></div><div class="cycle-step"><strong>2. Refresh</strong><small>Update drivers, assumptions and known events.</small></div><div class="cycle-step"><strong>3. Challenge</strong><small>Review inputs with business owners.</small></div><div class="cycle-step"><strong>4. Model</strong><small>Calculate P&amp;L, cash and scenarios.</small></div><div class="cycle-step"><strong>5. Align</strong><small>Resolve gaps, risks and actions.</small></div><div class="cycle-step"><strong>6. Publish</strong><small>Issue outlook, commentary and decisions.</small></div></div><p class="module-summary">Cadence should match volatility and decision speed: monthly for most businesses, weekly for critical cash or demand signals, and quarterly for slower long-range assumptions.</p></div>
<div class="topic-panel" data-topic-panel="revenue" hidden><h3>Revenue planning workspace</h3><p>Build revenue from operational drivers instead of a single growth percentage.</p><div class="controls"><div class="field"><label for="rpUnits">Units</label><input id="rpUnits" type="number" value="100000"></div><div class="field"><label for="rpPrice">Average price</label><input id="rpPrice" type="number" value="25"></div><div class="field"><label for="rpMix">Mix / realization uplift (%)</label><input id="rpMix" type="number" value="2"></div></div><div class="results" id="revenuePlanResults"></div><div class="training-note">Extend the model with customers × conversion × units per customer, then phase the result for seasonality and recognition timing.</div></div>
<div class="topic-panel" data-topic-panel="profit" hidden><h3>Profit planning workspace</h3><p>Profit planning connects revenue, variable economics and the fixed-cost base.</p><div class="controls"><div class="field"><label for="ppRevenue">Revenue</label><input id="ppRevenue" type="number" value="1000000"></div><div class="field"><label for="ppVariable">Variable cost (% of revenue)</label><input id="ppVariable" type="number" value="60"></div><div class="field"><label for="ppFixed">Fixed costs</label><input id="ppFixed" type="number" value="250000"></div></div><div class="results" id="profitPlanResults"></div></div>
<div class="topic-panel" data-topic-panel="problem" hidden><h3>FP&amp;A problem-statement builder</h3><p>A useful problem statement defines the gap, driver question, time horizon, decision and owner—without assuming the cause.</p><div class="controls"><div class="field"><label for="problemType">Business issue</label><select id="problemType"><option>Revenue below plan</option><option>Margin pressure</option><option>Cash shortfall</option><option>Hiring gap</option><option>CAPEX overrun</option></select></div><div class="field"><label for="problemHorizon">Time horizon</label><select id="problemHorizon"><option>This quarter</option><option>Full year</option><option>Next 12 months</option><option>Three-year plan</option></select></div><div class="field"><label for="problemAudience">Decision owner</label><select id="problemAudience"><option>Business unit leader</option><option>CFO</option><option>Executive committee</option><option>Board</option></select></div></div><button class="primary" id="buildProblem">Build problem statement</button><div class="problem-output" id="problemOutput">Choose the issue, horizon and owner, then build the statement.</div></div>
<div class="topic-panel" data-topic-panel="roles" hidden><h3>Different roles within FP&amp;A</h3><div class="table-responsive"><table class="roles-table"><thead><tr><th>Role</th><th>Primary focus</th><th>Typical outputs</th></tr></thead><tbody><tr><td>FP&amp;A Analyst</td><td>Modeling, monthly analysis and forecast support</td><td>Schedules, variance bridges, forecast updates</td></tr><tr><td>Senior FP&amp;A Analyst</td><td>Owns a business area and complex analysis</td><td>Scenarios, recommendations, business reviews</td></tr><tr><td>Finance Business Partner</td><td>Connects finance with operating leaders</td><td>Decision support, targets, action tracking</td></tr><tr><td>FP&amp;A Manager</td><td>Leads cycles, team and stakeholder challenge</td><td>Integrated forecast, executive narrative</td></tr><tr><td>Director / Head of FP&amp;A</td><td>Enterprise planning and performance</td><td>Board outlook, capital choices, LRP</td></tr><tr><td>Planning Systems Analyst</td><td>Models, dimensions, workflow and data quality</td><td>Planning applications, forms, automation</td></tr><tr><td>Revenue / Workforce / Cost Analyst</td><td>Deep expertise in a planning domain</td><td>Specialist driver models and insights</td></tr></tbody></table></div></div></section>
<section class="case-study" id="tata-case"><div class="module-no">Real-life public-company case</div><h2>Tata Motors FY25: growth, margin and cash through an FP&amp;A lens</h2><p>Tata Motors reported record FY25 revenue and higher profit before tax, while EBITDA margin and automotive free cash flow were lower. The figures below are reported results; the scenario tool is an educational exercise, not company guidance.</p><div class="case-facts"><div class="case-fact"><small>Revenue</small><strong>₹439,695 Cr</strong><span>FY24 restated: ₹434,016 Cr • +1.3%</span></div><div class="case-fact"><small>EBITDA margin</small><strong>13.1%</strong><span>FY24: 14.1% • −100 bps</span></div><div class="case-fact"><small>PBT before exceptional items</small><strong>₹34,330 Cr</strong><span>FY24: ₹29,368 Cr • +₹4,962 Cr</span></div><div class="case-fact"><small>Automotive free cash flow</small><strong>₹22,348 Cr</strong><span>FY24: ₹26,925 Cr • lower year over year</span></div></div><div class="training-note"><strong>FP&amp;A problem statement:</strong> Revenue increased, but operating margin and free cash flow declined. Which volume, mix, realization, cost, investment and working-capital drivers explain the divergence, and what should the next rolling forecast assume?</div><div class="planning-grid"><div><h3>Training scenario assumptions</h3><div class="controls"><div class="field"><label for="tataGrowth">Next-period revenue growth (%)</label><input id="tataGrowth" type="number" value="3" step="0.1"></div><div class="field"><label for="tataMargin">EBITDA margin (%)</label><input id="tataMargin" type="number" value="13.3" step="0.1"></div></div></div><div><h3>Illustrative model output</h3><div class="results" id="tataResults"></div></div></div><p class="case-source">Sources: <a href="https://www.tatamotors.com/annual-reports/" target="_blank" rel="noopener">Tata Motors FY25 Integrated Annual Report</a> and <a href="https://www.tatamotors.com/press-releases/tata-motors-consolidated-q4-fy25-results/" target="_blank" rel="noopener">FY25 results release</a>. Values are consolidated and shown in ₹ crore.</p></section>`}

function lab(type){const labs={
revenue:{title:'Revenue planner',desc:'Test price and volume assumptions.',fields:[['vol','Plan units',110000],['price','Average price ($)',21],['basevol','Prior units',100000],['baseprice','Prior price ($)',20]],calc:v=>[['Plan revenue',money(v.vol*v.price)],['Growth',((v.vol*v.price/(v.basevol*v.baseprice)-1)*100).toFixed(1)+'%'],['Revenue change',money(v.vol*v.price-v.basevol*v.baseprice)]]},
capex:{title:'CAPEX return screen',desc:'Estimate simple payback, ROI and annual depreciation.',fields:[['invest','Investment ($)',240000],['save','Annual benefit ($)',120000],['life','Useful life (years)',5],['resid','Residual value ($)',0]],calc:v=>[['Simple payback',(v.invest/v.save).toFixed(1)+' years'],['Simple annual ROI',(v.save/v.invest*100).toFixed(1)+'%'],['Annual depreciation',money((v.invest-v.resid)/v.life)]]},
workforce:{title:'People-cost planner',desc:'Estimate annualized cost for a hiring cohort.',fields:[['heads','New hires',3],['salary','Salary per hire ($)',72000],['months','Months employed',6],['burden','Burden rate (%)',25]],calc:v=>{let b=v.heads*v.salary*v.months/12;return [['Base salary',money(b)],['Burden',money(b*v.burden/100)],['Total people cost',money(b*(1+v.burden/100))]]}},
working:{title:'Working-capital planner',desc:'Translate sales and payment timing into cash tied up.',fields:[['sales','Annual credit sales ($)',36500000],['dso','DSO (days)',45],['newdso','Target DSO (days)',40]],calc:v=>[['Current receivables',money(v.sales/365*v.dso)],['Target receivables',money(v.sales/365*v.newdso)],['Cash released',money(v.sales/365*(v.dso-v.newdso))]]},
driver:{title:'Subscription driver model',desc:'Connect customer movement and ARPU to revenue.',fields:[['open','Opening customers',10000],['adds','New customers',2000],['churn','Churned customers',1000],['arpu','Monthly ARPU ($)',30]],calc:v=>{let close=v.open+v.adds-v.churn,avg=(v.open+close)/2;return [['Closing customers',num(close)],['Average customers',num(avg)],['Monthly revenue',money(avg*v.arpu)]]}},
variance:{title:'Price-volume variance bridge',desc:'Separate revenue variance into volume and price effects.',fields:[['bv','Budget units',5000],['bp','Budget price ($)',50],['av','Actual units',4800],['ap','Actual price ($)',53]],calc:v=>[['Volume effect',money((v.av-v.bv)*v.bp)],['Price effect',money(v.av*(v.ap-v.bp))],['Net variance',money(v.av*v.ap-v.bv*v.bp)]]},
scenario:{title:'Scenario explorer',desc:'Compare a revenue case with its contribution outcome.',fields:[['units','Units',100000],['price','Price ($)',25],['vc','Variable cost/unit ($)',14],['fixed','Fixed costs ($)',700000]],calc:v=>{let rev=v.units*v.price,cm=v.units*(v.price-v.vc),profit=cm-v.fixed;return [['Revenue',money(rev)],['Contribution',money(cm)],['Operating result',money(profit)]]}},
metrics:{title:'Unit-economics calculator',desc:'Estimate simple lifetime value and LTV/CAC.',fields:[['cac','CAC ($)',900],['gp','Monthly gross profit ($)',75],['churn','Monthly churn (%)',2]],calc:v=>{let life=1/(v.churn/100),ltv=v.gp*life;return [['Simple lifetime',life.toFixed(1)+' months'],['Simple LTV',money(ltv)],['LTV / CAC',(ltv/v.cac).toFixed(1)+'×']]}},
capstone:{title:'Capstone driver check',desc:'Build the sample company’s core contribution view.',fields:[['jobs','Jobs',12000],['price','Price/job ($)',240],['hours','Labor hours/job',1.8],['rate','Labor rate ($)',28],['material','Material/job ($)',32]],calc:v=>{let rev=v.jobs*v.price,cost=v.jobs*(v.hours*v.rate+v.material),cm=rev-cost;return [['Revenue',money(rev)],['Direct variable cost',money(cost)],['Contribution margin',(cm/rev*100).toFixed(1)+'%']]}}
};const x=labs[type];if(!x)return'';return `<section class="lab"><h2>Interactive lab: ${x.title}</h2><p>${x.desc} Change an input to recalculate.</p><div class="controls">${x.fields.map(f=>`<div class="field"><label for="${type}-${f[0]}">${f[1]}</label><input id="${type}-${f[0]}" data-key="${f[0]}" type="number" value="${f[2]}" step="any"></div>`).join('')}</div><div class="results" id="labResults"></div></section>`}
function bindLab(type){if(!type)return;const inputs=[...document.querySelectorAll('.lab input')];const redraw=()=>{const v=Object.fromEntries(inputs.map(i=>[i.dataset.key,Number(i.value)||0]));const map={};modules.forEach(m=>{if(m.lab)map[m.lab]=m});const dummy=type;const labFns={revenue:v=>[['Plan revenue',money(v.vol*v.price)],['Growth',((v.vol*v.price/(v.basevol*v.baseprice)-1)*100).toFixed(1)+'%'],['Revenue change',money(v.vol*v.price-v.basevol*v.baseprice)]],capex:v=>[['Simple payback',(v.invest/v.save).toFixed(1)+' years'],['Simple annual ROI',(v.save/v.invest*100).toFixed(1)+'%'],['Annual depreciation',money((v.invest-v.resid)/v.life)]],workforce:v=>{let b=v.heads*v.salary*v.months/12;return [['Base salary',money(b)],['Burden',money(b*v.burden/100)],['Total people cost',money(b*(1+v.burden/100))]]},working:v=>[['Current receivables',money(v.sales/365*v.dso)],['Target receivables',money(v.sales/365*v.newdso)],['Cash released',money(v.sales/365*(v.dso-v.newdso))]],driver:v=>{let c=v.open+v.adds-v.churn,a=(v.open+c)/2;return [['Closing customers',num(c)],['Average customers',num(a)],['Monthly revenue',money(a*v.arpu)]]},variance:v=>[['Volume effect',money((v.av-v.bv)*v.bp)],['Price effect',money(v.av*(v.ap-v.bp))],['Net variance',money(v.av*v.ap-v.bv*v.bp)]],scenario:v=>{let r=v.units*v.price,c=v.units*(v.price-v.vc);return [['Revenue',money(r)],['Contribution',money(c)],['Operating result',money(c-v.fixed)]]},metrics:v=>{let life=1/(v.churn/100),l=v.gp*life;return [['Simple lifetime',life.toFixed(1)+' months'],['Simple LTV',money(l)],['LTV / CAC',(l/v.cac).toFixed(1)+'×']]},capstone:v=>{let r=v.jobs*v.price,c=v.jobs*(v.hours*v.rate+v.material);return [['Revenue',money(r)],['Direct variable cost',money(c)],['Contribution margin',((r-c)/r*100).toFixed(1)+'%']]}};$('#labResults').innerHTML=labFns[type](v).map(r=>`<div class="result"><small>${r[0]}</small><strong>${r[1]}</strong></div>`).join('')};inputs.forEach(i=>i.oninput=redraw);redraw()}
function render(){
  const m=modules[current],p=practices[current];
  $('#crumb').textContent=`Module ${current+1} of ${modules.length}`;
  const cards=`<div class="example-grid">${m.examples.map((e,i)=>`<article class="card example-card"><span class="number">0${i+1}</span><span class="tag">Example ${i+1}</span><h3>${e[0]}</h3><p>${e[1]}</p><p class="takeaway">${e[2]}</p></article>`).join('')}</div>`;
  const table=`<div class="table-responsive"><table class="example-table"><thead><tr><th>Example</th><th>Situation and analysis</th><th>FP&amp;A decision takeaway</th></tr></thead><tbody>${m.examples.map((e,i)=>`<tr><td><strong>${i+1}. ${e[0]}</strong></td><td>${e[1]}</td><td>${e[2]}</td></tr>`).join('')}</tbody></table></div>`;
  const flow=`<div class="flowchart">${m.examples.map((e,i)=>`<div class="flow-lane"><div class="flow-node"><small>Situation ${i+1}</small><strong>${e[0]}</strong></div><div class="flow-arrow">→</div><div class="flow-node"><small>FP&amp;A analysis</small>${e[1]}</div><div class="flow-arrow">→</div><div class="flow-node"><small>Decision insight</small>${e[2]}</div></div>`).join('')}</div>`;
  $('#content').innerHTML=(current===0?overview():'')+`<section class="module-head"><div><div class="module-no">Module ${String(current+1).padStart(2,'0')} • ${m.topic}</div><h1 class="module-title">${m.title}</h1><p class="module-summary">${m.summary}</p></div><button class="primary complete-btn ${completed.has(current)?'done':''}" id="completeBtn">${completed.has(current)?'✓ Completed':'Mark complete'}</button></section>
  <section class="section"><h2>Core concepts</h2><div class="concept-grid">${m.concepts.map(c=>`<article class="card concept-card"><span class="tag">Concept</span><h3>${c[0]}</h3><p>${c[1]}</p></article>`).join('')}</div></section>
  <section class="section"><h2>Two worked examples</h2><div class="view-switch" role="group" aria-label="Example view"><button class="view-btn" data-view="cards" aria-pressed="true">Visual cards</button><button class="view-btn" data-view="table" aria-pressed="false">Tabular view</button><button class="view-btn" data-view="flow" aria-pressed="false">Flow-chart view</button></div><div class="example-view" data-panel="cards">${cards}</div><div class="example-view" data-panel="table" hidden>${table}</div><div class="example-view" data-panel="flow" hidden>${flow}</div></section>
  ${lab(m.lab)}
  <section class="practice"><span class="tag">Apply your knowledge</span><h2>Practice challenge</h2><p>${p[0]}</p><label class="field" for="practiceText"><span class="sr-only">Your response</span><textarea id="practiceText" placeholder="Write your analysis, assumptions and recommended action…">${localStorage.getItem('fpa-practice-'+current)||''}</textarea></label><div class="practice-actions"><button class="primary" id="answerBtn">Reveal sample answer</button><button class="secondary" id="clearPractice">Clear response</button></div><div class="sample-answer" id="sampleAnswer" hidden><strong>Sample response</strong><div>${p[1]}</div></div></section>
  <div class="tip"><b>FP&amp;A lens</b><span>${m.tip}</span></div><nav class="footer-nav"><button class="secondary" id="prevBtn" ${current===0?'disabled':''}>← <span class="label">Previous</span></button><button class="primary" id="nextBtn">${current===modules.length-1?'Back to start':'Next module'} <span class="label">→</span></button></nav>`;
  if(beginnerMode)document.querySelector('.module-head').insertAdjacentHTML('afterend',`<section class="beginner-brief"><span class="tag">Beginner explanation</span><h2>In plain language</h2><p>${beginnerBasics[current]}</p></section>`);
  const completeButton=$('#completeBtn'),actionBox=document.createElement('div');actionBox.className='module-actions';completeButton.replaceWith(actionBox);actionBox.innerHTML=`<button class="secondary bookmark-btn ${bookmarks.has(current)?'saved':''}" id="bookmarkBtn">${bookmarks.has(current)?'★ Bookmarked':'☆ Bookmark'}</button>`;actionBox.appendChild(completeButton);
  document.querySelectorAll('.view-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view-btn').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.example-view').forEach(x=>x.hidden=x.dataset.panel!==b.dataset.view)});
  $('#practiceText').oninput=e=>localStorage.setItem('fpa-practice-'+current,e.target.value);
  $('#answerBtn').onclick=()=>{const a=$('#sampleAnswer');a.hidden=!a.hidden;$('#answerBtn').textContent=a.hidden?'Reveal sample answer':'Hide sample answer'};
  $('#clearPractice').onclick=()=>{$('#practiceText').value='';localStorage.removeItem('fpa-practice-'+current)};
  $('#bookmarkBtn').onclick=()=>{bookmarks.has(current)?bookmarks.delete(current):bookmarks.add(current);localStorage.setItem('fpa-bookmarks',JSON.stringify([...bookmarks]));render();showToast(bookmarks.has(current)?'Module bookmarked':'Bookmark removed')};
  if(current===0){
    $('#continueBtn').onclick=()=>{const last=Math.max(0,Math.min(modules.length-1,Number(localStorage.getItem('fpa-last-module')||0)));go(last);setTimeout(()=>document.querySelector('.module-head')?.scrollIntoView({behavior:'smooth'}),60)};
    $('#copyPhone').onclick=async()=>{try{await navigator.clipboard.writeText('+919880547465');showToast('Amit Sharma’s number copied')}catch(e){const t=document.createElement('textarea');t.value='+919880547465';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();showToast('Amit Sharma’s number copied')}};
    $('#glossarySearch').oninput=e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.term').forEach(t=>t.classList.toggle('hidden',!t.dataset.term.includes(q)))};
    const savedTrack=localStorage.getItem('fpa-career-track')||'fpa';$('#careerTrack').value=savedTrack;$('#careerPath').innerHTML=careerPathHtml(savedTrack);$('#careerTrack').onchange=e=>{localStorage.setItem('fpa-career-track',e.target.value);$('#careerPath').innerHTML=careerPathHtml(e.target.value)};
    $('#scoreQuiz').onclick=()=>{let score=0,answered=0;document.querySelectorAll('.quiz-question').forEach(q=>{const choice=q.querySelector('input:checked');if(choice){answered++;if(choice.value===q.dataset.answer)score++}});const r=$('#quizResult');r.hidden=false;if(answered<5){r.innerHTML=`<strong>Please answer all five questions.</strong><div>You have answered ${answered} of 5.</div>`;return}localStorage.setItem('fpa-foundation-score',String(score));r.innerHTML=`<strong>${score} / 5 correct</strong><div>${score===5?'Excellent foundation—continue into Module 1.':score>=3?'Good start—review the foundation cards for the missed ideas.':'Begin with the Accounting Zero-to-One cards, then try again.'}</div>`};
    document.querySelectorAll('.topic-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.topic-tab').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.topic-panel').forEach(p=>p.hidden=p.dataset.topicPanel!==b.dataset.topic)});
    const revenueInputs=['#rpUnits','#rpPrice','#rpMix'].map(s=>$(s));const updateRevenuePlan=()=>{const units=+$('#rpUnits').value||0,price=+$('#rpPrice').value||0,mix=+$('#rpMix').value||0,base=units*price,planned=base*(1+mix/100);$('#revenuePlanResults').innerHTML=`<div class="result"><small>Base revenue</small><strong>${money(base)}</strong></div><div class="result"><small>Mix / realization effect</small><strong>${money(planned-base)}</strong></div><div class="result"><small>Planned revenue</small><strong>${money(planned)}</strong></div>`};revenueInputs.forEach(i=>i.oninput=updateRevenuePlan);updateRevenuePlan();
    const profitInputs=['#ppRevenue','#ppVariable','#ppFixed'].map(s=>$(s));const updateProfitPlan=()=>{const revenue=+$('#ppRevenue').value||0,variable=(+$('#ppVariable').value||0)/100,fixed=+$('#ppFixed').value||0,contribution=revenue*(1-variable),profit=contribution-fixed,breakEven=variable<1?fixed/(1-variable):0;$('#profitPlanResults').innerHTML=`<div class="result"><small>Contribution</small><strong>${money(contribution)}</strong></div><div class="result"><small>Operating profit</small><strong>${money(profit)}</strong></div><div class="result"><small>Break-even revenue</small><strong>${money(breakEven)}</strong></div>`};profitInputs.forEach(i=>i.oninput=updateProfitPlan);updateProfitPlan();
    $('#buildProblem').onclick=()=>{const issue=$('#problemType').value,horizon=$('#problemHorizon').value,owner=$('#problemAudience').value;$('#problemOutput').innerHTML=`<strong>${issue} — ${horizon}</strong><div>Determine the operational and financial drivers causing ${issue.toLowerCase()}, quantify the impact and uncertainty over ${horizon.toLowerCase()}, evaluate feasible actions, and recommend a decision to the ${owner.toLowerCase()} with owners and forecast implications.</div>`};
    const tataInputs=['#tataGrowth','#tataMargin'].map(s=>$(s));const updateTata=()=>{const growth=(+$('#tataGrowth').value||0)/100,margin=(+$('#tataMargin').value||0)/100,revenue=439695*(1+growth),ebitda=revenue*margin;$('#tataResults').innerHTML=`<div class="result"><small>Illustrative revenue</small><strong>₹${num(revenue)} Cr</strong></div><div class="result"><small>Illustrative EBITDA</small><strong>₹${num(ebitda)} Cr</strong></div><div class="result"><small>Margin change vs FY25</small><strong>${((margin-.131)*10000).toFixed(0)} bps</strong></div>`};tataInputs.forEach(i=>i.oninput=updateTata);updateTata();
  }
  $('#completeBtn').onclick=()=>{completed.has(current)?completed.delete(current):completed.add(current);localStorage.setItem('fpa-completed',JSON.stringify([...completed]));render();nav()};
  $('#prevBtn').onclick=()=>go(current-1);$('#nextBtn').onclick=()=>go(current===modules.length-1?0:current+1);bindLab(m.lab);nav();window.scrollTo({top:0,behavior:'smooth'})
}
function go(i){current=i;localStorage.setItem('fpa-last-module',String(i));location.hash='m'+i;$('#sidebar').classList.remove('open');render()}
$('#search').oninput=nav;$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeBtn').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';localStorage.setItem('fpa-theme',d.dataset.theme)};document.documentElement.dataset.theme=localStorage.getItem('fpa-theme')||'light';
const planningTopLink=document.createElement('a');planningTopLink.className='top-link';planningTopLink.id='planningLink';planningTopLink.href='#m0';planningTopLink.textContent='Applied planning';$('#useCasesLink').after(planningTopLink);
const careerTopLink=document.createElement('a');careerTopLink.className='top-link';careerTopLink.id='careerLink';careerTopLink.href='#m0';careerTopLink.textContent='Career explorer';$('#useCasesLink').after(careerTopLink);
const beginnerToggle=document.createElement('button');beginnerToggle.className='icon-btn beginner-toggle'+(beginnerMode?' active':'');beginnerToggle.id='beginnerToggle';beginnerToggle.textContent=beginnerMode?'Beginner mode: On':'Beginner mode: Off';careerTopLink.after(beginnerToggle);beginnerToggle.onclick=()=>{beginnerMode=!beginnerMode;localStorage.setItem('fpa-beginner-mode',beginnerMode?'on':'off');beginnerToggle.classList.toggle('active',beginnerMode);beginnerToggle.textContent=beginnerMode?'Beginner mode: On':'Beginner mode: Off';render()};
$('#useCasesLink').onclick=e=>{e.preventDefault();go(0);setTimeout(()=>document.querySelector('#oracle-use-cases')?.scrollIntoView({behavior:'smooth'}),60)};
$('#careerLink').onclick=e=>{e.preventDefault();go(0);setTimeout(()=>document.querySelector('#career-explorer')?.scrollIntoView({behavior:'smooth'}),60)};
$('#planningLink').onclick=e=>{e.preventDefault();go(0);setTimeout(()=>document.querySelector('#applied-planning')?.scrollIntoView({behavior:'smooth'}),60)};
function showToast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
window.addEventListener('hashchange',()=>{const i=Number(location.hash.replace('#m',''));if(Number.isInteger(i)&&i>=0&&i<modules.length&&i!==current){current=i;render()}});render();
</script>
