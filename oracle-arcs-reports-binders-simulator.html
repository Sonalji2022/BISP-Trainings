<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Oracle ARCS — Reports &amp; Report Binders Training Simulator | BISP Trainings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2340; --navy-2:#123A66; --teal:#0F6E6E; --amber:#E0A82E; --coral:#D3572F;
  --bg:#F3F5F8; --panel:#FFFFFF; --line:#E1E6EC;
  --ink:#101826; --ink-2:#3A4657; --ink-3:#7A8699;
  --ok:#1E7A4C; --ok-bg:#E7F5EC; --warn:#B23B1E; --warn-bg:#FBEAE3;
  --radius:10px;
  --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
#app{min-height:100%;}
.dim{color:var(--ink-3);}
.sm{font-size:12px;}
.center{text-align:center;}

/* ---- shell ---- */
.shell{display:flex;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:10px 22px;}
.brandblock{display:flex;align-items:center;gap:12px;}
.bisplogo{height:30px;background:#fff;padding:3px 6px;border-radius:6px;}
.bisplogo.lg{height:44px;padding:6px 10px;}
.brandtext .appname{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.03em;}
.brandtext .appname .dim{color:#9FB4CE;font-weight:500;font-size:13px;}
.brandtext .tag{font-size:11px;color:#8FA6C2;margin-top:1px;}
.userblock{display:flex;align-items:center;gap:12px;}
.userinfo{text-align:right;}
.uname{font-size:13px;font-weight:600;}
.urole{font-size:11px;color:#9FB4CE;}
.subnav{display:flex;flex-wrap:wrap;gap:2px;background:var(--navy-2);padding:0 16px;}
.navlink{background:transparent;border:none;color:#D8E3F0;padding:11px 14px;font-family:var(--font-body);font-size:13px;cursor:pointer;border-bottom:3px solid transparent;}
.navlink:hover{color:#fff;}
.navlink.active{color:#fff;border-bottom-color:var(--amber);font-weight:600;}
.content{flex:1;padding:26px 30px 60px;max-width:1180px;margin:0 auto;width:100%;}
.footer{background:var(--navy);color:#9FB4CE;font-size:11px;padding:14px 22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.footer a{color:#CFE0F5;}

/* ---- generic components ---- */
.pagetitle{font-family:var(--font-display);font-size:24px;margin:2px 0 6px;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin:18px 0;}
.panel h2{font-family:var(--font-display);font-size:15px;margin:0 0 12px;color:var(--navy);}
.panel.center{text-align:center;}
.btn{font-family:var(--font-body);font-weight:600;font-size:13px;border-radius:7px;padding:10px 18px;cursor:pointer;border:1px solid transparent;}
.btn.primary{background:var(--teal);color:#fff;}
.btn.primary:hover{background:#0C5A5A;}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line);}
.btn.ghost:hover{background:#EEF1F5;}
.btn.outline{background:#fff;color:var(--navy-2);border-color:var(--navy-2);}
.btn.sm{padding:7px 12px;font-size:12px;}
.btn.block{width:100%;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.btnrow.center{justify-content:center;}
.linkback{background:none;border:none;color:var(--teal);font-size:13px;cursor:pointer;padding:0;margin-bottom:10px;}
.flabel{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin-bottom:5px;font-weight:600;}
input[type=text],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-family:var(--font-body);font-size:13px;background:#fff;color:var(--ink);}
.fgroup{margin-bottom:4px;}
.paramgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.badge{display:inline-block;background:var(--ok-bg);color:var(--ok);font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;}
.badge.retry{background:var(--warn-bg);color:var(--warn);}

/* ---- login ---- */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#123A66 0%,#0B2340 55%,#081A30 100%);position:relative;overflow:hidden;}
.loginmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.12;}
.taccount{width:70vmin;height:70vmin;position:relative;}
.tline{position:absolute;background:#fff;}
.tline:not(.v){top:30%;left:0;right:0;height:3px;}
.tline.v{top:30%;bottom:0;left:50%;width:3px;}
.logincard{position:relative;background:#fff;border-radius:14px;padding:34px 36px 30px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;}
.logincard h1{font-family:var(--font-display);font-size:22px;letter-spacing:.05em;margin:14px 0 2px;color:var(--navy);}
.loginsub{color:var(--ink-3);font-size:13px;margin:0 0 18px;line-height:1.5;}
.logincard .flabel{text-align:left;}
.logincard input,.logincard select{margin-bottom:14px;}

/* ---- hero / menu ---- */
.hero{padding:6px 0 18px;}
.hero h1{font-family:var(--font-display);font-size:26px;margin:0 0 8px;color:var(--navy);}
.hero p{color:var(--ink-2);max-width:640px;}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:8px;}
.menucard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:box-shadow .15s,transform .15s;}
.menucard:hover{box-shadow:0 8px 20px rgba(11,35,64,.1);transform:translateY(-2px);}
.menucard-title{font-family:var(--font-display);font-weight:700;color:var(--navy);margin-bottom:6px;}
.menucard-desc{font-size:12.5px;color:var(--ink-3);line-height:1.4;}
.menucard-go{margin-top:10px;font-size:12px;color:var(--teal);font-weight:600;}

/* ---- flow / smartart ---- */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.flowstep{display:flex;align-items:center;gap:6px;}
.flowbox{background:#EEF3F8;border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--navy-2);}
.flowarrow{color:var(--ink-3);}
.tree{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;}
.treeroot{background:var(--navy);color:#fff;font-family:var(--font-display);font-weight:700;padding:9px 18px;border-radius:7px;font-size:13px;}
.treekids{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.treekid{background:#EEF3F8;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--navy-2);}

/* ---- report library ---- */
.reportgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.reportcard{text-align:left;background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;}
.reportcard:hover{border-color:var(--teal);background:#F0F8F7;}
.reportcard-name{font-weight:700;font-size:13px;color:var(--navy);margin-bottom:4px;}
.reportcard-desc{font-size:11.5px;color:var(--ink-3);line-height:1.35;}

/* ---- report preview ---- */
.reportmeta{display:flex;gap:26px;flex-wrap:wrap;background:#EEF3F8;border-radius:8px;padding:12px 16px;margin-bottom:4px;}
.rmv{font-family:var(--font-mono);font-weight:600;font-size:13px;color:var(--navy);}
.kpirow{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 16px;}
.kpi{background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:110px;text-align:center;}
.kpiv{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--navy);}
.kpil{font-size:11px;color:var(--ink-3);margin-top:2px;}
.kpibtn{cursor:pointer;border:1px solid var(--line);}
.kpibtn.active{border-color:var(--teal);background:#E9F6F5;}
.chart{width:100%;height:auto;}
.tabletools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0;}
.tabletools input{max-width:240px;}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table.datatable{border-collapse:collapse;width:100%;font-size:12.5px;}
table.datatable th{background:#EEF3F8;color:var(--navy-2);text-align:left;padding:9px 12px;font-size:11.5px;cursor:pointer;white-space:nowrap;position:sticky;top:0;}
table.datatable td{padding:8px 12px;border-top:1px solid var(--line);white-space:nowrap;}
table.datatable td.num{font-family:var(--font-mono);text-align:right;}
.risk-high{color:var(--warn);font-weight:600;}
.risk-medium{color:var(--amber);font-weight:600;}
.risk-low{color:var(--ok);font-weight:600;}
.st-approved{color:var(--ok);}
.st-rejected{color:var(--warn);}
.empty{padding:20px;text-align:center;color:var(--ink-3);font-size:13px;}

/* ---- balance bridge ---- */
.bridge{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:10px 0 16px;}
.bstep{background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:130px;}
.bstep.total{background:var(--navy);color:#fff;border-color:var(--navy);}
.blabel{font-size:11px;color:inherit;opacity:.7;}
.bval{font-family:var(--font-mono);font-weight:700;font-size:15px;margin-top:3px;}
.bop{align-self:center;font-size:18px;color:var(--ink-3);font-weight:700;}

/* ---- binder ---- */
.compgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:6px;}
.comptoggle{text-align:left;background:#F8FAFC;border:1px solid var(--line);border-radius:7px;padding:9px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2);}
.comptoggle.on{background:#E9F6F5;border-color:var(--teal);color:var(--teal);font-weight:600;}
.binderdoc{max-width:420px;margin:0 auto;background:#FBFCFD;border:1px solid var(--line);border-radius:8px;padding:22px;}
.binderdoc-head{text-align:center;font-family:var(--font-display);font-weight:700;letter-spacing:.08em;color:var(--navy);font-size:13px;}
.binderdoc-title{text-align:center;font-family:var(--font-display);font-weight:700;font-size:16px;margin:8px 0;color:var(--navy);}
.binderdoc ol{font-size:13px;color:var(--ink-2);line-height:1.9;}
.validbox{border-radius:8px;padding:12px 16px;font-weight:600;font-size:13px;margin-top:10px;}
.validbox.ok{background:var(--ok-bg);color:var(--ok);}
.validbox.warn{background:var(--warn-bg);color:var(--warn);}

/* ---- scenarios ---- */
.scenariolist{display:flex;flex-direction:column;gap:12px;}
.scenariocard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;}
.scenariocard.done{border-color:var(--ok);}
.scenariocard-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.scnum{background:var(--navy);color:#fff;font-family:var(--font-mono);font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.scname{font-weight:700;color:var(--navy);}
.scenariobody{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;font-size:12.5px;color:var(--ink-2);}
.scenariobody b{color:var(--navy-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
.scenariobody p{margin:3px 0 0;}
.feedback{background:#EEF9F3;border-radius:6px;padding:8px 10px;}

/* ---- practice / exam ---- */
.tasklist{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.9;}
.examprogress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
.examprogress-fill{height:100%;background:var(--teal);}
.examoptions{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.examopt{text-align:left;background:#F8FAFC;border:1px solid var(--line);border-radius:7px;padding:11px 14px;font-size:13px;cursor:pointer;}
.examopt.selected{border-color:var(--teal);background:#E9F6F5;font-weight:600;}
.reviewq{border-top:1px solid var(--line);padding:10px 0;font-size:13px;}
.reviewq .ok{color:var(--ok);}
.reviewq .bad{color:var(--warn);}
.scorebig{font-family:var(--font-display);font-size:48px;font-weight:700;color:var(--navy);}
.badge.pass{background:var(--ok-bg);color:var(--ok);}

/* ---- analytics ---- */
.anagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}

/* ---- completion ---- */
.completewrap{max-width:520px;margin:60px auto;text-align:center;background:#fff;border-radius:14px;padding:40px;border:1px solid var(--line);}
.completewrap h1{font-family:var(--font-display);color:var(--navy);margin:14px 0 0;}
.completewrap h2{font-family:var(--font-display);color:var(--teal);margin:4px 0 0;}
.completewrap .kpirow{justify-content:center;margin-top:20px;}

/* ---- toast / fab ---- */
#toastHost{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;}
.toast{background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
.fab{position:fixed;right:18px;bottom:18px;background:var(--amber);color:#3A2A00;border:none;border-radius:24px;padding:12px 18px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:40;}
.fab:hover{filter:brightness(0.95);}

@media (max-width:700px){
  .topbar{flex-direction:column;align-items:flex-start;gap:8px;}
  .userblock{width:100%;justify-content:space-between;}
  .content{padding:18px 14px 60px;}
}

/* ---- icons & original illustrations ---- */
.icn{display:inline-flex;vertical-align:middle;}
.icn svg{width:100%;height:100%;display:block;}
.title-icon{width:22px;height:22px;margin-right:8px;color:var(--navy);}
.cathead{display:flex;align-items:center;}
.cathead-icon{width:18px;height:18px;margin-right:8px;color:var(--teal);}
.reportcard-icon{width:20px;height:20px;color:var(--teal);margin-bottom:8px;}
.menuicon{width:26px;height:26px;color:var(--teal);margin-bottom:10px;}
.comp-icon{width:14px;height:14px;margin-right:6px;color:inherit;}
.scenario-icon{width:20px;height:20px;color:var(--navy-2);flex-shrink:0;}
.flowarrow .icn{width:16px;height:16px;color:var(--ink-3);}
.flowarrow{display:flex;align-items:center;}

.hero{display:flex;align-items:center;gap:26px;padding:6px 0 18px;}
.hero-text{flex:1 1 320px;}
.hero-text h1{font-family:var(--font-display);font-size:26px;margin:0 0 8px;color:var(--navy);}
.hero-text p{color:var(--ink-2);max-width:520px;}
.hero-image{flex:1 1 320px;max-width:420px;}
.hero-illustration{width:100%;height:auto;border-radius:16px;box-shadow:0 14px 34px rgba(11,35,64,.18);}
.loginmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.24;}
.loginmark .hero-illustration{width:72vmin;max-width:640px;box-shadow:none;}

@media (max-width:820px){
  .hero{flex-direction:column;}
  .hero-image{max-width:100%;}
}

</style>
</head>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967295;};}
function seededRand(seedStr){let h=0;for(let i=0;i<seedStr.length;i++){h=Math.imul(31,h)+seedStr.charCodeAt(i)|0;}return mulberry32(h);}
function pick(rnd,arr){return arr[Math.floor(rnd()*arr.length)];}

/* ---------- fictional row generators ---------- */
function genReconStatusRows(seed,n=14){
  const rnd=seededRand(seed);const rows=[];
  for(let i=0;i<n;i++){
    const bal=Math.round((rnd()*900000-100000)*100)/100;
    const diff=rnd()>0.72?Math.round((rnd()*4000-2000)*100)/100:0;
    rows.push({Account:pick(rnd,ACCOUNTS),Entity:pick(rnd,ENTITIES),Period:'Jun-2026',Status:pick(rnd,STATUS),Risk:pick(rnd,RISK),Preparer:pick(rnd,PREPARERS),Reviewer:pick(rnd,REVIEWERS),Balance:bal,Difference:diff,'Due Date':`06/${10+Math.floor(rnd()*18)}/26`});
  }
  return rows;
}
function genLateRows(seed,n=10){
  const rnd=seededRand(seed);const rows=[];
  for(let i=0;i<n;i++){
    const days=1+Math.floor(rnd()*22);
    rows.push({Account:pick(rnd,ACCOUNTS),Entity:pick(rnd,ENTITIES),'Due Date':`06/${5+Math.floor(rnd()*15)}/26`,'Days Late':days,Risk:days>14?'High':days>6?'Medium':'Low',Owner:pick(rnd,PREPARERS),Status:'In Progress'});
  }
  return rows.sort((a,b)=>b['Days Late']-a['Days Late']);
}

  const rnd=seededRand(seed);const reasons=['Unsupported adjustment','Missing attachment','Balance not tied out','Incorrect risk rank','Stale supporting doc','Comment required'];

  for(let i=0;i<n;i++){rows.push({Reconciliation:pick(rnd,ACCOUNTS),Reviewer:pick(rnd,REVIEWERS),Reason:pick(rnd,reasons),Date:`06/${2+Math.floor(rnd()*20)}/26`,Comment:'See reviewer notes in workflow history',Status:'Returned to Preparer'});}
  return rows;
}
function genUnexplainedRows(seed,n=9){
  const rnd=seededRand(seed);const rows=[];
  for(let i=0;i<n;i++){
    const exp=Math.round(rnd()*500000*100)/100;
    const act=exp+Math.round((rnd()*6000-3000)*100)/100;
    rows.push({Account:pick(rnd,ACCOUNTS),Expected:exp,Actual:act,Difference:Math.round((act-exp)*100)/100,Owner:pick(rnd,PREPARERS),Status:pick(rnd,['Open','Investigating','Escalated']),'Days Open':1+Math.floor(rnd()*40)});
  }
  return rows;
}
function genAuditRows(seed,n=12){
  const rnd=seededRand(seed);const actions=['Submitted','Approved','Rejected','Reopened','Attachment Added','Comment Added','Balance Updated'];
  const rows=[];
  for(let i=0;i<n;i++){rows.push({User:pick(rnd,PREPARERS.concat(REVIEWERS)),Action:pick(rnd,actions),Date:`06/${1+Math.floor(rnd()*27)}/26 ${8+Math.floor(rnd()*9)}:${(10+Math.floor(rnd()*49))}`,Object:pick(rnd,ACCOUNTS),'Old Value':'Draft','New Value':pick(rnd,STATUS),Comment:'Routine period-end activity'});}
  return rows;
}
function genGenericRows(seed,n=10){
  const rnd=seededRand(seed);const rows=[];
  for(let i=0;i<n;i++){rows.push({Item:pick(rnd,ACCOUNTS),Entity:pick(rnd,ENTITIES),Period:'Jun-2026',Owner:pick(rnd,PREPARERS),Status:pick(rnd,STATUS),Value:Math.round(rnd()*250000*100)/100});}
  return rows;
}
function genTMRows(seed,n=10){
  const rnd=seededRand(seed);const src=['Bank Feed - Wells','Bank Feed - HSBC','ERP GL Export','Card Processor','Payroll Interface'];
  const rows=[];
  for(let i=0;i<n;i++){rows.push({'Txn ID':'TXN-'+(100000+Math.floor(rnd()*899999)),Source:pick(rnd,src),Entity:pick(rnd,ENTITIES),Amount:Math.round((rnd()*40000-5000)*100)/100,'Match Rule':'RULE-'+(1+Math.floor(rnd()*9)),Status:pick(rnd,['Matched','Unmatched','Suggested','Excluded'])});}
  return rows;
}

function rowsForReport(id){
  switch(id){
    case 'recon-status': return genReconStatusRows(id);
    case 'late-recon': return genLateRows(id);
    case 'rejected-recon': return genRejectedRows(id);
    case 'unexplained-diff': return genUnexplainedRows(id);
    case 'audit-report': return genAuditRows(id);
    case 'tm-config': case 'match-rule-stats': case 'unmatched-txn': case 'matching-adj': case 'journal-export': case 'data-load-results':
      return genTMRows(id);
    default: return genGenericRows(id);
  }
}

/* ---------- generic SVG bar chart ---------- */
function barChart(labels,values,opts={}){
  const w=opts.w||620,h=opts.h||220,pad=40,barW=(w-pad*2)/values.length*0.62,gap=(w-pad*2)/values.length;
  const max=Math.max(1,...values.map(v=>Math.abs(v)));
  const color=opts.color||'var(--teal)';
  let bars='',labs='';
  values.forEach((v,i)=>{
    const bh=Math.max(2,(Math.abs(v)/max)*(h-pad*2));
    const x=pad+i*gap+(gap-barW)/2;
    const y=h-pad-bh;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${v<0?'var(--coral)':color}"><title>${esc(labels[i])}: ${v}</title></rect>`;
    labs+=`<text x="${(x+barW/2).toFixed(1)}" y="${h-pad+16}" font-size="10" text-anchor="middle" fill="var(--ink-3)">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" class="chart"><line x1="${pad}" y1="${h-pad}" x2="${w-10}" y2="${h-pad}" stroke="var(--line)"/>${bars}${labs}</svg>`;
}
function lineChart(labels,values,opts={}){
  const w=opts.w||620,h=opts.h||220,pad=40;
  const max=Math.max(...values,1),min=Math.min(...values,0);
  const span=(max-min)||1;
  const stepX=(w-pad*2)/(values.length-1||1);
  let pts=values.map((v,i)=>`${(pad+i*stepX).toFixed(1)},${(h-pad-((v-min)/span)*(h-pad*2)).toFixed(1)}`).join(' ');
  let dots=values.map((v,i)=>{const x=pad+i*stepX,y=h-pad-((v-min)/span)*(h-pad*2);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="var(--amber)"><title>${esc(labels[i])}: ${v}</title></circle>`;}).join('');
  let labs=labels.map((l,i)=>`<text x="${(pad+i*stepX).toFixed(1)}" y="${h-pad+16}" font-size="10" text-anchor="middle" fill="var(--ink-3)">${esc(l)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="chart"><line x1="${pad}" y1="${h-pad}" x2="${w-10}" y2="${h-pad}" stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="2"/>${dots}${labs}</svg>`;
}

/* ---------- generic sortable/filterable table ---------- */
function dataTable(rows,opts={}){
  if(!rows.length)return '<div class="empty">No rows match the current filter.</div>';
  const cols=Object.keys(rows[0]);
  let filtered=rows;
  if(S.tableFilter){const q=S.tableFilter.toLowerCase();filtered=rows.filter(r=>cols.some(c=>String(r[c]).toLowerCase().includes(q)));}
  if(S.tableSort.col){const c=S.tableSort.col,d=S.tableSort.dir;filtered=[...filtered].sort((a,b)=>{const av=a[c],bv=b[c];if(typeof av==='number')return (av-bv)*d;return String(av).localeCompare(String(bv))*d;});}
  const money_cols=cols.filter(c=>['Balance','Difference','Value','Amount','Expected','Actual'].includes(c));
  let head=cols.map(c=>`<th data-sort="${esc(c)}">${esc(c)} ${S.tableSort.col===c?(S.tableSort.dir>0?'▲':'▼'):''}</th>`).join('');
  let body=filtered.map(r=>`<tr>${cols.map(c=>{let v=r[c];if(money_cols.includes(c))v=money(v);return `<td class="${money_cols.includes(c)?'num':''} ${c==='Risk'?'risk-'+String(r[c]).toLowerCase():''} ${c==='Status'?'st-'+String(r[c]).toLowerCase().replace(/\s+/g,'-'):''}">${esc(v)}</td>`;}).join('')}</tr>`).join('');
  return `
   <div class="tabletools">
     <input type="text" id="tblSearch" placeholder="Search rows…" value="${esc(S.tableFilter)}"/>
     <div class="dim sm">${filtered.length} of ${rows.length} rows</div>
   </div>
   <div class="tablewrap"><table class="datatable"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function bindTable(container,rows){
  const search=container.querySelector('#tblSearch');
  if(search)search.addEventListener('input',e=>{S.tableFilter=e.target.value;renderCurrent();});
  container.querySelectorAll('th[data-sort]').forEach(th=>th.addEventListener('click',()=>{
    const c=th.getAttribute('data-sort');
    if(S.tableSort.col===c)S.tableSort.dir*=-1;else{S.tableSort.col=c;S.tableSort.dir=1;}
    renderCurrent();
  }));
}

function view_preview(){

  let body='';
  switch(r.id){

    case 'aging-analysis': body=preview_aging(); break;
    case 'balance-analysis': body=preview_balance(); break;
    case 'late-recon': body=preview_lateRecon(); break;

  const rows=rowsForReport(r.id);
  const numCol=Object.keys(rows[0]).find(c=>typeof rows[0][c]==='number');
  const chart=numCol?barChart(rows.slice(0,8).map(x=>String(x[Object.keys(x)[0]]).slice(0,10)),rows.slice(0,8).map(x=>x[numCol])):'';
  return `

   <div class="kpirow">
     <div class="kpi"><div class="kpiv">${rows.length}</div><div class="kpil">Rows Returned</div></div>

function preview_lateRecon(){

function preview_rejected(){
  const rows=rowsForReport('rejected-recon');

  return `<h2>Rejections by Reason</h2>${chart}<h2>Detail</h2><div id="tableHost">${dataTable(rows)}</div>`;

function preview_unexplained(){

function preview_openRecon(){
  const rows=genReconStatusRows('open-recon',18);
  const counts={Open:rows.filter(r=>['Not Started','In Progress'].includes(r.Status)).length,
    Completed:rows.filter(r=>['Approved'].includes(r.Status)).length,
    Late:rows.filter((r,i)=>i%4===0).length,
    'High Risk':rows.filter(r=>r.Risk==='High').length};
  let filtered=rows;
  if(S.openKpiFilter==='Open')filtered=rows.filter(r=>['Not Started','In Progress'].includes(r.Status));
  else if(S.openKpiFilter==='Completed')filtered=rows.filter(r=>r.Status==='Approved');
  else if(S.openKpiFilter==='High Risk')filtered=rows.filter(r=>r.Risk==='High');
  return `
   <h2>Open Reconciliations — KPIs</h2>
   <div class="kpirow clickable">
     ${Object.entries(counts).map(([k,v])=>`<button class="kpi kpibtn ${S.openKpiFilter===k?'active':''}" data-kpi="${k}"><div class="kpiv">${v}</div><div class="kpil">${k}</div></button>`).join('')}
     <button class="kpi kpibtn ${S.openKpiFilter==='All'?'active':''}" data-kpi="All"><div class="kpiv">${rows.length}</div><div class="kpil">All</div></button>
   </div>
   <h2>Detail ${S.openKpiFilter!=='All'?'— filtered: '+esc(S.openKpiFilter):''}</h2>
   <div id="tableHost">${dataTable(filtered)}</div>`;
}

function preview_aging(){
  const rnd=seededRand('aging');
  const buckets=['0–7','8–30','31–60','61–90','90+'];
  const counts=buckets.map(()=>2+Math.floor(rnd()*9));
  const active=S.activeParams._agingBucket;
  const rows=genUnexplainedRows('aging-detail',20).map((r,i)=>({...r,Bucket:buckets[i%buckets.length]}));
  const filtered=active?rows.filter(r=>r.Bucket===active):rows;
  return `

   <div class="kpirow clickable">
     ${buckets.map((b,i)=>`<button class="kpi kpibtn ${active===b?'active':''}" data-bucket="${b}"><div class="kpiv">${counts[i]}</div><div class="kpil">${b} days</div></button>`).join('')}

}

/* ============================================================
   ROUTER + EVENT BINDING
   ============================================================ */
function renderCurrent(){
  let html='';
  const fab=document.querySelector('.fab');
  if(S.view==='login'){ app.innerHTML=view_login(); bindLogin(); if(fab)fab.style.display='none'; return; }
  if(fab)fab.style.display='block';
  switch(S.view){
    case 'main': html=chrome(view_main(),'main'); break;
    case 'library': html=chrome(view_library(),'library'); break;
    case 'params': html=chrome(view_params(),'library'); break;
    case 'preview': html=chrome(view_preview(),'library'); break;
    case 'binder': html=chrome(view_binder(),'binder'); break;
    case 'scenarios': html=chrome(view_scenarios(),'scenarios'); break;
    case 'practice': html=chrome(view_practice(),'practice'); break;
    case 'exam': html=chrome(view_exam(),'exam'); break;
    case 'analytics': html=chrome(view_analytics(),'analytics'); break;
    case 'help': html=chrome(view_help(),'help'); break;
    case 'completion': html=chrome(view_completion(),'main'); break;
    default: html=chrome(view_main(),'main');
  }
  app.innerHTML=html;
  bindGlobal();
  bindViewSpecific();
}

function goTo(view){S.view=view;window.scrollTo(0,0);renderCurrent();}

function bindLogin(){
  document.getElementById('loginBtn').addEventListener('click',()=>{
    const name=document.getElementById('loginName').value.trim();
    const role=document.getElementById('loginRole').value;
    S.user.name=name||'Guest Learner';
    S.user.role=role;
    S.scoring.startTime=Date.now();
    goTo('main');
  });
}

function bindGlobal(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click',()=>{
      const rid=el.getAttribute('data-open-report');
      if(rid){S.activeReport=rid;S.tableFilter='';S.tableSort={col:null,dir:1};S.openKpiFilter='All';}
      goTo(el.getAttribute('data-nav'));
    });
  });
}

function bindViewSpecific(){
  switch(S.view){
    case 'library':
      document.querySelectorAll('[data-open-report]').forEach(el=>{
        if(el.hasAttribute('data-nav'))return; // already bound
        el.addEventListener('click',()=>{S.activeReport=el.getAttribute('data-open-report');S.tableFilter='';S.tableSort={col:null,dir:1};goTo('params');});
      });
      break;
    case 'params':
      document.querySelectorAll('[data-param]').forEach(sel=>sel.addEventListener('change',e=>{S.activeParams[sel.getAttribute('data-param')]=e.target.value;}));
      const runBtn=document.getElementById('runReportBtn');
      if(runBtn)runBtn.addEventListener('click',()=>{S.scoring.reportsCompleted++;toast('Report generated successfully.');goTo('preview');});
      const resetBtn=document.getElementById('resetParamsBtn');
      if(resetBtn)resetBtn.addEventListener('click',()=>{S.activeParams={Period:'Jun-2026',Entity:'All',Account:'All',Status:'All',Risk:'All',Preparer:'All',Reviewer:'All'};renderCurrent();});
      break;
    case 'preview': {
      const host=document.getElementById('tableHost');
      if(host)bindTable(host,rowsForReport(S.activeReport));
      document.querySelectorAll('[data-export]').forEach(b=>b.addEventListener('click',()=>toast('Illustrative '+b.getAttribute('data-export')+' export generated.')));
      document.querySelectorAll('[data-kpi]').forEach(b=>b.addEventListener('click',()=>{S.openKpiFilter=b.getAttribute('data-kpi');renderCurrent();}));
      document.querySelectorAll('[data-bucket]').forEach(b=>b.addEventListener('click',()=>{S.activeParams._agingBucket=b.getAttribute('data-bucket')||null;renderCurrent();}));
      break;
    }
    case 'binder': {
      const nameEl=document.getElementById('binderName'),periodEl=document.getElementById('binderPeriod'),entEl=document.getElementById('binderEntity'),descEl=document.getElementById('binderDesc');
      [nameEl,periodEl,entEl,descEl].forEach(el=>{if(!el)return;el.addEventListener('input',()=>{S.binder.name=nameEl.value;S.binder.period=periodEl.value;S.binder.entity=entEl.value;S.binder.desc=descEl.value;});});
      const createBtn=document.getElementById('createBinderBtn');
      if(createBtn)createBtn.addEventListener('click',()=>{
        if(!S.binder.name){toast('Enter a binder name first.');return;}
        S.binder._validated=false;toast('Binder "'+S.binder.name+'" created.');renderCurrent();
      });
      document.querySelectorAll('[data-comp]').forEach(b=>b.addEventListener('click',()=>{
        const c=b.getAttribute('data-comp');
        const idx=S.binder.components.indexOf(c);
        if(idx>-1)S.binder.components.splice(idx,1); else {S.binder.components.push(c);S.scoring.binderTasksCompleted++;}
        S.binder._validated=false;
        renderCurrent();
      }));
      const valBtn=document.getElementById('validateBinderBtn');
      if(valBtn)valBtn.addEventListener('click',()=>{
        S.binder._validated=true;
        const complete=S.binder.components.length===S.binderAllComponents.length;
        if(complete){S.scoring.correctActions++;toast('Binder validated — COMPLETE.');}
        else{S.scoring.incorrectActions++;toast('Binder validated — missing components.');}
        renderCurrent();
      });
      break;
    }
    case 'scenarios':
      document.querySelectorAll('[data-complete-scenario]').forEach(b=>b.addEventListener('click',()=>{
        const id=b.getAttribute('data-complete-scenario');
        if(!S.scenarioProgress[id]){S.scenarioProgress[id]=true;S.scoring.scenariosCompleted++;S.scoring.correctActions++;}
        toast('Scenario marked complete.');
        renderCurrent();
      }));
      break;
    case 'practice': {
      const btn=document.getElementById('practiceCheckBtn');
      if(btn)btn.addEventListener('click',()=>{
        const rows=genLateRows('late-recon');
        const oldest=rows[0];
        document.getElementById('practiceResult').innerHTML=`<div class="validbox ok" style="margin-top:14px">Oldest high-risk item: <b>${esc(oldest.Account)}</b> at <b>${esc(oldest.Entity)}</b> — ${oldest['Days Late']} days late, owner ${esc(oldest.Owner)}.</div>`;
        S.scoring.correctActions++;
      });
      break;
    }
    case 'exam': {
      document.querySelectorAll('[data-exam-answer]').forEach(b=>b.addEventListener('click',()=>{
        S.exam.answers[S.exam.qIndex]=parseInt(b.getAttribute('data-exam-answer'),10);
        renderCurrent();
      }));
      const prev=document.getElementById('examPrevBtn'); if(prev)prev.addEventListener('click',()=>{S.exam.qIndex--;renderCurrent();});
      const next=document.getElementById('examNextBtn'); if(next)next.addEventListener('click',()=>{S.exam.qIndex++;renderCurrent();});
      const submit=document.getElementById('examSubmitBtn'); if(submit)submit.addEventListener('click',()=>{
        S.exam.submitted=true;
        const correct=EXAM_QUESTIONS.filter((q,i)=>S.exam.answers[i]===q.a).length;
        S.scoring.correctActions+=correct;S.scoring.incorrectActions+=(EXAM_QUESTIONS.length-correct);
        renderCurrent();
      });
      const retake=document.getElementById('retakeExamBtn'); if(retake)retake.addEventListener('click',()=>{S.exam={qIndex:0,answers:[],submitted:false};renderCurrent();});
      break;
    }
  }
  // universal: allow finishing to completion screen from Help footer shortcut
}

/* Finish button injected into subnav via keyboard shortcut area: add a floating action */
function addFinishFab(){
  const fab=document.createElement('button');
  fab.className='fab';
  fab.textContent='Finish Training →';
  fab.addEventListener('click',()=>goTo('completion'));
  fab.style.display='none';
  document.body.appendChild(fab);
}

/* ---------- init ---------- */
renderCurrent();
addFinishFab();

</script>
</body>
</html>
