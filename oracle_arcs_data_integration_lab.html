<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle ARCS · Data Integration Lab | BISP Trainings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#080B14;
  --bg-grid: rgba(45,212,191,0.045);
  --panel:#0E1424;
  --panel-2:#121A2E;
  --card:#161F36;
  --card-hi:#1B2542;
  --border:#26314E;
  --border-soft:#1C2438;
  --text:#E9EDF6;
  --text-dim:#93A0BD;
  --text-faint:#5C6A8C;
  --teal:#2FE0C6;
  --teal-dim:#1B7D6E;
  --coral:#FF6B52;
  --amber:#FFB93D;
  --green:#3FDB90;
  --red:#FF5C7A;
  --violet:#8B7CF6;
  --bisp-blue:#1B4F9C;
  --bisp-orange:#F7941D;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased;}
body{
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 34px 34px;
  background-attachment: fixed;
}
::selection{background:var(--teal); color:#04120F;}
a{color:inherit; text-decoration:none;}
button{font-family:var(--font-body); cursor:pointer;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:var(--panel);}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--teal-dim);}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

.mono{font-family:var(--font-mono);}
.illustrative{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--amber); background:rgba(255,185,61,0.09); border:1px solid rgba(255,185,61,0.35);
  padding:3px 8px; border-radius:20px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
}
.illustrative::before{content:'●'; font-size:7px;}

/* ---------- Pipeline signature motif ---------- */
.pipeline{position:relative; display:flex; align-items:center; gap:0; width:100%; height:2px; background:linear-gradient(90deg, transparent, var(--border) 8%, var(--border) 92%, transparent); margin:6px 0;}
.pipeline .packet{position:absolute; top:50%; width:6px; height:6px; border-radius:50%; background:var(--teal); box-shadow:0 0 10px 2px rgba(47,224,198,.7); transform:translateY(-50%); animation:travel 3.2s linear infinite;}
.pipeline .packet:nth-child(2){animation-delay:1.1s; background:var(--coral); box-shadow:0 0 10px 2px rgba(255,107,82,.6);}
.pipeline .packet:nth-child(3){animation-delay:2.2s; background:var(--violet); box-shadow:0 0 10px 2px rgba(139,124,246,.6);}
@keyframes travel{from{left:-2%;} to{left:101%;}}
@media (prefers-reduced-motion: reduce){.pipeline .packet{animation:none; display:none;}}

/* ================= LOGIN SCREEN ================= */
#loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; padding:24px;}
.login-glow{position:absolute; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle, rgba(47,224,198,0.10) 0%, transparent 65%); top:-320px; right:-260px; pointer-events:none;}
.login-glow.two{background:radial-gradient(circle, rgba(255,107,82,0.08) 0%, transparent 65%); top:auto; bottom:-380px; left:-300px; right:auto;}
.login-card{position:relative; z-index:2; width:100%; max-width:460px; background:linear-gradient(180deg, var(--panel-2), var(--panel)); border:1px solid var(--border); border-radius:18px; padding:40px 38px 34px; box-shadow:0 40px 90px -30px rgba(0,0,0,.7);}
.login-eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.22em; color:var(--teal); text-transform:uppercase; display:flex; align-items:center; gap:8px;}
.login-eyebrow::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--teal); box-shadow:0 0 8px 2px rgba(47,224,198,.8); display:inline-block;}
.login-title{font-family:var(--font-display); font-size:34px; font-weight:700; letter-spacing:-0.01em; margin-top:14px; line-height:1.05;}
.login-title span{color:var(--teal);}
.login-sub{font-family:var(--font-display); font-size:14px; color:var(--text-dim); margin-top:6px; letter-spacing:.02em;}
.login-tagline{font-style:normal; margin-top:18px; font-family:var(--font-mono); font-size:12.5px; color:var(--coral); letter-spacing:.03em;}
.login-form{margin-top:26px; display:flex; flex-direction:column; gap:14px;}
.field label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; font-family:var(--font-mono);}
.field input, .field select{width:100%; background:var(--card); border:1px solid var(--border); color:var(--text); padding:11px 13px; border-radius:9px; font-size:14px; font-family:var(--font-body); transition:border-color .15s;}
.field input:focus, .field select:focus{border-color:var(--teal);}
.btn{border:none; border-radius:9px; padding:12px 18px; font-weight:600; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s, box-shadow .12s, opacity .12s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg, var(--teal), #1FA98E); color:#03120E; box-shadow:0 10px 26px -10px rgba(47,224,198,.55);}
.btn-primary:hover{box-shadow:0 14px 32px -8px rgba(47,224,198,.7);}
.btn-ghost{background:var(--card); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--teal-dim);}
.btn-coral{background:linear-gradient(135deg, var(--coral), #C8452F); color:#1A0400;}
.btn-block{width:100%; margin-top:6px;}
.btn-sm{padding:8px 12px; font-size:12.5px; border-radius:7px;}
.login-footer{margin-top:28px; padding-top:20px; border-top:1px solid var(--border-soft); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.bisp-brand{display:flex; align-items:center; gap:10px;}
.bisp-brand img{height:30px; width:auto; border-radius:4px; background:#fff; padding:3px;}
.bisp-brand-text{font-size:11px; color:var(--text-dim); line-height:1.4;}
.bisp-brand-text b{color:var(--text); font-family:var(--font-display);}

/* ================= APP SHELL ================= */
#mainShell{display:none; min-height:100vh; grid-template-columns:248px 1fr; }
#mainShell.active{display:grid;}
.topbar{grid-column:1/3; display:flex; align-items:center; justify-content:space-between; padding:14px 26px; border-bottom:1px solid var(--border-soft); background:rgba(14,20,36,0.85); backdrop-filter:blur(10px); position:sticky; top:0; z-index:40;}
.topbar-left{display:flex; align-items:center; gap:14px;}
.brandmark{font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px;}
.brandmark .dot{width:8px; height:8px; border-radius:50%; background:var(--teal); box-shadow:0 0 8px 2px rgba(47,224,198,.8);}
.brandmark small{font-family:var(--font-mono); font-size:10px; color:var(--text-faint); font-weight:500; letter-spacing:.1em; margin-left:4px;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.role-chip{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); background:var(--card); border:1px solid var(--border); padding:6px 12px; border-radius:20px;}
.sidebar{border-right:1px solid var(--border-soft); background:var(--panel); padding:18px 12px; position:sticky; top:57px; align-self:start; height:calc(100vh - 57px); overflow-y:auto;}
.sidebar-group-label{font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); padding:14px 12px 6px;}
.nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px; color:var(--text-dim); font-size:13.5px; font-weight:500; cursor:pointer; transition:background .12s, color .12s; margin-bottom:2px;}
.nav-item:hover{background:var(--card); color:var(--text);}
.nav-item.active{background:linear-gradient(90deg, rgba(47,224,198,.15), transparent); color:var(--teal); border-left:2px solid var(--teal); padding-left:10px;}
.nav-item .glyph{width:20px; text-align:center; font-size:13px; opacity:.85;}
.main-content{padding:28px 32px 60px; overflow-x:hidden;}

.page-head{margin-bottom:24px;}
.page-eyebrow{font-family:var(--font-mono); font-size:11px; color:var(--teal); letter-spacing:.14em; text-transform:uppercase; display:flex; align-items:center; gap:8px;}
.page-title{font-family:var(--font-display); font-size:26px; font-weight:700; margin-top:6px; letter-spacing:-0.01em;}
.page-desc{color:var(--text-dim); font-size:13.5px; margin-top:6px; max-width:720px; line-height:1.55;}

/* Grid helpers */
.grid{display:grid; gap:16px;}
.grid-6{grid-template-columns:repeat(6,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.grid-6{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}

.card{background:var(--card); border:1px solid var(--border-soft); border-radius:14px; padding:18px;}
.card-title{font-family:var(--font-display); font-size:14.5px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
.card-title .tag{font-size:9px;}

.kpi{position:relative; overflow:hidden;}
.kpi-label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint);}
.kpi-value{font-family:var(--font-display); font-size:26px; font-weight:700; margin-top:8px;}
.kpi-delta{font-size:11px; margin-top:6px; font-family:var(--font-mono);}
.kpi-delta.up{color:var(--green);}
.kpi-delta.down{color:var(--red);}
.kpi::after{content:''; position:absolute; right:-10px; bottom:-10px; width:60px; height:60px; border-radius:50%; background:var(--teal); opacity:.06;}

.chart-wrap{height:220px; position:relative;}
.chart-wrap.short{height:170px;}

/* Buttons row */
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}

/* Tables */
table.datatable{width:100%; border-collapse:collapse; font-size:13px;}
table.datatable th{text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); padding:9px 10px; border-bottom:1px solid var(--border);}
table.datatable td{padding:10px 10px; border-bottom:1px solid var(--border-soft); color:var(--text-dim);}
table.datatable tr:hover td{background:rgba(255,255,255,0.015); color:var(--text);}
.badge{font-family:var(--font-mono); font-size:10px; padding:3px 9px; border-radius:20px; letter-spacing:.04em; display:inline-block;}
.badge.success{background:rgba(63,219,144,.12); color:var(--green); border:1px solid rgba(63,219,144,.35);}
.badge.warning{background:rgba(255,185,61,.12); color:var(--amber); border:1px solid rgba(255,185,61,.35);}
.badge.failed{background:rgba(255,92,122,.12); color:var(--red); border:1px solid rgba(255,92,122,.35);}
.badge.running{background:rgba(139,124,246,.12); color:var(--violet); border:1px solid rgba(139,124,246,.35);}
.badge.valid{background:rgba(63,219,144,.12); color:var(--green); border:1px solid rgba(63,219,144,.35);}
.badge.invalid{background:rgba(255,92,122,.12); color:var(--red); border:1px solid rgba(255,92,122,.35);}

/* Source ecosystem */
.source-tile{background:var(--card); border:1px solid var(--border-soft); border-radius:13px; padding:16px; cursor:pointer; transition:border-color .15s, transform .15s;}
.source-tile:hover{border-color:var(--teal-dim); transform:translateY(-2px);}
.source-tile.selected{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset;}
.source-glyph{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:12px; margin-bottom:12px;}
.source-name{font-family:var(--font-display); font-size:14px; font-weight:600;}
.source-cat{font-size:11px; color:var(--text-faint); margin-top:3px;}

.detail-panel{margin-top:18px;}
.kv-row{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
.kv-row .k{width:140px; flex-shrink:0; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding-top:2px;}
.kv-row .v{color:var(--text-dim); line-height:1.5;}

/* Flow diagram (SmartArt style) */
.flow{display:flex; align-items:center; gap:0; flex-wrap:wrap; margin:18px 0;}
.flow-node{background:var(--card-hi); border:1px solid var(--border); border-radius:10px; padding:12px 18px; font-family:var(--font-display); font-size:13px; font-weight:600; text-align:center; min-width:120px;}
.flow-node.active{border-color:var(--teal); color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset;}
.flow-arrow{color:var(--text-faint); font-size:18px; margin:0 10px; flex-shrink:0;}
.flow.vertical{flex-direction:column; align-items:flex-start;}
.flow.vertical .flow-arrow{margin:6px 0 6px 26px; transform:rotate(90deg);}

/* Wizard */
.wizard-steps{display:flex; align-items:center; gap:6px; margin-bottom:22px; overflow-x:auto; padding-bottom:6px;}
.wstep{flex-shrink:0; display:flex; align-items:center; gap:7px; padding:7px 12px 7px 8px; border-radius:20px; background:var(--card); border:1px solid var(--border-soft); font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); cursor:pointer;}
.wstep .num{width:18px; height:18px; border-radius:50%; background:var(--border); color:var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:10px;}
.wstep.done{color:var(--green);}
.wstep.done .num{background:var(--green); color:#052E17;}
.wstep.current{color:var(--teal); border-color:var(--teal);}
.wstep.current .num{background:var(--teal); color:#04120F;}

.progress-track{background:var(--panel-2); border-radius:20px; height:9px; overflow:hidden; border:1px solid var(--border-soft);}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--teal-dim), var(--teal)); border-radius:20px; transition:width .5s ease;}
.progress-fill.amber{background:linear-gradient(90deg,#9c6c1a, var(--amber));}
.progress-fill.coral{background:linear-gradient(90deg,#8c2a1c, var(--coral));}
.progress-label{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-bottom:6px;}

.pill-select{display:flex; gap:8px; flex-wrap:wrap;}
.pill{padding:9px 15px; border-radius:20px; background:var(--card); border:1px solid var(--border-soft); font-size:12.5px; color:var(--text-dim); cursor:pointer; font-family:var(--font-mono);}
.pill.active{background:rgba(47,224,198,.13); border-color:var(--teal); color:var(--teal);}

.status-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px;}
.status-dot.on{background:var(--green); box-shadow:0 0 8px 2px rgba(63,219,144,.6);}
.status-dot.off{background:var(--red); box-shadow:0 0 8px 2px rgba(255,92,122,.5);}
.status-dot.idle{background:var(--text-faint);}

/* Load simulator bars */
.load-stage{margin-bottom:16px;}
.load-stage-label{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:12px; margin-bottom:6px; color:var(--text-dim);}
.load-stage-label .pct{color:var(--teal);}

/* Error / scenario cards */
.err-card{background:var(--card); border:1px solid var(--border-soft); border-radius:12px; padding:15px; cursor:pointer;}
.err-card:hover{border-color:var(--coral);}
.err-card.open{border-color:var(--coral); background:var(--card-hi);}
.err-title{font-family:var(--font-display); font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:8px;}
.err-title::before{content:'⚠'; color:var(--coral);}
.err-body{margin-top:12px; font-size:12.5px; color:var(--text-dim); line-height:1.6; display:none;}
.err-card.open .err-body{display:block;}
.err-body b{color:var(--text); font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; display:block; margin-top:10px;}

/* Health rings */
.ring-wrap{display:flex; align-items:center; gap:22px;}
.ring{position:relative; width:120px; height:120px;}
.ring svg{transform:rotate(-90deg);}
.ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px; font-weight:700;}

/* Scenario stepper */
.scenario-item{display:flex; gap:14px; padding:16px; border-radius:12px; background:var(--card); border:1px solid var(--border-soft); margin-bottom:10px;}
.scenario-item.done{border-color:var(--green);}
.scenario-num{width:30px; height:30px; border-radius:50%; background:var(--panel-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; flex-shrink:0;}
.scenario-item.done .scenario-num{background:var(--green); color:#052E17; border-color:var(--green);}
.scenario-body{flex:1;}
.scenario-title{font-weight:600; font-size:13.5px; font-family:var(--font-display);}
.scenario-desc{font-size:12px; color:var(--text-faint); margin-top:3px;}
.scenario-feedback{margin-top:8px; font-size:12px; color:var(--teal); font-family:var(--font-mono); display:none;}
.scenario-item.done .scenario-feedback{display:block;}

/* Quiz */
.quiz-card{background:var(--card); border:1px solid var(--border-soft); border-radius:14px; padding:22px; max-width:680px;}
.quiz-progress{font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-bottom:10px;}
.quiz-q{font-family:var(--font-display); font-size:16px; font-weight:600; margin-bottom:16px; line-height:1.4;}
.quiz-opt{display:block; width:100%; text-align:left; background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); padding:12px 14px; border-radius:9px; margin-bottom:9px; font-size:13.5px; transition:border-color .12s, background .12s;}
.quiz-opt:hover{border-color:var(--teal-dim);}
.quiz-opt.correct{border-color:var(--green); background:rgba(63,219,144,.1); color:var(--green);}
.quiz-opt.wrong{border-color:var(--red); background:rgba(255,92,122,.1); color:var(--red);}
.quiz-explain{margin-top:14px; font-size:12.5px; color:var(--text-dim); background:var(--panel-2); border-left:3px solid var(--teal); padding:11px 13px; border-radius:6px; display:none; line-height:1.5;}
.flashcard{background:var(--card); border:1px solid var(--border-soft); border-radius:14px; padding:22px; min-height:150px; display:flex; flex-direction:column; justify-content:center; cursor:pointer;}
.flashcard .fq{font-family:var(--font-display); font-weight:600; font-size:15px;}
.flashcard .fa{font-size:13px; color:var(--teal); margin-top:12px; font-family:var(--font-mono); display:none;}
.flashcard.flipped .fa{display:block;}
.flashcard .hint{font-size:10.5px; color:var(--text-faint); margin-top:14px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.06em;}

/* Scorecard */
.score-row{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--border-soft);}
.score-row .name{font-size:13px; color:var(--text-dim); font-family:var(--font-display); font-weight:500;}
.score-row .bar-mini{width:220px;}
.badge-final{margin-top:26px; text-align:center; padding:26px; border-radius:16px; background:linear-gradient(135deg, rgba(47,224,198,.12), rgba(139,124,246,.08)); border:1px solid var(--teal-dim);}
.badge-final .trophy{font-size:36px;}
.badge-final .btitle{font-family:var(--font-display); font-weight:700; font-size:18px; margin-top:8px;}
.badge-final .bsub{font-size:12px; color:var(--text-dim); margin-top:4px; font-family:var(--font-mono);}

/* Footer */
.app-footer{margin-top:50px; padding-top:22px; border-top:1px solid var(--border-soft); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
.app-footer .l{display:flex; align-items:center; gap:12px;}
.app-footer img{height:26px; background:#fff; padding:3px; border-radius:4px;}
.app-footer .txt{font-size:11px; color:var(--text-faint); line-height:1.6;}
.app-footer .txt b{color:var(--text-dim);}

.section-note{font-size:12px; color:var(--text-faint); background:var(--panel-2); border:1px dashed var(--border); padding:10px 13px; border-radius:9px; margin-bottom:16px; line-height:1.5;}

/* Utility */

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen">
  <div class="login-glow"></div>
  <div class="login-glow two"></div>
  <div class="login-card">
    <div class="login-eyebrow">Data Integration Lab</div>
    <div class="login-title">ORACLE <span>ARCS</span></div>

    <div class="login-tagline">"Connect. Map. Validate. Load."</div>

    <div class="login-form">
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="trainee.analyst" value="trainee.analyst">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••" value="••••••••">

      <div class="field">
        <label>Role</label>

          <option>Reconciliation Administrator</option>
          <option>Finance Systems Trainee</option>
          <option>Implementation Consultant</option>

      </div>
      <button class="btn btn-primary btn-block" onclick="enterLab()">Enter Integration Lab →</button>
    </div>

    <div class="login-footer">
      <div class="bisp-brand">
        <img src="data:image/jpeg;base64,LOGO_BASE64_PLACEHOLDER" alt="BISP Trainings logo">
        <div class="bisp-brand-text"><b>BISP Trainings</b><br>www.bisptrainings.com · +91 769-409-5404</div>

</div>

function baseChartOptions(extra){
  return Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{labels:{color:'#93A0BD', font:{family:'Inter', size:11}}} },
    scales:{
      x:{ticks:{color:'#5C6A8C', font:{size:10}}, grid:{color:'rgba(255,255,255,0.04)'}},
      y:{ticks:{color:'#5C6A8C', font:{size:10}}, grid:{color:'rgba(255,255,255,0.04)'}}

  }, extra||{});
}

  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  new Chart(ctx, { type, data:{labels, datasets}, options: opts || baseChartOptions() });
}

  const w = state.wizard;

      ${WIZ_STEPS.map((s,i)=>`<div class="wstep ${i<w.step?'done':i===w.step?'current':''}" onclick="jumpWizard(${i})"><span class="num">${i<w.step?'✓':i+1}</span>${s}</div>`).join('')}

function runDataLoad(){
  const stages = ['ReadingSource','Importing','Mapping','Validating','Loading'];
  let i=0;
  function step(){
    if(i>=stages.length){
      state.loadRun = {done:true, processed:14820, loaded:14370, rejected:312, warnings:138, duration: (Math.round(Math.random()*2)+3)+'m '+(10+Math.round(Math.random()*40))+'s'};
      const job = {id:'JOB-'+(10236+state.jobs.length), source: state.wizard.source ? SOURCES.find(s=>s.id===state.wizard.source).name : 'Flat File', rule: 'SIMULATED_LOAD', start:'2026-08-17 (Simulated)', duration: state.loadRun.duration, records: state.loadRun.processed, status: state.loadRun.rejected>0?'WARNING':'SUCCESS', errors: state.loadRun.rejected};
      state.jobs.unshift(job);
      showLoadResults();
      return;
    }
    const key = stages[i];
    let p=0;
    const iv = setInterval(()=>{
      p += 20;
      const bar = document.getElementById('bar-'+key), pc = document.getElementById('pct-'+key);
      if(bar){ bar.style.width = Math.min(p,100)+'%'; pc.textContent = Math.min(p,100)+'%'; }
      if(p>=100){ clearInterval(iv); i++; step(); }
    }, 90);
  }
  step();
}
function showLoadResults(){
  const r = state.loadRun;
  document.getElementById('loadResults').innerHTML = `
    <div class="grid grid-4">
      ${kpiCard('Records Processed', r.processed.toLocaleString(), '', '', true)}
      ${kpiCard('Records Loaded', r.loaded.toLocaleString(), '', '', true)}
      ${kpiCard('Rejected', r.rejected.toLocaleString(), '', '', true)}
      ${kpiCard('Warnings / Duration', r.warnings + ' / ' + r.duration, '', '', true)}
    </div>
  `;
}

      <div class="quiz-progress">QUESTION ${e.current+1} OF ${EXAM_QUESTIONS.length}</div>
      <div class="quiz-q">${q.q}</div>
      ${q.opts.map((o,i)=>`<button class="quiz-opt ${answered ? (i===q.correct?'correct':(e.answers[e.current]===i?'wrong':'')) : ''}" ${answered?'disabled':''} onclick="answerExam(${i})">${o}</button>`).join('')}
      <div class="quiz-explain" style="${answered?'display:block;':''}">${q.exp}</div>
      <div class="btn-row">
        ${answered ? `<button class="btn btn-primary btn-sm" onclick="nextExamQ()">${e.current<EXAM_QUESTIONS.length-1?'Next Question →':'Finish Exam →'}</button>` : ''}
      </div>
    </div>
  `);
}
function answerExam(i){ state.exam.answers[state.exam.current]=i; renderExam(); }
function nextExamQ(){ if(state.exam.current<EXAM_QUESTIONS.length-1){ state.exam.current++; } else { state.exam.finished=true; } renderExam(); }
function restartExam(){ state.exam = {current:0, answers:new Array(EXAM_QUESTIONS.length).fill(null), finished:false}; renderExam(); }

/* ===================== FINAL SCORECARD ===================== */
function renderScorecard(){
  const w = state.wizard;
  const configScore = w.ruleSaved ? 100 : Math.round((w.step/10)*100);
  const mapVals = Object.values(w.mappingsDone);
  const mappingScore = Math.round((mapVals.filter(Boolean).length / mapVals.length) * 100);
  const validationScore = state.validation.ran ? 100 : 40;
  const loadScore = state.loadRun.done ? Math.round((state.loadRun.loaded/state.loadRun.processed)*100) : 0;
  const troubleshootingScore = (state.errorOpen!==null ? 50:0) + (state.errorLabCorrect ? 50:0);
  const scenarioScore = Math.round((state.scenarioDone.filter(Boolean).length/SCENARIO_STEPS.length)*100);
  const examAnswered = state.exam.answers.filter(a=>a!==null).length;
  const examScore = examAnswered>0 ? Math.round((state.exam.answers.filter((a,i)=>a===EXAM_QUESTIONS[i].correct).length/EXAM_QUESTIONS.length)*100) : 0;
  const rows = [['Configuration Score', configScore],['Mapping Score', mappingScore],['Validation Score', validationScore],['Load Score', loadScore],['Troubleshooting Score', troubleshootingScore],['Scenario Score', scenarioScore],['Exam Score', examScore]];
  const overall = Math.round(rows.reduce((a,r)=>a+r[1],0)/rows.length);
  mount(`
    ${pageHead('Screen 27 · Final Scorecard', 'Final Scorecard', 'A roll-up of your progress across configuration, mapping, validation, load, troubleshooting, scenario, and exam work.')}
    <div class="card">
      ${rows.map(r=>`<div class="score-row"><div class="name">${r[0]}</div><div class="bar-mini"><div class="progress-track"><div class="progress-fill" style="width:${r[1]}%"></div></div></div><div class="mono" style="width:44px; text-align:right;">${r[1]}%</div></div>`).join('')}
    </div>
    <div class="badge-final">
      <div class="trophy">🏆</div>
      <div class="btitle">ORACLE ARCS DATA INTEGRATION LAB</div>
      <div class="bsub">TRAINING COMPLETE · OVERALL SCORE ${overall}%</div>
    </div>
  `);
}
</script>
</body>
</html>
